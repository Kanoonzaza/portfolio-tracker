// ─── Sector cache: per-ticker industry sector from Yahoo Finance ───
//   Cached indefinitely in localStorage (sectors rarely change for a given
//   ticker). Refreshed on first encounter only.
const SECTOR_CACHE_KEY='ptv3-sector-cache';
function loadSectorCache(){
  try{ return JSON.parse(localStorage.getItem(SECTOR_CACHE_KEY)||'{}'); }catch{ return{}; }
}
function saveSectorCache(c){
  try{ localStorage.setItem(SECTOR_CACHE_KEY, JSON.stringify(c)); }catch{}
}
let _sectorRefreshInProgress=false;
async function fetchTickerSector(sym){
  const url=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(sym)}&newsCount=0&quotesCount=1`;
  const proxied=proxyWrap(url)||url;
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(proxied,{cache:'no-store',signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) return null;
    const j=await r.json();
    const q=j?.quotes?.[0];
    if(!q) return null;
    return{
      sector: q.sector || q.sectorDisp || null,
      industry: q.industry || q.industryDisp || null,
      name: q.longname || q.shortname || null,
      // Currency: Yahoo search rarely returns it; fall back to USD for US tickers,
      // and infer from explicit suffix patterns (-USD = crypto traded in USD).
      currency: q.currency || null,
      exchange: q.exchDisp || q.exchange || null,
    };
  }catch(e){ return null; }
}
async function refreshSectorCache(symbols){
  if(!symbols.length || _sectorRefreshInProgress) return 0;
  _sectorRefreshInProgress=true;
  const cache=loadSectorCache();
  let updated=0;
  try{
    for(const sym of symbols){
      if(cache[sym]) continue; // already cached — skip
      const info=await fetchTickerSector(sym);
      if(info){
        cache[sym]={...info, fetchedAt:Date.now()};
        saveSectorCache(cache);
        window.dispatchEvent(new CustomEvent('sector-cache-updated'));
        updated++;
      } else {
        cache[sym]={sector:null, industry:null, fetchedAt:Date.now()};
        saveSectorCache(cache);
      }
      await new Promise(r=>setTimeout(r,200));
    }
  } finally {
    _sectorRefreshInProgress=false;
  }
  return updated;
}

// Fetch news for a single ticker from Yahoo Finance.
// Returns an array of {title, link, publisher, time(ms), summary} or [] on failure.
async function fetchNewsForTicker(sym){
  const baseUrl=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(sym)}&newsCount=8&quotesCount=0`;
  const proxied=proxyWrap(baseUrl)||baseUrl;
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), 8000);
    const r=await fetch(proxied,{cache:'no-store',signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) return[];
    const j=await r.json();
    const items=j?.news||[];
    return items.map(n=>({
      title: n.title || '',
      link: n.link || '',
      publisher: n.publisher || '',
      time: (n.providerPublishTime || 0) * 1000, // seconds → ms
      summary: n.summary || '',
      sym,
    })).filter(n=>n.title && n.link);
  }catch(e){
    console.warn(`[News] Fetch failed for ${sym}:`, e.message);
    return[];
  }
}

function fmtAgo(ms){
  if(!ms) return '';
  const sec=Math.floor((Date.now()-ms)/1000);
  if(sec<60) return `${sec}s ago`;
  const min=Math.floor(sec/60);
  if(min<60) return `${min}m ago`;
  const hr=Math.floor(min/60);
  if(hr<24) return `${hr}h ago`;
  const day=Math.floor(hr/24);
  if(day<7) return `${day}d ago`;
  return new Date(ms).toLocaleDateString();
}

// Module-level news refresh state — shared by background fetch + NewsPage.
// Single-flight guard prevents concurrent fetches racing each other.
let _newsRefreshInProgress=false;

// Refresh the news cache for the given symbols. Returns the number of tickers
// that were actually fetched. Skips tickers whose cache is fresh (<24h old)
// unless force=true. Emits a 'news-cache-updated' window event after every
// individual ticker fetch so any open NewsPage can re-render with new data.
async function refreshNewsCache(symbols, force=false, onProgress){
  if(!symbols.length) return 0;
  if(_newsRefreshInProgress) return 0; // single-flight
  // Drop muted tickers — we don't want news for those
  const muted=loadMutedNews();
  symbols=symbols.filter(s=>!muted.has(s));
  if(!symbols.length) return 0;
  _newsRefreshInProgress=true;
  window.dispatchEvent(new CustomEvent('news-fetch-state',{detail:{fetching:true}}));
  const cache=loadNewsCache();
  const cutoff=Date.now()-NEWS_MAX_AGE_MS;
  let updated=0;
  try{
    for(let i=0;i<symbols.length;i++){
      const sym=symbols[i];
      onProgress?.({current:i+1, total:symbols.length, sym});
      const existing=cache[sym];
      if(!force && existing && existing.fetchedAt>cutoff) continue;
      const items=await fetchNewsForTicker(sym);
      cache[sym]={fetchedAt:Date.now(), items};
      saveNewsCache(cache);
      window.dispatchEvent(new CustomEvent('news-cache-updated',{detail:{sym}}));
      updated++;
      // Be kind to the API — small delay between requests
      await new Promise(r=>setTimeout(r,250));
    }
  } finally {
    _newsRefreshInProgress=false;
    window.dispatchEvent(new CustomEvent('news-fetch-state',{detail:{fetching:false}}));
  }
  return updated;
}

// Read-state cache: which news items has the user clicked through?
// Stored as a Set of link URLs in localStorage so it persists across sessions.
const NEWS_READ_KEY='ptv3-news-read';
function loadReadSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(NEWS_READ_KEY)||'[]')); }
  catch{ return new Set(); }
}
function saveReadSet(set){
  try{ localStorage.setItem(NEWS_READ_KEY, JSON.stringify([...set])); }catch{}
}

function NewsPage({portfolio}){
  const holdings=portfolio?.holdings||[];
  const allSymbols=useMemo(()=>[...new Set(holdings.map(h=>h.symbol).filter(Boolean))],[holdings]);
  const[cache,setCache]=useState(loadNewsCache());
  const[fetching,setFetching]=useState(false);
  const[progress,setProgress]=useState(null);
  // Filter controls
  const[search,setSearch]=useState('');
  const[hideRead,setHideRead]=useState(false);
  const[readSet,setReadSet]=useState(()=>loadReadSet());
  // Muted tickers — news for these is hidden + not fetched
  const[mutedSet,setMutedSet]=useState(()=>loadMutedNews());
  const[showMuted,setShowMuted]=useState(false); // toggle to reveal muted section

  // Active = symbols whose news we DO want to follow
  const symbols=useMemo(()=>allSymbols.filter(s=>!mutedSet.has(s)),[allSymbols,mutedSet]);
  const mutedSymbols=useMemo(()=>allSymbols.filter(s=>mutedSet.has(s)),[allSymbols,mutedSet]);

  // Listen for background-fetch updates AND fetch-state changes so the UI
  // reflects live progress / disables Refresh while a fetch is in flight.
  useEffect(()=>{
    const onCacheUpdate=()=>setCache(loadNewsCache());
    const onFetchState=e=>{
      setFetching(!!e.detail?.fetching);
      if(!e.detail?.fetching) setProgress(null);
    };
    window.addEventListener('news-cache-updated', onCacheUpdate);
    window.addEventListener('news-fetch-state', onFetchState);
    return()=>{
      window.removeEventListener('news-cache-updated', onCacheUpdate);
      window.removeEventListener('news-fetch-state', onFetchState);
    };
  },[]);

  // On mount + when symbols change: ensure a fetch is triggered if any ticker
  // has no cache entry. refreshNewsCache has a single-flight guard so the
  // duplicate call (vs. the App's background fetch) is harmless.
  useEffect(()=>{
    if(!symbols.length) return;
    const cacheNow=loadNewsCache();
    const missingOrStale=symbols.some(s=>!cacheNow[s] || (Date.now()-cacheNow[s].fetchedAt > NEWS_MAX_AGE_MS));
    if(missingOrStale){
      refresh(false);
    }
    // eslint-disable-next-line
  },[symbols.join(',')]);

  // Manual refresh from the button — drives the shared refreshNewsCache.
  async function refresh(force=false){
    if(!symbols.length) return;
    setFetching(true);
    setProgress({current:0, total:symbols.length});
    try{
      await refreshNewsCache(symbols, force, p=>setProgress(p));
    }catch(e){
      console.error('[News page] Refresh failed:',e);
    }
    setCache(loadNewsCache());
    setProgress(null);
    setFetching(false);
  }

  function muteSym(sym){
    const next=new Set(mutedSet); next.add(sym);
    setMutedSet(next); saveMutedNews(next);
  }
  function unmuteSym(sym){
    const next=new Set(mutedSet); next.delete(sym);
    setMutedSet(next); saveMutedNews(next);
  }
  // Called by the UpcomingEvents strip when a ticker chip is clicked.
  // Now that the feed is flat, just type the ticker into the search box —
  // that surfaces all its news (including older than the 2-day default).
  function focusSymbol(sym){
    setSearch(sym);
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),60);
  }

  // Flat chronological feed across all followed tickers.
  //   - no search   → only items from the last NEWS_RECENT_MS (2 days)
  //   - with search → ALL matching items across all dates (so older news for a
  //                   specific stock surfaces when you type its ticker / a keyword)
  const items=useMemo(()=>{
    const q=search.trim().toLowerCase();
    const recentCutoff=Date.now()-NEWS_RECENT_MS;
    let flat=[];
    for(const sym of symbols){
      const arr=cache[sym]?.items||[];
      for(const n of arr) flat.push({...n, sym});
    }
    flat.sort((a,b)=>(b.time||0)-(a.time||0));
    if(q){
      flat=flat.filter(n=>(n.title||'').toLowerCase().includes(q)
        ||(n.publisher||'').toLowerCase().includes(q)
        ||(n.summary||'').toLowerCase().includes(q)
        ||(n.sym||'').toLowerCase().includes(q));
    }else{
      flat=flat.filter(n=>(n.time||0)>recentCutoff);
    }
    if(hideRead) flat=flat.filter(n=>!readSet.has(n.link));
    return flat;
  },[cache,symbols,search,hideRead,readSet]);

  const allItems=items;

  function markRead(link){
    if(readSet.has(link)) return;
    const next=new Set(readSet); next.add(link);
    setReadSet(next); saveReadSet(next);
  }
  function markAllRead(){
    const next=new Set(readSet);
    allItems.forEach(n=>next.add(n.link));
    setReadSet(next); saveReadSet(next);
  }
  async function clearReadHistory(){
    if(!(await uiConfirm('Mark all news as unread?'))) return;
    setReadSet(new Set()); saveReadSet(new Set());
  }

  const totalCachedItems=symbols.reduce((s,sym)=>s+((cache[sym]?.items||[]).length),0);
  const unreadCount=symbols.reduce((s,sym)=>s+((cache[sym]?.items||[]).filter(n=>!readSet.has(n.link)).length),0);

  // Find oldest cache timestamp across active symbols (for "last updated" line)
  const oldestFetch=useMemo(()=>{
    const times=symbols.map(s=>cache[s]?.fetchedAt).filter(Boolean);
    return times.length ? Math.min(...times) : null;
  },[cache, symbols]);

  if(!allSymbols.length){
    return(
      <div>
        <div className="ph"><h1 className="pt">News</h1><p className="ps">Daily news summary for your holdings</p></div>
        <div className="card">
          <div className="empty">
            <div className="empty-i">📰</div>
            <div className="empty-t">No holdings to track</div>
            <div className="empty-s">Add holdings in the Holdings page first, then come back here to see news for each of them.</div>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div>
      <div className="ph">
        <h1 className="pt">News</h1>
        <p className="ps">
          {search.trim()
            ? `Searching all cached news · ${symbols.length} followed`
            : `Last 2 days · ${symbols.length} followed`}
          {mutedSymbols.length>0?` · ${mutedSymbols.length} muted`:''}
          {oldestFetch && ` · last refreshed ${fmtAgo(oldestFetch)}`}
          <span style={{color:'var(--dim)',marginLeft:6}}>· auto-deleted after 7 days · type a ticker to see older news</span>
        </p>
      </div>
      <div className="toolbar" style={{gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-primary" onClick={()=>refresh(true)} disabled={fetching||!symbols.length}>
          {fetching ? '⟳ Fetching…' : '↻ Refresh now'}
        </button>
        <input
          type="search"
          placeholder="🔍 Search headlines…"
          value={search}
          onChange={e=>setSearch(e.target.value)}
          style={{padding:'7px 10px',fontSize:13,minWidth:180,flex:'1 1 200px',maxWidth:300}}
        />
        <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'var(--muted)',cursor:'pointer',userSelect:'none'}}>
          <input type="checkbox" checked={hideRead} onChange={e=>setHideRead(e.target.checked)}/>
          Hide read ({readSet.size})
        </label>
        <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
          {mutedSymbols.length>0 && (
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowMuted(v=>!v)} title="Manage muted tickers">
              🔇 Muted ({mutedSymbols.length}) {showMuted?'▴':'▾'}
            </button>
          )}
          {allItems.length>0 && (
            <button className="btn btn-ghost btn-sm" onClick={markAllRead} title="Mark all visible items as read">
              ✓ Mark all read
            </button>
          )}
          {readSet.size>0 && (
            <button className="btn btn-ghost btn-sm" onClick={clearReadHistory} title="Clear read history">
              ⟳ Reset read
            </button>
          )}
        </div>
      </div>
      <div style={{color:'var(--dim)',fontSize:11,marginBottom:10,padding:'0 4px'}}>
        Showing <strong style={{color:'var(--muted)'}}>{allItems.length}</strong> of {totalCachedItems} cached headline{totalCachedItems!==1?'s':''}
        {unreadCount<totalCachedItems && ` · ${unreadCount} unread`}
        {oldestFetch && ` · cache age ${fmtAgo(oldestFetch)}`}
      </div>

      {showMuted && mutedSymbols.length>0 && (
        <div className="card" style={{padding:'12px 16px',marginBottom:12}}>
          <div style={{fontSize:11,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em',fontWeight:700,marginBottom:8}}>
            🔇 Muted tickers — news hidden &amp; not fetched
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {mutedSymbols.map(sym=>(
              <button key={sym} className="btn btn-ghost btn-sm" onClick={()=>unmuteSym(sym)} title={`Unmute ${sym}`}>
                {sym} <span style={{color:'var(--dim)',marginLeft:4}}>✕</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {fetching && progress && (
        <div className="card" style={{padding:'14px 20px',marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12,marginBottom:8}}>
            <span>Fetching news for <strong>{progress.sym||'…'}</strong> ({progress.current}/{progress.total})</span>
          </div>
          <div style={{width:'100%',height:6,background:'rgba(255,255,255,.08)',borderRadius:3,overflow:'hidden'}}>
            <div style={{width:`${Math.round(progress.current/progress.total*100)}%`,height:'100%',background:'var(--blue)',transition:'width 0.3s'}}/>
          </div>
        </div>
      )}

      {/* Earnings + ex-dividend dates strip (merged in from the old Calendar page) */}
      <UpcomingEvents symbols={allSymbols} mutedSet={mutedSet} onFilterSym={focusSymbol}/>

      {symbols.length===0 ? (
        <div className="card">
          <div className="empty">
            <div className="empty-i">🔇</div>
            <div className="empty-t">All tickers are muted</div>
            <div className="empty-s">Click 🔇 Muted above and unmute any ticker to see its news again.</div>
          </div>
        </div>
      ) : totalCachedItems===0 && !fetching ? (
        <div className="card">
          <div className="empty">
            <div className="empty-i">📰</div>
            <div className="empty-t">No news cached yet</div>
            <div className="empty-s" style={{maxWidth:480,margin:'0 auto'}}>
              Following <strong>{symbols.length}</strong> ticker{symbols.length!==1?'s':''}: {symbols.slice(0,8).join(', ')}{symbols.length>8?` +${symbols.length-8} more`:''}.<br/>
              Click <strong>↻ Refresh now</strong> above to fetch headlines from Yahoo Finance.
              <div style={{marginTop:10,fontSize:11,color:'var(--dim)'}}>
                If refresh fails, make sure you're running via <code style={{background:'rgba(0,0,0,.3)',padding:'1px 4px',borderRadius:3}}>start-portfolio-tracker.bat</code> (URL bar must show <code>localhost:8000</code>, not <code>file://</code>).
              </div>
            </div>
          </div>
        </div>
      ) : items.length===0 ? (
        <div className="card">
          <div className="empty">
            <div className="empty-i">📰</div>
            <div className="empty-t">{search.trim()?'No headlines match your search':'No news in the last 2 days'}</div>
            <div className="empty-s">
              {search.trim()
                ?'Try a different keyword or clear the search to see the latest headlines.'
                :'Type a ticker symbol in the search box above to surface older headlines for a specific stock.'}
            </div>
          </div>
        </div>
      ) : (
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{display:'grid',gap:1,background:'var(--border)'}}>
            {items.map((n,i)=>{
              const isRead=readSet.has(n.link);
              return(
                <a key={n.link+i} href={n.link} target="_blank" rel="noopener noreferrer"
                  onClick={()=>markRead(n.link)}
                  style={{display:'block',padding:'12px 16px',textDecoration:'none',color:'inherit',background:'var(--bg2)',transition:'background .15s, opacity .15s',opacity:isRead?0.55:1}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(59,130,246,.05)'}
                  onMouseLeave={e=>e.currentTarget.style.background='var(--bg2)'}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5,flexWrap:'wrap'}}>
                    <span
                      onClick={e=>{e.preventDefault();e.stopPropagation();setSearch(n.sym);window.scrollTo({top:0,behavior:'smooth'});}}
                      style={{background:'rgba(59,130,246,.15)',color:'var(--blue)',padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:700,cursor:'pointer'}}
                      title={`Show all cached news for ${n.sym}`}>
                      {n.sym}
                    </span>
                    <span style={{color:'var(--dim)',fontSize:11}}>{n.publisher}</span>
                    {isRead && <span style={{color:'var(--dim)',fontSize:10,fontStyle:'italic'}}>· read</span>}
                    <span style={{color:'var(--dim)',fontSize:11,marginLeft:'auto'}}>{fmtAgo(n.time)}</span>
                  </div>
                  <div style={{fontSize:13,fontWeight:isRead?500:600,lineHeight:1.4}}>{n.title}</div>
                  {n.summary && (
                    <div style={{fontSize:12,color:'var(--muted)',lineHeight:1.5,marginTop:5,
                      display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>
                      {n.summary}
                    </div>
                  )}
                </a>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Settings page ─── */
function NotificationsSettings(){
  const[perm,setPerm]=useState(getNotificationPermission());
  useEffect(()=>{
    // Some browsers don't fire an event when permission changes — poll lightly
    const t=setInterval(()=>setPerm(getNotificationPermission()),2000);
    return()=>clearInterval(t);
  },[]);
  async function ask(){
    const next=await requestNotificationPermission();
    setPerm(next);
    if(next==='granted'){
      try{ notify('Notifications enabled','You’ll get alerts here when price targets and EMA crosses fire','perm-test'); }catch{}
    }
  }
  const status=(()=>{
    if(perm==='granted') return{label:'✓ Enabled', color:'var(--green)', sub:'Price alerts and EMA-cross triggers will show as system notifications.'};
    if(perm==='denied')  return{label:'✕ Blocked', color:'var(--red)',   sub:'Reset the site permission in your browser to re-enable. Alerts still show as in-app toasts.'};
    if(perm==='unsupported') return{label:'Unsupported', color:'var(--dim)', sub:'This browser doesn’t support the Notification API. Alerts will still show as in-app toasts.'};
    return{label:'Not enabled', color:'var(--muted)', sub:'Without permission, alerts only show as in-app toasts (visible when the app is open).'};
  })();
  return(
    <div className="card"style={{marginBottom:14}}>
      <div style={{padding:'14px 20px',fontWeight:600,fontSize:14,borderBottom:'1px solid var(--border)'}}>🔔 Notifications</div>
      <div className="set-row">
        <div style={{flex:1}}>
          <div className="set-title">Browser notifications · <span style={{color:status.color,fontWeight:700}}>{status.label}</span></div>
          <div className="set-sub">{status.sub}</div>
        </div>
        {perm!=='granted'&&perm!=='denied'&&perm!=='unsupported'&&<button className="btn btn-primary btn-sm"onClick={ask}>Enable</button>}
      </div>
      <div style={{padding:'8px 20px 14px',fontSize:11,color:'var(--dim)',lineHeight:1.6}}>
        Add alerts on individual stocks via the 📈 chart icon on each holding row. Each alert fires once when the live price crosses the target; reset it from the chart modal to re-arm.
      </div>
    </div>
  );
}

function SettingsPage({data,onRenamePortfolio,onDeletePortfolio,onAddPortfolio,onClearAll,onSetCurrency,user,syncing}){
  const fRef=useRef();
  const[editingPort,setEditingPort]=useState(null);
  function exportJSON(){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`portfolio_${today()}.json`;a.click();URL.revokeObjectURL(url);
  }
  function importJSON(file){
    const r=new FileReader();
    r.onload=async e=>{
      let d;
      try{ d=JSON.parse(e.target.result); }
      catch{ uiAlert('Could not parse file.'); return; }
      if(!d.portfolios){ uiAlert('Invalid file.'); return; }
      const ok=await uiConfirm(`Import data with ${d.portfolios.length} portfolio(s)? Replaces current data.`,{danger:true,okLabel:'Replace'});
      if(!ok) return;
      localStorage.setItem(STORE,JSON.stringify(d));
      location.reload();
    };
    r.readAsText(file);
  }
  return(
    <div>
      <div className="ph"><h1 className="pt">Settings</h1></div>

      <div className="card"style={{marginBottom:14}}>
        <div style={{padding:'14px 20px',fontWeight:600,fontSize:14,borderBottom:'1px solid var(--border)'}}>☁ Cloud Sync</div>
        {user ? (
          <div style={{padding:'16px 20px'}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
              {user.photoURL
                ? <img src={user.photoURL} style={{width:44,height:44,borderRadius:'50%',objectFit:'cover'}}/>
                : <div style={{width:44,height:44,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:18,color:'#fff'}}>{user.displayName?.[0]}</div>
              }
              <div>
                <div style={{fontWeight:600}}>{user.displayName}</div>
                <div style={{fontSize:12,color:'var(--dim)'}}>{user.email}</div>
                <div style={{fontSize:11,marginTop:2,color:syncing?'var(--amber)':'var(--green)'}}>{syncing?'⟳ Saving to cloud…':'✓ All changes synced'}</div>
              </div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={()=>window._fb?.signOut()}>Sign Out</button>
          </div>
        ) : (
          <div style={{padding:'16px 20px'}}>
            <p style={{fontSize:13,color:'var(--muted)',marginBottom:12}}>Sign in to sync your portfolios across all devices in real time.</p>
            <button className="btn btn-primary" onClick={()=>window._fb?.signIn().catch(()=>{})}>Sign in with Google</button>
          </div>
        )}
      </div>

      <div className="card"style={{marginBottom:14}}>
        <div style={{padding:'14px 20px',fontWeight:600,fontSize:14,borderBottom:'1px solid var(--border)'}}>Portfolios</div>
        {data.portfolios.map(p=>(
          <div key={p.id}className="set-row">
            <div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:10,height:10,borderRadius:'50%',background:p.color||'#3b82f6'}}/>
                {editingPort===p.id
                  ?<input defaultValue={p.name}autoFocus onBlur={e=>{onRenamePortfolio(p.id,e.target.value);setEditingPort(null);}}onKeyDown={e=>e.key==='Enter'&&e.target.blur()}style={{width:140,padding:'3px 7px',fontSize:13}}/>
                  :<span style={{fontWeight:500,fontSize:14}}>{p.name}</span>
                }
              </div>
              <div className="set-sub">{p.holdings.length} holdings</div>
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-ghost btn-sm"onClick={()=>setEditingPort(p.id)}>Rename</button>
              {data.portfolios.length>1&&<button className="btn btn-ghost btn-sm"style={{color:'var(--red)'}}onClick={async()=>{ if(await uiConfirm(`Delete "${p.name}" and all its holdings?`,{danger:true,okLabel:'Delete'})) onDeletePortfolio(p.id); }}>Delete</button>}
            </div>
          </div>
        ))}
        <div style={{padding:'12px 20px'}}><button className="btn btn-ghost"onClick={async()=>{const n=await uiPrompt('Name for the new portfolio:','',{title:'New Portfolio',placeholder:'e.g. Retirement',okLabel:'Create'});if(n?.trim())onAddPortfolio(n.trim());}}>+ New Portfolio</button></div>
      </div>
      <div className="card"style={{marginBottom:14}}>
        <div style={{padding:'14px 20px',fontWeight:600,fontSize:14,borderBottom:'1px solid var(--border)'}}>💱 Display Currency</div>
        <div className="set-row">
          <div>
            <div className="set-title">Show portfolio values in</div>
            <div className="set-sub">All amounts are stored in USD; this only changes how they display. Exchange rate cached for 6h via open.er-api.com.</div>
          </div>
          <select value={data.displayCurrency||'USD'} onChange={e=>onSetCurrency(e.target.value)} style={{padding:'8px 12px',fontSize:13,minWidth:120}}>
            <option value="USD">🇺🇸 USD ($)</option>
            <option value="THB">🇹🇭 THB (฿)</option>
            <option value="EUR">🇪🇺 EUR (€)</option>
            <option value="GBP">🇬🇧 GBP (£)</option>
            <option value="JPY">🇯🇵 JPY (¥)</option>
            <option value="HKD">🇭🇰 HKD</option>
            <option value="SGD">🇸🇬 SGD</option>
            <option value="CNY">🇨🇳 CNY (¥)</option>
            <option value="KRW">🇰🇷 KRW (₩)</option>
            <option value="TWD">🇹🇼 TWD</option>
          </select>
        </div>
        {data.displayCurrency && data.displayCurrency!=='USD' && (() => {
          let cache={};
          try{ cache=JSON.parse(localStorage.getItem(FX_CACHE_KEY)||'{}'); }catch{}
          const entry=cache[data.displayCurrency];
          return entry ? (
            <div style={{padding:'10px 20px',fontSize:12,color:'var(--dim)',borderTop:'1px solid var(--border)'}}>
              Current rate: <strong style={{color:'var(--text)'}}>1 USD = {entry.rate.toFixed(4)} {data.displayCurrency}</strong> · cached {fmtAgo(entry.fetchedAt)}
            </div>
          ) : null;
        })()}
      </div>
      <NotificationsSettings/>
      <div className="card"style={{marginBottom:14}}>
        <div style={{padding:'14px 20px',fontWeight:600,fontSize:14,borderBottom:'1px solid var(--border)'}}>Data</div>
        <div className="set-row"><div><div className="set-title">Export All Data</div><div className="set-sub">All portfolios as JSON</div></div><button className="btn btn-ghost"onClick={exportJSON}>⬇ Export</button></div>
        <div className="set-row"><div><div className="set-title">Import Data</div><div className="set-sub">Restore from a JSON backup</div></div><button className="btn btn-ghost"onClick={()=>fRef.current.click()}>⬆ Import</button></div>
        <div className="set-row"><div><div className="set-title"style={{color:'var(--red)'}}>Clear All Data</div><div className="set-sub">Delete everything permanently</div></div><button className="btn btn-ghost"style={{color:'var(--red)',borderColor:'var(--red)'}}onClick={async()=>{ if(await uiConfirm('Delete ALL data? Cannot be undone.',{danger:true,okLabel:'Delete everything'})) onClearAll(); }}>🗑 Clear</button></div>
        <input ref={fRef}type="file"accept=".json"style={{display:'none'}}onChange={e=>e.target.files[0]&&importJSON(e.target.files[0])}/>
      </div>

      {/* Automatic backups card */}
      <div className="card"style={{marginBottom:14}}>
        <div style={{padding:'14px 20px',fontWeight:600,fontSize:14,borderBottom:'1px solid var(--border)'}}>💾 Automatic Backups</div>
        {(()=>{
          const backups=loadBackups();
          if(!backups.length){
            return(
              <div style={{padding:'16px 20px',fontSize:12,color:'var(--dim)'}}>
                No automatic backups yet. The app snapshots your data to localStorage every ~12 hours when you make changes. Up to 3 snapshots are kept.
              </div>
            );
          }
          return(
            <>
              <div style={{padding:'10px 20px',fontSize:12,color:'var(--muted)',borderBottom:'1px solid var(--border)'}}>
                {backups.length} snapshot{backups.length!==1?'s':''} kept · most recent <strong>{fmtAgo(backups[0].savedAt)}</strong> · auto-snaps every ~12h when data changes
              </div>
              {backups.map((b,i)=>{
                let parsed=null;
                try{ parsed=JSON.parse(b.data); }catch{}
                const holdingsCount=parsed?.portfolios?.reduce((s,p)=>s+(p.holdings?.length||0),0)||0;
                return(
                  <div key={i} className="set-row">
                    <div>
                      <div className="set-title">{new Date(b.savedAt).toLocaleString()}</div>
                      <div className="set-sub">{holdingsCount} holding{holdingsCount!==1?'s':''} · {(parsed?.portfolios?.length||0)} portfolio{(parsed?.portfolios?.length||0)!==1?'s':''} · {(b.data.length/1024).toFixed(1)}KB</div>
                    </div>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>{
                        const blob=new Blob([b.data],{type:'application/json'});
                        const url=URL.createObjectURL(blob);
                        const a=document.createElement('a');
                        a.href=url; a.download=`portfolio_backup_${b.date}_${b.savedAt}.json`;
                        a.click(); URL.revokeObjectURL(url);
                      }}>⬇ Download</button>
                      <button className="btn btn-ghost btn-sm" style={{color:'var(--amber)'}} onClick={async()=>{
                        if(!(await uiConfirm(`Restore from snapshot taken ${new Date(b.savedAt).toLocaleString()}? Current data will be replaced.`,{danger:true,okLabel:'Restore'}))) return;
                        try{ localStorage.setItem(STORE,b.data); location.reload(); }catch(e){ uiAlert('Restore failed: '+e.message); }
                      }}>↻ Restore</button>
                    </div>
                  </div>
                );
              })}
            </>
          );
        })()}
      </div>
      <div className="card">
        <div style={{padding:'14px 20px',fontWeight:600,fontSize:14,borderBottom:'1px solid var(--border)'}}>About</div>
        <div style={{padding:'14px 20px',fontSize:13,color:'var(--muted)',lineHeight:1.7}}>
          Data is stored locally in your browser. Prices from Yahoo Finance via CORS proxy, refreshed every 30 seconds automatically.<br/>
          <strong style={{color:'var(--text)'}}>Tip:</strong> Click any holding row to expand its trade &amp; dividend history.
        </div>
      </div>
    </div>
  );
}

/* ─── Stock Chart Modal ───────────────────────────────────────────────
   Per-stock price chart with EMA 50 / EMA 200 overlays, price alerts
   management, and EMA-trigger toggles. Opened from the chart icon on
   each holdings row. */
const CHART_TIMEFRAMES=[
  {id:'1mo', label:'1M', showEma50:false, showEma200:false},
  {id:'3mo', label:'3M', showEma50:true,  showEma200:false},
  {id:'6mo', label:'6M', showEma50:true,  showEma200:false},
  {id:'1y',  label:'1Y', showEma50:true,  showEma200:true},
  {id:'5y',  label:'5Y', showEma50:true,  showEma200:true},
];
function StockChartModal({holding, livePrice, onClose, onUpdateHolding}){
  const[range,setRange]=useState('1y');
  const[hist,setHist]=useState(null); // {closes,dates}
  const[fetching,setFetching]=useState(false);
  const[err,setErr]=useState(null);
  const canvasRef=useRef(null);
  const chartRef=useRef(null);

  // Local form state for adding a new alert
  const[newAlertCondition,setNewAlertCondition]=useState('above');
  const[newAlertPrice,setNewAlertPrice]=useState('');

  const tfMeta=CHART_TIMEFRAMES.find(t=>t.id===range)||CHART_TIMEFRAMES[3];
  const alerts=holding.alerts||[];
  const emaTriggers=holding.emaTriggers||{priceCrossEma50:false,priceCrossEma200:false,goldenDeathCross:false};

  // Fetch historical data when range changes
  useEffect(()=>{
    let cancelled=false;
    setFetching(true);
    setErr(null);
    fetchHistoricalPrices(holding.symbol, range).then(data=>{
      if(cancelled) return;
      setFetching(false);
      if(!data){ setErr('Could not fetch chart data'); setHist(null); return; }
      setHist(data);
    });
    return()=>{cancelled=true;};
  },[holding.symbol, range]);

  // Render Chart.js line chart
  useEffect(()=>{
    if(!canvasRef.current) return;
    chartRef.current?.destroy();
    chartRef.current=null;
    if(!hist || !hist.closes.length) return;
    const ema50  = tfMeta.showEma50  ? calculateEMA(hist.closes, 50)  : null;
    const ema200 = tfMeta.showEma200 ? calculateEMA(hist.closes, 200) : null;
    const datasets=[{
      label:'Price', data:hist.closes,
      borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,.12)',
      fill:true, tension:0.15, pointRadius:0, borderWidth:2,
    }];
    if(ema50){
      datasets.push({
        label:'EMA 50', data:ema50,
        borderColor:'#f59e0b', borderWidth:1.5, borderDash:[],
        pointRadius:0, fill:false, tension:0.15,
      });
    }
    if(ema200){
      datasets.push({
        label:'EMA 200', data:ema200,
        borderColor:'#ef4444', borderWidth:1.5, borderDash:[6,4],
        pointRadius:0, fill:false, tension:0.15,
      });
    }
    // Price-alert horizontal lines (constant array per dataset)
    alerts.filter(a=>a.enabled!==false && a.price>0).forEach(a=>{
      datasets.push({
        label:`Alert ${a.condition} ${fmt(a.price)}`,
        data:hist.closes.map(()=>a.price),
        borderColor: a.condition==='above' ? '#22c55e' : '#ef4444',
        borderWidth:1, borderDash:[2,3], pointRadius:0, fill:false,
      });
    });
    chartRef.current=new Chart(canvasRef.current,{
      type:'line',
      data:{labels:hist.dates.map(d=>d.slice(5)), datasets},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{labels:{color:'#94a3b8',usePointStyle:true,pointStyleWidth:8,boxWidth:8,font:{size:11}}},
          tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.raw==null?'—':'$'+Number(ctx.raw).toFixed(2)}`}},
        },
        scales:{
          x:{ticks:{color:'#94a3b8',maxTicksLimit:8,font:{size:10}},grid:{color:'rgba(51,65,85,.4)'}},
          y:{ticks:{color:'#94a3b8',font:{size:10},callback:v=>'$'+v.toFixed(0)},grid:{color:'rgba(51,65,85,.4)'}},
        },
      },
    });
    return()=>{ chartRef.current?.destroy(); chartRef.current=null; };
  },[hist, alerts, tfMeta.showEma50, tfMeta.showEma200]);

  // Cleanup on unmount
  useEffect(()=>()=>{ chartRef.current?.destroy(); chartRef.current=null; },[]);

  function addAlert(){
    const p=parseFloat(newAlertPrice);
    if(!p||p<=0) return;
    const next={...holding, alerts:[...alerts, {
      id:newId(), condition:newAlertCondition, price:p,
      enabled:true, triggered:false, triggeredAt:null,
    }]};
    onUpdateHolding(next);
    setNewAlertPrice('');
  }
  function toggleAlert(aid){
    const next={...holding, alerts:alerts.map(a=>a.id===aid?{...a, enabled:!(a.enabled!==false)}:a)};
    onUpdateHolding(next);
  }
  function resetAlert(aid){
    const next={...holding, alerts:alerts.map(a=>a.id===aid?{...a, triggered:false, triggeredAt:null}:a)};
    onUpdateHolding(next);
  }
  function deleteAlert(aid){
    const next={...holding, alerts:alerts.filter(a=>a.id!==aid)};
    onUpdateHolding(next);
  }
  function toggleEma(key){
    const next={...holding, emaTriggers:{...emaTriggers, [key]:!emaTriggers[key]}};
    onUpdateHolding(next);
  }

  const curPrice=livePrice?.price;
  const dayPct=livePrice?.pct;

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal modal-lg" style={{maxWidth:760}}>
        <div className="mh">
          <div>
            <div className="mt">{holding.symbol} {curPrice!=null && <span style={{fontSize:14,color:'var(--muted)',fontWeight:500,marginLeft:8}}>${curPrice.toFixed(2)}</span>}
              {dayPct!=null && <span style={{fontSize:12,fontWeight:600,marginLeft:8}} className={dayPct>=0?'pos':'neg'}>{dayPct>=0?'+':''}{dayPct.toFixed(2)}%</span>}
            </div>
            <div style={{fontSize:11,color:'var(--dim)',marginTop:2}}>Chart · price alerts · EMA support/resistance</div>
          </div>
          <button className="mx" onClick={onClose}>✕</button>
        </div>

        <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:10}}>
          {CHART_TIMEFRAMES.map(tf=>(
            <button key={tf.id} onClick={()=>setRange(tf.id)}
              className={`btn btn-sm ${range===tf.id?'btn-primary':'btn-ghost'}`}
              style={{padding:'4px 12px',fontSize:11,fontWeight:600}}>
              {tf.label}
            </button>
          ))}
        </div>

        <div style={{position:'relative',height:300,marginBottom:6,background:'var(--bg)',borderRadius:'var(--rs)',padding:'10px 8px'}}>
          {fetching && <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--dim)',fontSize:12,gap:8}}><span className="spin spin-sm"/> Loading…</div>}
          {err && !fetching && <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--red)',fontSize:12}}>{err}</div>}
          {!fetching && !err && hist && <canvas ref={canvasRef}/>}
          {!fetching && !err && !hist && <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--dim)',fontSize:12}}>No data</div>}
        </div>
        <div style={{fontSize:10,color:'var(--dim)',marginBottom:14,display:'flex',gap:14,flexWrap:'wrap'}}>
          <span><span style={{display:'inline-block',width:10,height:2,background:'#3b82f6',verticalAlign:'middle',marginRight:4}}/>Price</span>
          {tfMeta.showEma50  && <span><span style={{display:'inline-block',width:10,height:2,background:'#f59e0b',verticalAlign:'middle',marginRight:4}}/>EMA 50 (support/resistance)</span>}
          {tfMeta.showEma200 && <span><span style={{display:'inline-block',width:10,height:2,background:'#ef4444',verticalAlign:'middle',marginRight:4}}/>EMA 200 (support/resistance)</span>}
          {!tfMeta.showEma200 && <span style={{color:'var(--dim)'}}>EMA 200 needs ≥1Y data</span>}
        </div>

        {/* Price alerts */}
        <div style={{borderTop:'1px solid var(--border)',paddingTop:14,marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:10}}>🔔 Price Alerts</div>
          {alerts.length===0 && <div style={{fontSize:12,color:'var(--dim)',marginBottom:10}}>No alerts set. Add one below — fires when the live price crosses the level.</div>}
          {alerts.map(a=>(
            <div key={a.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'var(--bg)',borderRadius:'var(--rs)',marginBottom:6,fontSize:12,flexWrap:'wrap'}}>
              <span style={{minWidth:14}}>{a.condition==='above'?'▲':'▼'}</span>
              <span style={{fontWeight:600}}>{a.condition==='above'?'Above':'Below'}</span>
              <span style={{fontWeight:700,color:'var(--text)'}}>${Number(a.price).toFixed(2)}</span>
              {a.triggered && <span className="tag" style={{background:'rgba(245,158,11,.18)',color:'#fcd34d'}}>Triggered {a.triggeredAt?new Date(a.triggeredAt).toLocaleDateString():''}</span>}
              {!a.triggered && (a.enabled!==false) && <span className="tag" style={{background:'rgba(34,197,94,.18)',color:'#86efac'}}>Armed</span>}
              {!a.triggered && (a.enabled===false) && <span className="tag" style={{background:'rgba(148,163,184,.18)',color:'#94a3b8'}}>Paused</span>}
              <div style={{marginLeft:'auto',display:'flex',gap:4}}>
                {a.triggered && <button className="btn btn-ghost btn-sm" onClick={()=>resetAlert(a.id)}>Reset</button>}
                <button className="btn btn-ghost btn-sm" onClick={()=>toggleAlert(a.id)}>{a.enabled===false?'Resume':'Pause'}</button>
                <button className="btn-del" onClick={()=>deleteAlert(a.id)} title="Delete">✕</button>
              </div>
            </div>
          ))}
          <div style={{display:'flex',gap:6,alignItems:'center',marginTop:8}}>
            <select value={newAlertCondition} onChange={e=>setNewAlertCondition(e.target.value)} style={{width:110,padding:'7px 8px',fontSize:12}}>
              <option value="above">▲ Above</option>
              <option value="below">▼ Below</option>
            </select>
            <input type="number" step="0.01" min="0" placeholder={curPrice?curPrice.toFixed(2):'Price'}
              value={newAlertPrice} onChange={e=>setNewAlertPrice(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addAlert()}
              style={{flex:1,padding:'7px 9px',fontSize:12}}/>
            <button className="btn btn-primary btn-sm" onClick={addAlert} disabled={!newAlertPrice||!(parseFloat(newAlertPrice)>0)}>+ Add</button>
          </div>
        </div>

        {/* EMA triggers */}
        <div style={{borderTop:'1px solid var(--border)',paddingTop:14}}>
          <div style={{fontSize:11,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:10}}>📐 EMA Support/Resistance Triggers</div>
          <div style={{fontSize:11,color:'var(--dim)',marginBottom:10}}>Notify when the live price crosses an EMA line, or when EMA 50 crosses EMA 200 (golden/death cross). Evaluated on every price refresh.</div>
          {[
            {key:'priceCrossEma50',  label:'Price crosses EMA 50',  hint:'Short-term support/resistance'},
            {key:'priceCrossEma200', label:'Price crosses EMA 200', hint:'Long-term support/resistance'},
            {key:'goldenDeathCross', label:'Golden / Death cross (EMA 50 vs EMA 200)', hint:'Bullish ↑ / bearish ↓ trend signal'},
          ].map(row=>(
            <label key={row.key} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:'var(--bg)',borderRadius:'var(--rs)',marginBottom:6,cursor:'pointer',textTransform:'none',letterSpacing:0,color:'var(--text)',fontSize:12,fontWeight:500}}>
              <input type="checkbox" checked={!!emaTriggers[row.key]} onChange={()=>toggleEma(row.key)} style={{width:16,height:16,margin:0,flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:600}}>{row.label}</div>
                <div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>{row.hint}</div>
              </div>
            </label>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─── App ─── */
function App(){
  const[data,setData]=useState(()=>loadData());
  // Hydrate prices from localStorage immediately — UI shows last-known close
  // before any network fetch completes. New tickers added later will fall
  // through to the soft refresh.
  const[prices,setPrices]=useState(()=>loadPriceCache());
  const[loading,setLoading]=useState(false);
  const[tab,setTab]=useState('home');
  const{toasts,add:toast}=useToast();
  const[lastUpdated,setLastUpdated]=useState(null);
  const dataRef=useRef(data);
  useEffect(()=>{dataRef.current=data;},[data]);
  // Wire the global notify() bridge to our toast system
  useEffect(()=>{ _setToastBridge(toast); return()=>_setToastBridge(null); },[toast]);

  // ── portfolio history (local, not synced) ──
  const[history,setHistory]=useState(loadHistory);
  useEffect(()=>saveHistory(history),[history]);

  // ── Display currency: apply on mount and whenever the user changes it ──
  // We persist the choice in data.displayCurrency. Rate is cached in localStorage
  // and refreshed asynchronously. On mount we use the cached rate immediately so
  // the UI doesn't flicker, then refresh in the background.
  useCurrency(); // subscribes App to currency changes — re-renders propagate to all child components
  useEffect(()=>{
    const ccy=data.displayCurrency||'USD';
    if(ccy==='USD'){ setCurrency('USD',1); return; }
    // Apply cached rate instantly if available
    try{
      const cache=JSON.parse(localStorage.getItem(FX_CACHE_KEY)||'{}');
      if(cache[ccy]?.rate>0) setCurrency(ccy, cache[ccy].rate);
    }catch{}
    // Refresh in background
    fetchFxRate(ccy).then(rate=>{ if(rate) setCurrency(ccy, rate); });
  },[data.displayCurrency]);

  // ── background news fetch ───────────────────────────────────────────────
  // Whenever the set of held symbols changes (and on first mount), kick off
  // a silent background news refresh. Skips tickers whose cache is <24h old,
  // so this is cheap on repeat loads. The NewsPage subscribes to the
  // 'news-cache-updated' event and re-renders live as headlines stream in.
  const portfolioSymbols=useMemo(()=>{
    const s=new Set();
    for(const p of data.portfolios){
      for(const h of (p.holdings||[])) if(h.symbol) s.add(h.symbol);
    }
    return [...s];
  },[data.portfolios]);
  const symbolKey=portfolioSymbols.join(',');
  useEffect(()=>{
    if(!portfolioSymbols.length) return;
    // Delay 2s after mount so we don't compete with the initial price-fetch
    const timer=setTimeout(()=>{
      console.log(`[News/background] Refreshing news cache for ${portfolioSymbols.length} symbols`);
      refreshNewsCache(portfolioSymbols, false).then(updated=>{
        if(updated>0) console.log(`[News/background] Fetched ${updated} ticker(s)`);
      });
      // Also refresh the sector cache for any new tickers (cheap, only fetches missing)
      refreshSectorCache(portfolioSymbols).then(n=>{
        if(n>0) console.log(`[Sector/background] Fetched sector data for ${n} new ticker(s)`);
      });
      // Calendar cache (earnings + ex-dividend dates) — same per-symbol throttling
      refreshCalendarCache(portfolioSymbols, false).then(n=>{
        if(n>0) console.log(`[Calendar/background] Fetched calendar data for ${n} ticker(s)`);
      });
    },2000);
    return()=>clearTimeout(timer);
    // eslint-disable-next-line
  },[symbolKey]);

  // Periodic refresh: every 6 hours, re-check the cache. Catches the case
  // where the app stays open all day and news stories age past 24h.
  useEffect(()=>{
    const interval=setInterval(()=>{
      if(portfolioSymbols.length){
        refreshNewsCache(portfolioSymbols, false);
      }
    }, 6*60*60*1000); // 6 hours
    return()=>clearInterval(interval);
    // eslint-disable-next-line
  },[symbolKey]);

  // ── cloud sync ──
  const[user,setUser]=useState(null);
  const[syncing,setSyncing]=useState(false);
  const unsubRef=useRef(null);
  const syncTimer=useRef(null);
  const fromCloud=useRef(false);

  useEffect(()=>{
    const setup=()=>{
      window._fb.onAuth(u=>{
        setUser(u);
        if(u){
          if(unsubRef.current) unsubRef.current();
          unsubRef.current=window._fb.listen(
            u.uid,
            cloud=>{fromCloud.current=true;setData(cloud);saveData(cloud);},
            ()=>{window._fb.save(u.uid,data).catch(()=>{});}
          );
          toast(`Signed in as ${u.displayName}`,'ok');
        } else {
          if(unsubRef.current){unsubRef.current();unsubRef.current=null;}
          toast('Signed out');
        }
      });
    };
    const run=()=>{
      setup();
      // Consume any pending redirect sign-in result (from signInWithRedirect on iOS)
      window._fb.consumeRedirect().then(result=>{
        if(result?.user) toast(`Welcome, ${result.user.displayName||result.user.email}!`,'ok');
      }).catch(err=>{
        if(err.code!=='auth/no-auth-event') toast(err.message||'Sign-in failed','err');
      });
    };
    if(window._fb) run();
    else window.addEventListener('firebase-ready',run,{once:true});
    return()=>{if(unsubRef.current)unsubRef.current();};
  },[]);

  useEffect(()=>{
    if(!user||!window._fb) return;
    if(fromCloud.current){fromCloud.current=false;return;}
    clearTimeout(syncTimer.current);
    setSyncing(true);
    syncTimer.current=setTimeout(()=>{
      window._fb.save(user.uid,data).then(()=>setSyncing(false)).catch(()=>setSyncing(false));
    },1500);
  },[data,user]);

  const activePortfolio=data.portfolios.find(p=>p.id===data.activePortfolioId)||data.portfolios[0];

  function upd(fn){setData(prev=>{const next=typeof fn==='function'?fn(prev):fn;saveData(next);maybeCreateBackup(next);return next;});}

  // portfolio actions
  const switchPortfolio=id=>upd(d=>({...d,activePortfolioId:id}));
  const addPortfolio=name=>{const id=newId();upd(d=>({...d,portfolios:[...d.portfolios,{id,name,color:COLORS[d.portfolios.length%COLORS.length],holdings:[]}],activePortfolioId:id}));};
  const renamePortfolio=(id,name)=>upd(d=>({...d,portfolios:d.portfolios.map(p=>p.id===id?{...p,name}:p)}));
  const deletePortfolio=id=>{if(data.portfolios.length<=1)return;upd(d=>{const portfolios=d.portfolios.filter(p=>p.id!==id);return{...d,portfolios,activePortfolioId:portfolios[0].id};});};

  // holding actions — helpers that update the active portfolio
  function withPortfolio(fn){upd(d=>({...d,portfolios:d.portfolios.map(p=>p.id===d.activePortfolioId?fn(p):p)}));}
  const addHolding=h=>{withPortfolio(p=>({...p,holdings:[...p.holdings,h]}));toast(`Added ${h.symbol}`,'ok');fetchOne(h.symbol);};
  // Bulk-import variant: for each incoming holding, if a holding with the same
  // symbol already exists, REPLACE its trades (keeping the original id + dividends
  // history). Otherwise, add as new. Avoids duplicate entries on re-import.
  const importHoldings=holdings=>{
    let added=0, replaced=0;
    const replacedSyms=[];
    withPortfolio(p=>{
      const out=[...p.holdings];
      for(const h of holdings){
        const idx=out.findIndex(x=>x.symbol===h.symbol);
        if(idx>=0){
          // Replace trades but preserve id, dividends history, photo, notes.
          out[idx]={
            ...out[idx],
            type: h.type || out[idx].type,
            trades: h.trades, // fresh from import
          };
          replaced++;
          replacedSyms.push(h.symbol);
        } else {
          out.push(h);
          added++;
        }
      }
      return{...p, holdings:out};
    });
    // Fetch live prices for all imported symbols
    holdings.forEach(h=>fetchOne(h.symbol));
    if(added && replaced) toast(`Imported: ${added} new, ${replaced} replaced`,'ok');
    else if(added) toast(`Added ${added} holding${added!==1?'s':''}`,'ok');
    else if(replaced) toast(`Updated ${replaced} holding${replaced!==1?'s':''} (${replacedSyms.join(', ')})`,'ok');
  };
  const addTrade=(hid,t)=>{withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===hid?{...h,trades:[...(h.trades||[]),t]}:h)}));toast('Trade logged','ok');};
  const deleteTrade=(hid,tid)=>{withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===hid?{...h,trades:(h.trades||[]).filter(t=>t.id!==tid)}:h)}));toast('Trade removed');};
  const addDividend=(hid,d)=>{withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===hid?{...h,dividends:[...(h.dividends||[]),d]}:h)}));toast(`Dividend logged: +${fmtC(d.totalPaid)}`,'ok');};
  const deleteDividend=(hid,did)=>{withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===hid?{...h,dividends:(h.dividends||[]).filter(d=>d.id!==did)}:h)}));toast('Dividend removed');};
  const deleteHolding=id=>{const h=activePortfolio.holdings.find(x=>x.id===id);withPortfolio(p=>({...p,holdings:p.holdings.filter(h=>h.id!==id)}));if(h)toast(`Removed ${h.symbol}`);};

  // prices
  // Single-symbol fetch (used after adding a new holding). Always force since
  // a brand-new ticker has no cache entry yet.
  async function fetchOne(sym){
    const p=await getPrices([sym],{force:true});
    setPrices(pr=>({...pr,...p}));
  }
  // Soft refresh: only fetches symbols whose cache is stale (>4h old) or missing.
  // Pass {force:true} from the manual refresh button to bypass the cache entirely.
  const refresh=useCallback(async(opts={})=>{
    const syms=new Set();
    dataRef.current.portfolios.forEach(p=>p.holdings.forEach(h=>syms.add(h.symbol)));
    if(!syms.size)return;
    setLoading(true);
    const prevPrices={...loadPriceCache()};
    try{
      const p=await getPrices([...syms], opts);
      const n=Object.keys(p).length;
      if(!n){toast('Could not fetch prices — check connection','err');return;}
      // Merge, never replace — protects against wiping prices on transient failure
      setPrices(prev=>({...prev,...p}));
      setLastUpdated(Date.now());
      // Daily portfolio value snapshot
      const snapDate=today();
      setHistory(h=>{
        const nh={...h};
        dataRef.current.portfolios.forEach(port=>{
          let v=0,c=0;
          port.holdings.forEach(hh=>{const ch=computeHolding(hh,p[hh.symbol]);v+=ch.val;c+=ch.cost;});
          if(v>0||c>0){
            const arr=[...(nh[port.id]||[])];
            const idx=arr.findIndex(s=>s.date===snapDate);
            const snap={date:snapDate,value:parseFloat(v.toFixed(2)),cost:parseFloat(c.toFixed(2))};
            if(idx>=0) arr[idx]=snap; else arr.push(snap);
            nh[port.id]=arr.slice(-180);
          }
        });
        return nh;
      });
      // Evaluate price alerts + EMA crosses across ALL portfolios
      evaluateTriggers(prevPrices, p).catch(err=>console.warn('[Triggers]', err));
    }finally{setLoading(false);}
  },[]);

  // Evaluate price alerts and EMA crosses for every holding in every portfolio.
  // Called after each successful price refresh. Mutates holdings via setData
  // when alerts fire (to flip `triggered:true`). EMA crosses don't mutate data —
  // they just fire notifications, dedupe-keyed by symbol+kind+direction.
  const evaluateTriggers=useCallback(async(prevPrices, currPrices)=>{
    const d=dataRef.current;
    if(!d?.portfolios) return;

    // 1) Price alerts ─────────────────────────────────────────────
    let alertsFired=false;
    const nextData={...d, portfolios:d.portfolios.map(port=>({
      ...port,
      holdings:port.holdings.map(h=>{
        const alerts=h.alerts||[];
        if(!alerts.length) return h;
        const prev=prevPrices[h.symbol]?.price;
        const curr=currPrices[h.symbol]?.price ?? prevPrices[h.symbol]?.price;
        if(curr==null) return h;
        let changed=false;
        const updated=alerts.map(a=>{
          if(a.enabled===false||a.triggered) return a;
          const p=Number(a.price);
          if(!p||isNaN(p)) return a;
          let fired=false;
          if(a.condition==='above'){
            if(prev!=null && prev<p && curr>=p) fired=true;
            else if(prev==null && curr>=p) fired=true;
          } else {
            if(prev!=null && prev>p && curr<=p) fired=true;
            else if(prev==null && curr<=p) fired=true;
          }
          if(fired){
            notify(
              `${h.symbol} ${a.condition} ${a.price}`,
              `Live price ${curr.toFixed(2)} crossed ${a.condition} target ${Number(a.price).toFixed(2)}`,
              `alert-${h.id}-${a.id}`,
            );
            alertsFired=true;
            changed=true;
            return{...a, triggered:true, triggeredAt:new Date().toISOString()};
          }
          return a;
        });
        return changed ? {...h, alerts:updated} : h;
      }),
    }))};
    if(alertsFired){
      setData(nextData);
      saveData(nextData);
    }

    // 2) EMA crosses ─────────────────────────────────────────────
    const emaState=loadEmaState();
    let emaStateChanged=false;
    // Collect all symbols across portfolios that have ANY EMA trigger enabled
    const symbolsToCheck=new Set();
    for(const port of d.portfolios){
      for(const h of (port.holdings||[])){
        const t=h.emaTriggers||{};
        if(t.priceCrossEma50 || t.priceCrossEma200 || t.goldenDeathCross){
          symbolsToCheck.add(h.symbol);
        }
      }
    }
    for(const sym of symbolsToCheck){
      const curPrice=currPrices[sym]?.price ?? prevPrices[sym]?.price;
      if(curPrice==null) continue;
      // Use 1y range as the EMA source-of-truth (≥200 trading days)
      const hist=await fetchHistoricalPrices(sym, '1y');
      if(!hist || hist.closes.length<50) continue;
      const ema50arr=calculateEMA(hist.closes, 50);
      const ema200arr=calculateEMA(hist.closes, 200);
      const ema50=ema50arr[ema50arr.length-1];
      const ema200=ema200arr[ema200arr.length-1];
      const prev=emaState[sym]||{};
      // Find holdings that own this symbol (across portfolios) for trigger flags
      const owners=[];
      for(const port of d.portfolios){
        for(const h of port.holdings){
          if(h.symbol===sym) owners.push(h);
        }
      }
      const tFlags=owners.reduce((acc,h)=>{
        const t=h.emaTriggers||{};
        acc.priceCrossEma50  = acc.priceCrossEma50  || !!t.priceCrossEma50;
        acc.priceCrossEma200 = acc.priceCrossEma200 || !!t.priceCrossEma200;
        acc.goldenDeathCross = acc.goldenDeathCross || !!t.goldenDeathCross;
        return acc;
      },{});

      if(tFlags.priceCrossEma50 && ema50!=null && prev.lastPrice!=null && prev.ema50!=null){
        const dir=detectCross(prev.lastPrice, curPrice, prev.ema50, ema50);
        if(dir){
          notify(
            `${sym}: Price crossed EMA 50 ${dir==='up'?'↑':'↓'}`,
            `Now ${curPrice.toFixed(2)} · EMA 50 ${ema50.toFixed(2)} — ${dir==='up'?'broke above (resistance flipped to support)':'broke below (support flipped to resistance)'}`,
            `ema50-${sym}-${dir}`,
          );
        }
      }
      if(tFlags.priceCrossEma200 && ema200!=null && prev.lastPrice!=null && prev.ema200!=null){
        const dir=detectCross(prev.lastPrice, curPrice, prev.ema200, ema200);
        if(dir){
          notify(
            `${sym}: Price crossed EMA 200 ${dir==='up'?'↑':'↓'}`,
            `Now ${curPrice.toFixed(2)} · EMA 200 ${ema200.toFixed(2)} — long-term ${dir==='up'?'support taken back':'support broken'}`,
            `ema200-${sym}-${dir}`,
          );
        }
      }
      if(tFlags.goldenDeathCross && ema50!=null && ema200!=null && prev.ema50!=null && prev.ema200!=null){
        const dir=detectCross(prev.ema50, ema50, prev.ema200, ema200);
        if(dir==='up'){
          notify(`${sym}: 🌟 Golden Cross`, `EMA 50 (${ema50.toFixed(2)}) crossed above EMA 200 (${ema200.toFixed(2)}) — bullish trend signal`, `gc-${sym}`);
        } else if(dir==='down'){
          notify(`${sym}: 💀 Death Cross`, `EMA 50 (${ema50.toFixed(2)}) crossed below EMA 200 (${ema200.toFixed(2)}) — bearish trend signal`, `dc-${sym}`);
        }
      }
      emaState[sym]={ema50, ema200, lastPrice:curPrice, lastCheckedAt:Date.now()};
      emaStateChanged=true;
    }
    if(emaStateChanged) saveEmaState(emaState);
  },[]);

  // Manual refresh — always force, ignore cache, useful when user clicks "↻"
  const refreshForce=useCallback(()=>refresh({force:true}),[refresh]);

  // On mount: kick a soft refresh. Cache-hit symbols return instantly; only
  // stale ones hit the network. No more 30-second polling — daily-close data
  // doesn't change minute to minute, and constant polling was the reason
  // proxies kept failing.
  useEffect(()=>{ refresh(); },[]);
  // Gentle auto-check every hour. The cache-hit check inside getPrices means
  // this is a no-op when prices are fresh (<4h), so it's effectively a
  // safety net for keeping the app open all day past market close.
  useEffect(()=>{
    const t=setInterval(()=>refresh(),60*60*1000); // 1 hour
    return()=>clearInterval(t);
  },[refresh]);

  // photo
  const addPhoto=(hid,photo)=>withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===hid?{...h,photo}:h)}));
  const setHoldingTags=(hid,tags)=>withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===hid?{...h,tags:tags.filter(Boolean)}:h)}));
  const setHoldingTarget=(hid,pct)=>withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===hid?{...h,targetAllocation:pct}:h)}));
  // Replace a holding wholesale (used by StockChartModal for alerts + emaTriggers edits)
  const updateHolding=(next)=>withPortfolio(p=>({...p,holdings:p.holdings.map(h=>h.id===next.id?next:h)}));

  // Live indicator: is a background news fetch currently running?
  const[newsFetching,setNewsFetching]=useState(false);
  useEffect(()=>{
    const onState=e=>setNewsFetching(!!e.detail?.fetching);
    window.addEventListener('news-fetch-state', onState);
    return()=>window.removeEventListener('news-fetch-state', onState);
  },[]);

  const nav=[
    {id:'home',icon:'🏠',label:'Home'},
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'holdings',icon:'💼',label:'Holdings'},
    {id:'charts',icon:'📈',label:'Charts'},
    {id:'news',icon:'📰',label:'News',badge:newsFetching?'⟳':null},
    {id:'settings',icon:'⚙️',label:'Settings'},
  ];

  // Most-recent trading day across cached prices (for the sidebar indicator).
  const lastCloseDate=useMemo(()=>{
    const dates=Object.values(prices).map(p=>p?.asOf).filter(Boolean).sort();
    return dates[dates.length-1]||null;
  },[prices]);

  return(
    <>
      <nav className="sidebar">
        <div className="logo"><span>📊</span><span>Portfolio</span>
          <span style={{marginLeft:'auto',fontSize:9,color:'var(--dim)',fontWeight:400,flexShrink:0}}>
            {loading?'⟳ syncing':lastCloseDate?`close ${lastCloseDate.slice(5)}`:'no data'}
          </span>
        </div>
        <div className="port-sw">
          <div className="port-sw-lbl">Active Portfolio</div>
          <div className="port-sw-row">
            <select value={data.activePortfolioId}onChange={e=>switchPortfolio(e.target.value)}>
              {data.portfolios.map(p=><option key={p.id}value={p.id}>{p.name}</option>)}
            </select>
            <button className="pib"title="New portfolio"onClick={async()=>{const n=await uiPrompt('Name for the new portfolio:','',{title:'New Portfolio',placeholder:'e.g. Retirement',okLabel:'Create'});if(n?.trim())addPortfolio(n.trim());}}>+</button>
          </div>
        </div>
        {nav.map(n=>(
          <button key={n.id}className={`nav-btn${tab===n.id?' active':''}`}onClick={()=>setTab(n.id)}>
            <span className="ni">{n.icon}</span><span>{n.label}</span>
            {!!n.badge&&<span className={`nav-badge${typeof n.badge==='string'?' nav-badge-spin':''}`}>{n.badge}</span>}
          </button>
        ))}
        <div style={{marginTop:'auto',borderTop:'1px solid var(--border)',padding:'12px 14px'}}>
          {user ? (
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}} onClick={()=>setTab('settings')}>
              {user.photoURL
                ? <img src={user.photoURL} style={{width:32,height:32,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                : <div style={{width:32,height:32,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,color:'#fff',flexShrink:0}}>{user.displayName?.[0]}</div>
              }
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.displayName}</div>
                <div style={{fontSize:10,color:syncing?'var(--amber)':'var(--green)'}}>{syncing?'⟳ Saving…':'☁✓ Synced'}</div>
              </div>
            </div>
          ) : (
            <button className="btn btn-ghost" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={()=>window._fb?.signIn().catch(err=>toast(err.message||'Sign-in failed','err'))}>☁ Sign in to sync</button>
          )}
        </div>
      </nav>
      <main className="main">
        {tab==='home'&&<HomeDashboard portfolios={data.portfolios}prices={prices}loading={loading}history={history}onSwitch={id=>{switchPortfolio(id);setTab('dashboard');}}/>}
        {tab==='dashboard'&&<Dashboard portfolio={activePortfolio}prices={prices}loading={loading}onRefresh={refreshForce}history={history[activePortfolio?.id]||[]}/>}
        {tab==='holdings'&&<HoldingsPage portfolio={activePortfolio}prices={prices}loading={loading}onAdd={addHolding}onImportBulk={importHoldings}onAddTrade={addTrade}onAddDividend={addDividend}onDeleteTrade={deleteTrade}onDeleteDividend={deleteDividend}onDeleteHolding={deleteHolding}onRefresh={refreshForce}onSetPhoto={addPhoto}onSetTags={setHoldingTags}onSetTarget={setHoldingTarget}onUpdateHolding={updateHolding}/>}
        {tab==='charts'&&<ChartsPage portfolio={activePortfolio}prices={prices}history={history[activePortfolio?.id]||[]}/>}
        {tab==='news'&&<NewsPage portfolio={activePortfolio}/>}
        {tab==='settings'&&<SettingsPage data={data}onRenamePortfolio={renamePortfolio}onDeletePortfolio={deletePortfolio}onAddPortfolio={addPortfolio}onClearAll={()=>{setData(defaultData());setPrices({});saveData(defaultData());toast('All data cleared');}} onSetCurrency={ccy=>{upd(d=>({...d,displayCurrency:ccy}));toast(`Display currency: ${ccy}`,'ok');}} user={user} syncing={syncing}/>}
      </main>
      <Toasts toasts={toasts}/>
      <InstallHint/>
      <DialogHost/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
