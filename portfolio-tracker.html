                  onChange={e=>updateRow(i,'shares',e.target.value)}
                  style={{padding:'8px 10px',fontSize:12,
                    borderColor:r.shares?'':'var(--amber)',
                    outlineColor:r.shares?'':'var(--amber)',
                    background:r.shares?'':'rgba(245,158,11,.08)'}}/>
                <input type="number"step="any"placeholder="0.00"value={r.cost}
                  onChange={e=>updateRow(i,'cost',e.target.value)}
                  style={{padding:'8px 10px',fontSize:12,
                    borderColor:r.cost?'':'var(--amber)',
                    outlineColor:r.cost?'':'var(--amber)',
                    background:r.cost?(r._autoFilledCost?'rgba(34,197,94,.08)':''):'rgba(245,158,11,.08)'}}/>
                <button className="btn-del"onClick={()=>setRows(rs=>rs.filter((_,idx)=>idx!==i))}>✕</button>
              </div>

              {/* Fuzzy ticker correction notice */}
              {r._tickerCorrected&&(
                <div style={{fontSize:11,color:'var(--blue)',marginLeft:98,marginTop:3}}>
                  🔧 OCR read <code style={{background:'rgba(59,130,246,.15)',padding:'1px 4px',borderRadius:3}}>{r._tickerCorrected.from}</code> → auto-corrected to <strong>{r._tickerCorrected.to}</strong>
                </div>
              )}

              {/* UNVERIFIED ticker warning — no price found via live API.
                  Likely an OCR misread (e.g. "LIRS" from a garbled "RZLV" pass). */}
              {r.sym && r._validated===false && (
                <div style={{marginLeft:98,marginTop:3,padding:'4px 8px',background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.25)',borderRadius:4,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span style={{fontSize:11,color:'var(--red)'}}>
                    ⚠ <strong>{r.sym.toUpperCase()}</strong> didn't match any real ticker — likely OCR misread. Edit the symbol (e.g. <code style={{background:'rgba(239,68,68,.15)',padding:'1px 4px',borderRadius:3}}>RZLV</code>), then click ✓ Verify.
                  </span>
                  <button className="btn btn-sm"onClick={()=>verifyRowSymbol(i)}disabled={r._validating}style={{padding:'3px 8px',fontSize:11}}>
                    {r._validating?'…':'✓ Verify'}
                  </button>
                </div>
              )}
              {r._validating===false && r._validated===true && r._tickerCorrected===undefined && r.sym && !r._holdingUSD && (
                <div style={{fontSize:11,color:'var(--green)',marginLeft:98,marginTop:3}}>
                  ✓ {r.sym.toUpperCase()} verified (live price ${r._livePrice?.toFixed(2)})
                </div>
              )}

              {/* "Will replace" notice when this ticker already exists in the portfolio */}
              {r.sym && existingMap.has(r.sym.toUpperCase()) && (() => {
                const ex = existingMap.get(r.sym.toUpperCase());
                const exShares = (ex.trades||[]).reduce((s,t)=>s+(t.type==='sell'?-1:1)*(t.shares||0), 0);
                const exCost = (() => {
                  const buys = (ex.trades||[]).filter(t=>t.type!=='sell');
                  const totalCost = buys.reduce((s,t)=>s+(t.shares||0)*(t.price||0), 0);
                  const totalShares = buys.reduce((s,t)=>s+(t.shares||0), 0);
                  return totalShares>0 ? totalCost/totalShares : 0;
                })();
                return (
                  <div style={{fontSize:11,color:'var(--amber)',marginLeft:98,marginTop:3}}>
                    ↻ Will replace existing {r.sym.toUpperCase()} ({exShares.toFixed(4)} shares @ ${exCost.toFixed(2)})
                  </div>
                );
              })()}

              {/* Manual price entry (when shares missing but holding known) */}
              {r._holdingUSD!=null && !r.shares && !r._livePrice && (
                <div style={{marginLeft:98,marginTop:5,padding:'6px 8px',background:'rgba(59,130,246,.06)',border:'1px dashed rgba(59,130,246,.25)',borderRadius:6}}>
                  <div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>
                    💡 Holding ${r._holdingUSD.toFixed(2)}{r._pendingCostBasis!=null&&` • Cost basis $${r._pendingCostBasis.toFixed(2)}`} — paste current price to compute shares{r._pendingCostBasis!=null&&' + avg cost'}:
                  </div>
                  <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                    <input type="number"step="any"placeholder="current price (USD)"
                      value={r._manualPrice||''}
                      onChange={e=>updateRow(i,'_manualPrice',e.target.value)}
                      style={{padding:'5px 8px',fontSize:12,width:140}}/>
                    <a href={`https://finance.yahoo.com/quote/${encodeURIComponent(r.sym)}`}target="_blank"rel="noopener noreferrer"style={{fontSize:11,color:'var(--blue)',textDecoration:'none'}}>🔗 Yahoo</a>
                    <a href={`https://www.google.com/finance/quote/${encodeURIComponent(r.sym)}:NASDAQ`}target="_blank"rel="noopener noreferrer"style={{fontSize:11,color:'var(--blue)',textDecoration:'none'}}>🔗 Google</a>
                  </div>
                </div>
              )}

              {/* Confirmation: shares + cost both computed from live price + basis */}
              {r._autoFilledCost && r._livePrice && r._pendingCostBasis!=null && (
                <div style={{fontSize:11,color:'var(--green)',marginLeft:98,marginTop:3}}>
                  ✓ Live ${r._livePrice.toFixed(2)} → {r.shares} shares × ${r.cost} avg cost (basis ${r._pendingCostBasis.toFixed(2)})
                </div>
              )}
              {/* Confirmation: shares from live price, cost still missing */}
              {!r._autoFilledCost && r._livePrice && r.shares && (
                <div style={{fontSize:11,color:'var(--green)',marginLeft:98,marginTop:3}}>
                  ✓ Live ${r._livePrice.toFixed(2)} → {r.shares} shares (enter avg cost manually)
                </div>
              )}
              {/* Confirmation: cost auto-computed from user-entered shares + cost basis */}
              {r._autoFilledCost && !r._livePrice && r._pendingCostBasis!=null && (
                <div style={{fontSize:11,color:'var(--green)',marginLeft:98,marginTop:3}}>
                  ✓ ${r._pendingCostBasis.toFixed(2)} basis ÷ {r.shares} shares = ${r.cost}/share
                </div>
              )}
            </div>
          ))}

          <div className="form-actions">
            <button className="btn btn-ghost"onClick={onClose}>Cancel</button>
            <button className="btn btn-primary"onClick={doImport}disabled={!validCount}>
              Import {validCount} Holding{validCount!==1?'s':''}
            </button>
          </div>
        </>
      )}
    </Modal>
  );
}

/* ─── Expanded trade/dividend row ─── */
function ExpandedRow({h,prices,onAddTrade,onAddDividend,onDeleteTrade,onDeleteDividend,onDelete,onSetPhoto,onSetTags}){
  const photoRef=useRef();
  const[uploading,setUploading]=useState(false);
  async function pickPhoto(e){
    const file=e.target.files[0];if(!file)return;
    setUploading(true);
    const b64=await compressImage(file);
    onSetPhoto(b64);
    setUploading(false);
  }
  const trades=[...(h.trades||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  // compute running avg to show P&L per sell
  let avg=0,shs=0,tc=0;
  const enriched=trades.map(t=>{
    let pl=null;
    if(t.type==='buy'){tc+=t.shares*t.price;shs+=t.shares;avg=shs>0?tc/shs:0;}
    else{pl=t.shares*(t.price-avg);shs-=t.shares;if(shs<0.00001){shs=0;avg=0;tc=0;}else tc=shs*avg;}
    return{...t,pl};
  });
  const divs=[...(h.dividends||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const cp=prices[h.symbol]?.price;
  return(
    <div className="exp-inner">
      <div className="exp-actions">
        <button className="btn btn-ghost btn-sm"onClick={onAddTrade}>+ Add Trade</button>
        <button className="btn btn-ghost btn-sm"onClick={onAddDividend}>+ Log Dividend</button>
        <button className="btn btn-ghost btn-sm"onClick={()=>photoRef.current.click()}>{uploading?'Uploading…':'📷 '+(h.photo?'Change Photo':'Attach Photo')}</button>
        <input ref={photoRef} type="file" accept="image/*" style={{display:'none'}} onChange={pickPhoto}/>
        <button className="btn btn-ghost btn-sm"style={{marginLeft:'auto',color:'var(--red)'}}onClick={async()=>{ if(await uiConfirm(`Remove ${h.symbol} and all its trades?`,{danger:true,okLabel:'Remove'})) onDelete(h.id); }}>🗑 Remove Holding</button>
      </div>
      {/* Tag editor — small chips with add/remove */}
      <div style={{marginBottom:14,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
        <span style={{fontSize:11,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em'}}>🏷 Tags:</span>
        {(h.tags||[]).map(t=>(
          <span key={t} style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(59,130,246,.12)',color:'var(--blue)',padding:'3px 8px 3px 10px',borderRadius:12,fontSize:11,fontWeight:600}}>
            {t}
            <button onClick={()=>onSetTags((h.tags||[]).filter(x=>x!==t))}
              style={{background:'none',border:'none',color:'var(--blue)',cursor:'pointer',padding:0,fontSize:14,lineHeight:1,marginLeft:2}}
              title="Remove tag">×</button>
          </span>
        ))}
        <input type="text" placeholder="+ tag" maxLength={20}
          onKeyDown={e=>{
            if(e.key==='Enter'){
              const v=e.target.value.trim().toLowerCase();
              if(v && !(h.tags||[]).includes(v)){
                onSetTags([...(h.tags||[]), v]);
              }
              e.target.value='';
              e.preventDefault();
            }
          }}
          style={{padding:'3px 8px',fontSize:11,border:'1px dashed var(--border)',background:'transparent',borderRadius:12,width:80,outline:'none'}}/>
        {(h.tags||[]).length===0 && (
          <span style={{fontSize:11,color:'var(--dim)',fontStyle:'italic'}}>e.g. dividend, growth, long-term — press Enter to add</span>
        )}
      </div>
      {h.photo&&(
        <div style={{marginBottom:14,position:'relative',display:'inline-block'}}>
          <img src={h.photo} style={{maxWidth:320,maxHeight:200,borderRadius:8,objectFit:'cover',display:'block'}}/>
          <button onClick={()=>onSetPhoto(null)} style={{position:'absolute',top:6,right:6,background:'rgba(239,68,68,.8)',border:'none',borderRadius:6,color:'#fff',padding:'3px 8px',fontSize:12,cursor:'pointer'}}>✕ Remove</button>
        </div>
      )}
      <div className="exp-section">
        <div className="exp-title">Trade History</div>
        {enriched.length===0?<div className="dim-row">No trades yet</div>:(
          <table className="mini-t">
            <thead><tr><th>Date</th><th>Type</th><th>Shares</th><th>Price</th><th>Value</th><th>Realized P&L</th><th>Notes</th><th/></tr></thead>
            <tbody>
              {enriched.map(t=>(
                <tr key={t.id}>
                  <td>{t.date}</td>
                  <td><span className={t.type==='buy'?'buy-lbl':'sell-lbl'}>{t.type.toUpperCase()}</span></td>
                  <td>{fmt(t.shares,4)}</td>
                  <td>{fmtC(t.price)}</td>
                  <td>{fmtC(t.shares*t.price)}</td>
                  <td className={t.pl!=null?(t.pl>=0?'pos':'neg'):''}>{t.pl!=null?(t.pl>=0?'+':'')+fmtC(Math.abs(t.pl)):'—'}</td>
                  <td style={{color:'var(--dim)',maxWidth:140,overflow:'hidden',textOverflow:'ellipsis'}}>{t.notes}</td>
                  <td><button className="btn-del"onClick={async()=>{ if(await uiConfirm('Delete this trade?',{danger:true,okLabel:'Delete'})) onDeleteTrade(t.id); }}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      <div className="exp-section">
        <div className="exp-title">Dividend History</div>
        {divs.length===0?<div className="dim-row">No dividends logged</div>:(
          <table className="mini-t">
            <thead><tr><th>Date</th><th>Per Share</th><th>Total Received</th><th>Notes</th><th/></tr></thead>
            <tbody>
              {divs.map(d=>(
                <tr key={d.id}>
                  <td>{d.date}</td>
                  <td>{fmtC(d.perShare)}</td>
                  <td className="pos">+{fmtC(d.totalPaid)}</td>
                  <td style={{color:'var(--dim)'}}>{d.notes}</td>
                  <td><button className="btn-del"onClick={async()=>{ if(await uiConfirm('Delete dividend?',{danger:true,okLabel:'Delete'})) onDeleteDividend(d.id); }}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ─── Home (all portfolios) ─── */
function HomeDashboard({portfolios,prices,loading,history={},onSwitch}){
  // Benchmark (SPY) for the combined returns chart — fetched once on mount,
  // cached 6h. Null while loading or if fetch fails (chart still renders fine).
  const[benchmark,setBenchmark]=useState(null);
  useEffect(()=>{
    fetchBenchmarkHistory('SPY').then(d=>{ if(d) setBenchmark(d); });
  },[]);
  // News cache for the notice strip (so we can show big-news flags)
  const[newsCache,setNewsCache]=useState(()=>loadNewsCache());
  const[mutedNews,setMutedNews]=useState(()=>loadMutedNews());
  // Time-frame selection for the combined returns chart
  const[timeframe,setTimeframe]=useState('all');
  useEffect(()=>{
    const h=()=>{ setNewsCache(loadNewsCache()); setMutedNews(loadMutedNews()); };
    window.addEventListener('news-cache-updated', h);
    return()=>window.removeEventListener('news-cache-updated', h);
  },[]);

  // Build "notice" list: big movers (>5% today) + recent breaking news (<6h old)
  const notices=useMemo(()=>{
    const out=[];
    // Big movers
    for(const p of portfolios){
      for(const h of (p.holdings||[])){
        const c=computeHolding(h, prices[h.symbol]);
        if(c.dayP!=null && Math.abs(c.dayP)>=5 && c.val>0){
          out.push({
            type:'mover',
            kind: c.dayP>=0 ? 'up' : 'down',
            sym: h.symbol,
            text: `${h.symbol} is ${c.dayP>=0?'up':'down'} ${Math.abs(c.dayP).toFixed(2)}% today (${fmtC(c.dayChange)} change)`,
            time: Date.now(),
          });
        }
      }
    }
    // Recent news (<6h) — skip muted tickers
    const sixHoursAgo=Date.now()-6*60*60*1000;
    for(const sym of Object.keys(newsCache)){
      if(mutedNews.has(sym)) continue;
      const items=newsCache[sym]?.items||[];
      for(const n of items.slice(0,2)){
        if(n.time && n.time>sixHoursAgo){
          out.push({
            type:'news',
            sym: n.sym || sym,
            text: n.title,
            publisher: n.publisher,
            link: n.link,
            time: n.time,
          });
        }
      }
    }
    return out.sort((a,b)=>(b.time||0)-(a.time||0)).slice(0,8);
  },[portfolios, prices, newsCache, mutedNews]);
  // Combine per-portfolio history snapshots into a single timeline:
  //   { date: 'YYYY-MM-DD', value: sum across all portfolios, cost: sum across all }
  // For dates where a portfolio has no snapshot, we use the closest preceding
  // snapshot's value (carry-forward) to avoid the line dropping.
  const combinedHistory=useMemo(()=>{
    const allDates=new Set();
    const perPort={}; // portfolio_id → date → {value, cost}
    for(const[pid, snaps] of Object.entries(history)){
      perPort[pid]={};
      for(const s of (snaps||[])){
        allDates.add(s.date);
        perPort[pid][s.date]={value:s.value,cost:s.cost};
      }
    }
    if(!allDates.size) return [];
    const sortedDates=[...allDates].sort();
    // For each portfolio, build the carry-forward lookup
    const last={};
    return sortedDates.map(d=>{
      let value=0, cost=0, anySnap=false;
      for(const pid of Object.keys(perPort)){
        const snap=perPort[pid][d];
        if(snap){ last[pid]=snap; anySnap=true; }
        if(last[pid]){ value+=last[pid].value; cost+=last[pid].cost; }
      }
      return{date:d,value:parseFloat(value.toFixed(2)),cost:parseFloat(cost.toFixed(2))};
    });
  },[history]);
  // Filter by timeframe for chart display
  const filteredHistory=useMemo(()=>sliceByTimeframe(combinedHistory,timeframe),[combinedHistory,timeframe]);
  const portStats=useMemo(()=>portfolios.map(p=>{
    let val=0,cost=0,realizedPL=0,dividends=0,totalReturn=0,day=0;
    p.holdings.forEach(h=>{
      const c=computeHolding(h,prices[h.symbol]);
      val+=c.val;cost+=c.cost;realizedPL+=c.realizedPL;dividends+=c.dividends;totalReturn+=c.totalReturn;day+=c.dayChange;
    });
    const pl=val-cost,plP=cost>0?(pl/cost)*100:0;
    return{id:p.id,name:p.name,color:p.color,holdings:p.holdings.length,val,cost,pl,plP,realizedPL,dividends,totalReturn,day};
  }),[portfolios,prices]);

  const totals=useMemo(()=>portStats.reduce((a,s)=>({
    val:a.val+s.val,cost:a.cost+s.cost,pl:a.pl+s.pl,
    realizedPL:a.realizedPL+s.realizedPL,dividends:a.dividends+s.dividends,
    totalReturn:a.totalReturn+s.totalReturn,day:a.day+s.day
  }),{val:0,cost:0,pl:0,realizedPL:0,dividends:0,totalReturn:0,day:0}),[portStats]);
  const totalPlP=totals.cost>0?(totals.pl/totals.cost)*100:0;
  const grandTotal=totals.val||1;

  // Onboarding: shown when portfolio is empty AND user hasn't dismissed it.
  const totalHoldings=portfolios.reduce((s,p)=>s+(p.holdings?.length||0),0);
  const[onboardingDismissed,setOnboardingDismissed]=useState(()=>localStorage.getItem('ptv3-onboarding-done')==='1');
  const showOnboarding=totalHoldings===0 && !onboardingDismissed;
  function dismissOnboarding(){
    localStorage.setItem('ptv3-onboarding-done','1');
    setOnboardingDismissed(true);
  }

  return(
    <div>
      <div className="ph">
        <h1 className="pt">All Portfolios</h1>
        <p className="ps">{loading?<><span className="spin spin-sm"/><span>Updating…</span></>:<><span className="dot-live"/><span>{portfolios.length} portfolio{portfolios.length!==1?'s':''} · {totalHoldings} positions</span></>}</p>
      </div>

      {showOnboarding && (
        <div className="card" style={{padding:'20px 24px',marginBottom:14,background:'linear-gradient(135deg, rgba(59,130,246,.08), rgba(139,92,246,.05))',border:'1px solid rgba(59,130,246,.25)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12,gap:8}}>
            <div>
              <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>👋 Welcome to Portfolio Tracker</div>
              <div style={{fontSize:13,color:'var(--muted)'}}>Three quick steps to get started:</div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={dismissOnboarding} title="Dismiss this welcome card">✕ Dismiss</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12}}>
            <div style={{padding:'14px 16px',background:'rgba(0,0,0,.15)',borderRadius:8}}>
              <div style={{fontSize:24,marginBottom:6}}>1️⃣</div>
              <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>Add your first holding</div>
              <div style={{fontSize:11,color:'var(--muted)',lineHeight:1.5}}>
                Go to <strong>Holdings</strong> → click <strong>+ Add Holding</strong>. Enter a ticker (e.g. AAPL), shares, and average cost. Live prices fill in automatically.
              </div>
            </div>
            <div style={{padding:'14px 16px',background:'rgba(0,0,0,.15)',borderRadius:8}}>
              <div style={{fontSize:24,marginBottom:6}}>2️⃣</div>
              <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>Or import from screenshots</div>
              <div style={{fontSize:11,color:'var(--muted)',lineHeight:1.5}}>
                In <strong>Holdings → 📷 Photo Import</strong>, drag in screenshots from your broker (Webull, Dime!, etc.). OCR extracts tickers and shares in batch.
              </div>
            </div>
            <div style={{padding:'14px 16px',background:'rgba(0,0,0,.15)',borderRadius:8}}>
              <div style={{fontSize:24,marginBottom:6}}>3️⃣</div>
              <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>Run via local server for live prices</div>
              <div style={{fontSize:11,color:'var(--muted)',lineHeight:1.5}}>
                Double-click <code style={{background:'rgba(0,0,0,.3)',padding:'1px 4px',borderRadius:3,fontSize:10}}>start-portfolio-tracker.bat</code>. Opens at <code style={{fontSize:10}}>localhost:8000</code> so live prices and news fetch reliably.
              </div>
            </div>
          </div>
          <div style={{marginTop:12,padding:'10px 12px',background:'rgba(59,130,246,.08)',borderRadius:6,fontSize:12,color:'var(--muted)'}}>
            💡 <strong>Tip:</strong> Once you have holdings, the Home page shows combined returns vs the S&P 500, sector allocation, and big-mover notices.
          </div>
        </div>
      )}

      {/* Combined totals */}
      <div className="home-total">
        <div className="sc"><div className="sl">Total Value</div><div className="sv">{fmtB(totals.val)}</div><div className={`sch ${totals.day>=0?'pos':'neg'}`}>{totals.day>=0?'▲':'▼'} {fmtC(Math.abs(totals.day))} today</div></div>
        <div className="sc"><div className="sl">Unrealized P&L</div><div className={`sv ${totals.pl>=0?'pos':'neg'}`}>{totals.pl>=0?'+':''}{fmtB(totals.pl)}</div><div className={`sch ${totals.pl>=0?'pos':'neg'}`}>{fmtP(totalPlP)}</div></div>
        <div className="sc"><div className="sl">Realized P&L</div><div className={`sv ${totals.realizedPL>=0?'pos':'neg'}`}>{totals.realizedPL>=0?'+':''}{fmtB(totals.realizedPL)}</div><div className="sch neu">Closed positions</div></div>
        <div className="sc"><div className="sl">Dividends</div><div className="sv pos">+{fmtB(totals.dividends)}</div><div className="sch neu">All time received</div></div>
        <div className="sc"><div className="sl">Total Return</div><div className={`sv ${totals.totalReturn>=0?'pos':'neg'}`}>{totals.totalReturn>=0?'+':''}{fmtB(totals.totalReturn)}</div><div className="sch neu">P&L + dividends</div></div>
      </div>

      {/* Notice inbox: big movers + recent breaking news */}
      {notices.length>0 && (
        <div className="card" style={{padding:'10px 14px',marginBottom:14}}>
          <div style={{fontSize:11,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>📬 Notice inbox · {notices.length} item{notices.length!==1?'s':''}</span>
            <span style={{textTransform:'none',letterSpacing:0}}>Big movers (≥5% today) and breaking news (&lt;6h old)</span>
          </div>
          <div style={{display:'grid',gap:4}}>
            {notices.map((n,i)=>(
              n.type==='news' ? (
                <a key={i} href={n.link} target="_blank" rel="noopener noreferrer"
                  style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:4,textDecoration:'none',color:'inherit',fontSize:12,background:'rgba(59,130,246,.04)',borderLeft:'2px solid var(--blue)'}}>

            const portStart=filteredHistory[0].value;
            const portEnd=filteredHistory[filteredHistory.length-1].value;
            const portReturn=portStart>0 ? (portEnd-portStart)/portStart*100 : 0;
            // Find benchmark return over the same date range
            const startDate=filteredHistory[0].date;
            const endDate=filteredHistory[filteredHistory.length-1].date;
            const bmStart=benchmark.find(b=>b.date>=startDate);
            const bmEnd=[...benchmark].reverse().find(b=>b.date<=endDate);
            if(!bmStart || !bmEnd || !bmStart.close) return null;
            const bmReturn=(bmEnd.close-bmStart.close)/bmStart.close*100;
            const diff=portReturn-bmReturn;
            const winning=diff>0;
            return(
              <div style={{marginTop:10,padding:'8px 12px',background:winning?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)',border:`1px solid ${winning?'rgba(34,197,94,.25)':'rgba(239,68,68,.25)'}`,borderRadius:6,fontSize:12,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
                <span>
                  <strong>{winning?'🏆 Beating the market':'📉 Trailing the market'}</strong> over {filteredHistory.length} day{filteredHistory.length!==1?'s':''}
                </span>
                <span style={{fontVariantNumeric:'tabular-nums'}}>
                  Portfolio <strong className={portReturn>=0?'pos':'neg'}>{fmtP(portReturn)}</strong> vs S&P 500 <strong className={bmReturn>=0?'pos':'neg'}>{fmtP(bmReturn)}</strong> · diff <strong className={winning?'pos':'neg'}>{diff>=0?'+':''}{diff.toFixed(2)}pp</strong>
                </span>
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

/* ─── DonutChart: SVG donut for portfolio allocation ─── */
//   slices: [{label, value, color}, ...]
function DonutChart({slices, size=180, thickness=28, centerLabel, centerSub}){
  if(!slices || !slices.length) return null;
  const total=slices.reduce((s,x)=>s+x.value,0);
  if(total<=0) return null;
  const r=size/2, innerR=r-thickness;
  let angleStart=-Math.PI/2; // start at 12 o'clock
  const segments=slices.map((s,i)=>{
    const frac=s.value/total;
    const angleEnd=angleStart+frac*Math.PI*2;
    const x1=r+r*Math.cos(angleStart), y1=r+r*Math.sin(angleStart);
    const x2=r+r*Math.cos(angleEnd), y2=r+r*Math.sin(angleEnd);
    const x3=r+innerR*Math.cos(angleEnd), y3=r+innerR*Math.sin(angleEnd);
    const x4=r+innerR*Math.cos(angleStart), y4=r+innerR*Math.sin(angleStart);
    const largeArc=frac>0.5?1:0;
    const d=`M ${x1.toFixed(2)} ${y1.toFixed(2)} `+
            `A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} `+
            `L ${x3.toFixed(2)} ${y3.toFixed(2)} `+
            `A ${innerR} ${innerR} 0 ${largeArc} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
    angleStart=angleEnd;
    return{d, color:s.color, label:s.label, value:s.value, pct:(frac*100).toFixed(1)};
  });
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
      {segments.map((s,i)=>(
        <path key={i} d={s.d} fill={s.color}>
          <title>{s.label}: {s.pct}%</title>
        </path>
      ))}
      {centerLabel && (
        <text x={r} y={r-2} textAnchor="middle" fill="currentColor" style={{fontSize:'14px',fontWeight:700}}>{centerLabel}</text>
      )}
      {centerSub && (
        <text x={r} y={r+14} textAnchor="middle" fill="var(--muted)" style={{fontSize:'10px'}}>{centerSub}</text>
      )}
    </svg>
  );
}

/* ─── LineChart: full SVG line chart with axes, grid, tooltips ─── */
//   series: [{date:'YYYY-MM-DD', value:number, cost?:number}, ...]
//   benchmark: optional [{date, value}] — drawn as a secondary line, normalized
//     so it starts at the same value as series[0] (compares % growth).
//   Renders the value line with optional cost-basis reference line and shaded
//   profit/loss area. Includes hover tooltip showing date + value.
function LineChart({series, height=260, showCost=true, benchmark=null, benchmarkLabel='SPY'}){
  const wrapRef=useRef();
  const[hoverIdx,setHoverIdx]=useState(null);
  const[width,setWidth]=useState(720);
  useEffect(()=>{
    if(!wrapRef.current) return;
    const ro=new ResizeObserver(es=>{
      const w=es[0]?.contentRect.width;
      if(w>0) setWidth(Math.floor(w));
    });
    ro.observe(wrapRef.current);
    return()=>ro.disconnect();
  },[]);
  if(!series || series.length<2){
    return(
      <div ref={wrapRef} style={{padding:'40px 20px',textAlign:'center',color:'var(--dim)',fontSize:12}}>
        Not enough history yet — at least 2 daily snapshots are needed. Snapshots are saved automatically when prices refresh.
      </div>
    );
  }
  const padL=56, padR=16, padT=20, padB=32;
  const innerW=Math.max(40, width-padL-padR);
  const innerH=height-padT-padB;
  const values=series.map(s=>s.value);
  const costs=series.map(s=>s.cost||0);

  // Normalize benchmark: align by date and scale so it starts at series[0].value.
  // Result is an array of {value} per series date (null if benchmark has no data
  // for that date). Used as a side-by-side comparison of % growth.
  const benchAligned=useMemo(()=>{
    if(!benchmark || benchmark.length<2) return null;
    const bmMap={};
    for(const b of benchmark) bmMap[b.date]=b.close;
    // For each series date, find closest benchmark date ≤ it (carry-forward).
    const bmDates=Object.keys(bmMap).sort();
    const out=[];
    let bmIdx=0;
    let lastBm=null;
    for(const s of series){
      while(bmIdx<bmDates.length && bmDates[bmIdx]<=s.date){
        lastBm=bmMap[bmDates[bmIdx]];
        bmIdx++;
      }
      out.push(lastBm);
    }
    if(out[0]==null) return null;
    // Scale so first value = series[0].value (compare % growth)
    const scale=series[0].value/out[0];
    return out.map(v=>v==null?null:v*scale);
  },[benchmark, series]);
  const benchValues=benchAligned ? benchAligned.filter(v=>v!=null) : [];

  const allNums=[...(showCost ? values.concat(costs) : values), ...benchValues];
  const minV=Math.min(...allNums);
  const maxV=Math.max(...allNums);
  const padRange=(maxV-minV)*0.08 || maxV*0.05 || 1;
  const yMin=Math.max(0, minV-padRange);
  const yMax=maxV+padRange;
  const yRange=yMax-yMin || 1;
  const xStep=innerW/(series.length-1);
  const xy=(i,v)=>[padL+i*xStep, padT+innerH*(1-(v-yMin)/yRange)];
  const valPoints=series.map((s,i)=>xy(i,s.value).join(',')).join(' ');
  const costPoints=showCost?series.map((s,i)=>xy(i,s.cost||0).join(',')).join(' '):'';
  // Area fill between cost and value (or just below value if no cost line)
  const lastValPt=xy(series.length-1, series[series.length-1].value);
  const firstValPt=xy(0, series[0].value);
  const baseLine=showCost?series.map((s,i)=>xy(i,s.cost||0)):series.map((s,i)=>[xy(i,s.value)[0], padT+innerH]);
  const areaPath=`M ${firstValPt[0]} ${firstValPt[1]} `+
    series.map((s,i)=>`L ${xy(i,s.value).join(' ')}`).join(' ')+
    ` L ${baseLine[baseLine.length-1].join(' ')} `+
    [...baseLine].reverse().map(p=>`L ${p.join(' ')}`).join(' ')+' Z';
  const last=series[series.length-1].value;
  const first=series[0].value;
  const change=last-first;
  const isPositive=change>=0;

  // Y-axis ticks: 4 ticks evenly spaced
  const ticks=[];
  for(let i=0;i<=4;i++){
    const v=yMin+(yRange*i/4);
    ticks.push({v, y:padT+innerH*(1-i/4)});
  }
  // X-axis labels: first, middle, last
  const xLabels=[
    {idx:0, label:series[0].date},
    {idx:Math.floor(series.length/2), label:series[Math.floor(series.length/2)].date},
    {idx:series.length-1, label:series[series.length-1].date},
  ];

  // Hover detection: closest data point to mouse X
  function onMove(e){
    const rect=e.currentTarget.getBoundingClientRect();
    const x=e.clientX-rect.left-padL;
    const idx=Math.max(0, Math.min(series.length-1, Math.round(x/xStep)));
    setHoverIdx(idx);
  }
  const hover=hoverIdx!=null?series[hoverIdx]:null;
  const hoverXY=hover?xy(hoverIdx, hover.value):null;

  return(
    <div ref={wrapRef} style={{position:'relative'}}>
      <svg width={width} height={height} style={{display:'block',cursor:'crosshair'}}
        onMouseMove={onMove} onMouseLeave={()=>setHoverIdx(null)}>
        {/* Y-axis grid lines + labels */}
        {ticks.map((t,i)=>(
          <g key={i}>
            <line x1={padL} y1={t.y} x2={padL+innerW} y2={t.y} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="2 3"/>
            <text x={padL-6} y={t.y+3} textAnchor="end" fill="var(--dim)" style={{fontSize:'10px'}}>{fmtB(t.v)}</text>
          </g>
        ))}
        {/* Area between cost and value */}
        <path d={areaPath} fill={isPositive?'rgba(34,197,94,.12)':'rgba(239,68,68,.12)'}/>
        {/* Cost basis dashed line */}
        {showCost && (
          <polyline points={costPoints} fill="none" stroke="var(--dim)" strokeWidth="1.2" strokeDasharray="4 4" opacity="0.7"/>
        )}
        {/* Benchmark line (drawn BEFORE the value line so value is on top) */}
        {benchAligned && (() => {
          const pts=benchAligned.map((v,i)=>v==null?null:xy(i,v)).filter(Boolean).map(p=>p.join(',')).join(' ');
          return <polyline points={pts} fill="none" stroke="#8b5cf6" strokeWidth="1.5" strokeDasharray="2 3" opacity="0.85"/>;
        })()}
        {/* Value line */}
        <polyline points={valPoints} fill="none" stroke={isPositive?'var(--green)':'var(--red)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {/* End-point dot */}
        <circle cx={lastValPt[0]} cy={lastValPt[1]} r="3.5" fill={isPositive?'var(--green)':'var(--red)'}/>
        {/* X-axis labels */}
        {xLabels.map((x,i)=>(
          <text key={i} x={xy(x.idx, yMin)[0]} y={padT+innerH+18} textAnchor={i===0?'start':i===xLabels.length-1?'end':'middle'} fill="var(--dim)" style={{fontSize:'10px'}}>{x.label}</text>
        ))}
        {/* Hover crosshair */}
        {hover && (
          <>
            <line x1={hoverXY[0]} y1={padT} x2={hoverXY[0]} y2={padT+innerH} stroke="var(--blue)" strokeWidth="0.5" opacity="0.5"/>
            <circle cx={hoverXY[0]} cy={hoverXY[1]} r="4" fill={isPositive?'var(--green)':'var(--red)'} stroke="var(--bg)" strokeWidth="1.5"/>
          </>
        )}
      </svg>
      {/* Hover tooltip */}
      {hover && (
        <div style={{position:'absolute',top:8,right:16,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:6,padding:'8px 12px',fontSize:12,pointerEvents:'none',minWidth:140}}>
          <div style={{color:'var(--dim)',fontSize:10,marginBottom:4}}>{hover.date}</div>
          <div style={{fontWeight:700,fontSize:13}}>Value: {fmtB(hover.value)}</div>
          {showCost && hover.cost!=null && (
            <>
              <div style={{color:'var(--muted)',fontSize:11,marginTop:2}}>Cost: {fmtB(hover.cost)}</div>
              <div className={hover.value>=hover.cost?'pos':'neg'} style={{fontSize:11,marginTop:2}}>
                P/L: {hover.value>=hover.cost?'+':''}{fmtC(hover.value-hover.cost)} ({fmtP(hover.cost>0?(hover.value-hover.cost)/hover.cost*100:0)})
              </div>
            </>
          )}
          {benchAligned && benchAligned[hoverIdx]!=null && (
            <div style={{color:'#8b5cf6',fontSize:11,marginTop:4,paddingTop:4,borderTop:'1px solid var(--border)'}}>
              {benchmarkLabel}: {fmtB(benchAligned[hoverIdx])} <span style={{color:'var(--dim)'}}>(scaled)</span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ─── Sparkline: tiny SVG line chart ─── */
function Sparkline({data, width=240, height=60, color='var(--blue)', fillColor=null}){
  if(!data || data.length<2) return null;
  const min=Math.min(...data), max=Math.max(...data);
  const range=max-min || 1;
  const pad=2;
  const xStep=(width-pad*2)/(data.length-1);
  const points=data.map((v,i)=>{
    const x=pad+i*xStep;
    const y=pad+(height-pad*2)*(1-(v-min)/range);
    return`${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const areaPoints=`${pad},${height-pad} ${points} ${(pad+(data.length-1)*xStep).toFixed(1)},${height-pad}`;
  return(
    <svg width={width} height={height} style={{display:'block',overflow:'visible'}}>
      {fillColor && <polygon points={areaPoints} fill={fillColor}/>}
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={pad+(data.length-1)*xStep} cy={pad+(height-pad*2)*(1-(data[data.length-1]-min)/range)} r="2.5" fill={color}/>
    </svg>
  );
}

/* ─── Dashboard ─── */
// Infer the trading currency of a ticker from its suffix. Used as a fallback
// when the sector-cache entry doesn't carry an explicit currency from Yahoo.
// Mapping covers the most common international suffixes; everything else
// (incl. plain US tickers) defaults to USD.
const SUFFIX_CCY={
  '.BK':'THB','.HK':'HKD','.SS':'CNY','.SZ':'CNY','.SI':'SGD',
  '.T':'JPY','.TO':'CAD','.V':'CAD','.AX':'AUD','.NZ':'NZD',
  '.L':'GBP','.PA':'EUR','.DE':'EUR','.MI':'EUR','.AS':'EUR',
  '.MC':'EUR','.LS':'EUR','.HE':'EUR','.ST':'SEK','.OL':'NOK',
  '.CO':'DKK','.KS':'KRW','.KQ':'KRW','.TW':'TWD','.TWO':'TWD',
  '.NS':'INR','.BO':'INR','.JK':'IDR','.KL':'MYR','.SA':'BRL',
  '.MX':'MXN','.JO':'ZAR','.WA':'PLN','.IS':'TRY',
};
function inferCurrency(sym, sectorEntry){
  if(sectorEntry?.currency) return sectorEntry.currency;
  if(!sym) return 'USD';
  // Crypto pairs: BTC-USD, ETH-USD, etc. → quoted in USD
  if(sym.endsWith('-USD')) return 'USD';
  // Match longest suffix (e.g. .TWO before .TW)
  const suffixes=Object.keys(SUFFIX_CCY).sort((a,b)=>b.length-a.length);
  for(const s of suffixes){ if(sym.endsWith(s)) return SUFFIX_CCY[s]; }
  return 'USD';
}

// Hook: subscribe to sector-cache updates so the Dashboard rebuilds its
// sector donut as new tickers' sector info arrives from the background fetch.
function useSectorCache(){
  const[cache,setCache]=useState(()=>loadSectorCache());
  useEffect(()=>{
    const h=()=>setCache(loadSectorCache());
    window.addEventListener('sector-cache-updated', h);
    return()=>window.removeEventListener('sector-cache-updated', h);
  },[]);
  return cache;
}

function Dashboard({portfolio,prices,loading,onRefresh,history=[]}){
  const stats=useMemo(()=>{
    let val=0,cost=0,day=0,realizedPL=0,dividends=0,totalReturn=0;
    portfolio.holdings.forEach(h=>{
      const c=computeHolding(h,prices[h.symbol]);
      val+=c.val;cost+=c.cost;day+=c.dayChange;realizedPL+=c.realizedPL;dividends+=c.dividends;totalReturn+=c.totalReturn;
    });
    const pl=val-cost,plP=cost>0?(pl/cost)*100:0;
    const dayP=(val-day)>0?(day/(val-day))*100:0;
    return{val,cost,pl,plP,day,dayP,realizedPL,dividends,totalReturn};
  },[portfolio,prices]);

  // Per-holding compute, used by tables AND by top-mover cards.
  const allH=useMemo(()=>[...portfolio.holdings].map((h,i)=>{
    const c=computeHolding(h,prices[h.symbol]);
    return{...h,...c,color:COLORS[i%COLORS.length]};
  }),[portfolio.holdings,prices]);

  // Top movers: biggest absolute gain/loss today, biggest all-time gainer/loser
  const movers=useMemo(()=>{
    const withVal=allH.filter(h=>h.val>0);
    const byDayP=[...withVal].filter(h=>h.dayP!=null).sort((a,b)=>b.dayP-a.dayP);
    const byTotalP=[...withVal].filter(h=>h.plP!=null).sort((a,b)=>b.plP-a.plP);
    return{
      topGainerToday: byDayP[0],
      topLoserToday: byDayP.length>1 ? byDayP[byDayP.length-1] : null,
      topGainerAllTime: byTotalP[0],
      topLoserAllTime: byTotalP.length>1 ? byTotalP[byTotalP.length-1] : null,
    };
  },[allH]);

  // Portfolio history sparkline data (last 30 snapshots)
  const histSlice=history.slice(-30);
  const histValues=histSlice.map(s=>s.value);
  const histTrend=histValues.length>=2 ? histValues[histValues.length-1]-histValues[0] : 0;

  return(
    <div>
      <div className="ph">
        <h1 className="pt">{portfolio.name}</h1>
        <p className="ps">{loading?<><span className="spin spin-sm"/><span>Updating…</span></>:<><span className="dot-live"/><span>Last updated {new Date().toLocaleTimeString()}</span></>}</p>
      </div>
      <div className="stats">
        <div className="sc">
          <div className="sl">Portfolio Value</div>
          <div className="sv">{fmtB(stats.val)}</div>
          <div className={`sch ${stats.day>=0?'pos':'neg'}`}>{stats.day>=0?'▲':'▼'} {fmtC(Math.abs(stats.day))} ({fmtP(stats.dayP)}) today</div>
          {histValues.length>=2 && (
            <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid var(--border)'}}>
              <Sparkline data={histValues} width={240} height={36}
                color={histTrend>=0?'var(--green)':'var(--red)'}
                fillColor={histTrend>=0?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'}/>
              <div style={{fontSize:10,color:'var(--dim)',marginTop:4,display:'flex',justifyContent:'space-between'}}>
                <span>{histSlice[0]?.date}</span>
                <span>{histTrend>=0?'+':''}{fmtC(Math.abs(histTrend))} over {histSlice.length} day{histSlice.length!==1?'s':''}</span>
              </div>
            </div>
          )}
        </div>
        <div className="sc"><div className="sl">Unrealized P&L</div><div className={`sv ${stats.pl>=0?'pos':'neg'}`}>{stats.pl>=0?'+':''}{fmtB(stats.pl)}</div><div className={`sch ${stats.pl>=0?'pos':'neg'}`}>{fmtP(stats.plP)} on cost basis</div></div>
        <div className="sc"><div className="sl">Realized P&L</div><div className={`sv ${stats.realizedPL>=0?'pos':'neg'}`}>{stats.realizedPL>=0?'+':''}{fmtB(stats.realizedPL)}</div><div className="sch neu">From closed positions</div></div>
        <div className="sc"><div className="sl">Dividends Received</div><div className="sv pos">+{fmtB(stats.dividends)}</div><div className="sch neu">Total return: {stats.totalReturn>=0?'+':''}{fmtB(stats.totalReturn)}</div></div>
      </div>

      {/* Top movers row */}
      {(movers.topGainerToday || movers.topGainerAllTime) && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:10,marginBottom:14}}>
          {movers.topGainerToday && movers.topGainerToday.dayP>0 && (
            <div className="card" style={{padding:'12px 16px',borderLeft:'3px solid var(--green)'}}>
              <div style={{fontSize:10,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>🏆 Top Gainer Today</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontWeight:700,fontSize:14}}>{movers.topGainerToday.symbol}</div>
                <div className="pos" style={{fontWeight:700}}>{fmtP(movers.topGainerToday.dayP)}</div>
              </div>
            </div>
          )}
          {movers.topLoserToday && movers.topLoserToday.dayP<0 && (
            <div className="card" style={{padding:'12px 16px',borderLeft:'3px solid var(--red)'}}>
              <div style={{fontSize:10,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>📉 Top Loser Today</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontWeight:700,fontSize:14}}>{movers.topLoserToday.symbol}</div>
                <div className="neg" style={{fontWeight:700}}>{fmtP(movers.topLoserToday.dayP)}</div>
              </div>
            </div>
          )}
          {movers.topGainerAllTime && movers.topGainerAllTime.plP>0 && (
            <div className="card" style={{padding:'12px 16px',borderLeft:'3px solid var(--green)'}}>
              <div style={{fontSize:10,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>🚀 Best Performer (All Time)</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontWeight:700,fontSize:14}}>{movers.topGainerAllTime.symbol}</div>
                <div className="pos" style={{fontWeight:700}}>{fmtP(movers.topGainerAllTime.plP)}</div>
              </div>
            </div>
          )}
          {movers.topLoserAllTime && movers.topLoserAllTime.plP<0 && (
            <div className="card" style={{padding:'12px 16px',borderLeft:'3px solid var(--red)'}}>
              <div style={{fontSize:10,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>⚠ Worst Performer (All Time)</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontWeight:700,fontSize:14}}>{movers.topLoserAllTime.symbol}</div>
                <div className="neg" style={{fontWeight:700}}>{fmtP(movers.topLoserAllTime.plP)}</div>
              </div>
            </div>
          )}
        </div>
      )}
      {portfolio.holdings.length===0 ? (
        <div className="card"><div className="empty"><div className="empty-i">📊</div><div className="empty-t">No holdings yet</div><div className="empty-s">Go to Holdings and add your first investment.</div></div></div>
      ) : (
        <AllocationDonuts rows={allH} totalVal={stats.val}/>
      )}
    </div>
  );
}

/* ─── AllocationDonuts — reusable card grid showing 4 portfolio donuts ────

   computed values + color (i.e. the rows array from HoldingsPage). */

  const sectorCache=useSectorCache();
  const visible=rows.filter(h=>h.val>0);
  if(!visible.length) return null;
  return(
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))',gap:14,marginBottom:14}}>

        <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          <DonutChart
            slices={visible.slice(0,12).map(h=>({label:h.symbol,value:h.val,color:h.color}))}

            centerLabel={fmtB(totalVal)}
            centerSub="Total"
          />
          <div style={{flex:1,minWidth:140,display:'flex',flexDirection:'column',gap:4}}>
            {[...visible].sort((a,b)=>b.val-a.val).slice(0,6).map(h=>(
              <div key={h.id} style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>

              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="card" style={{padding:'16px 20px'}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:12}}>🏷 Allocation by Type</div>
        <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          {(()=>{
            const byType={};
            const typeColors={stock:COLORS[0],crypto:COLORS[2],etf:COLORS[1],other:COLORS[4]};
            visible.forEach(h=>{
              const t=h.type||'other';
              byType[t]=(byType[t]||0)+h.val;
            });
            const slices=Object.entries(byType).map(([type,value])=>({label:type,value,color:typeColors[type]||COLORS[5]}));
            const total=Object.values(byType).reduce((s,v)=>s+v,0);

                  {slices.sort((a,b)=>b.value-a.value).map(s=>(
                    <div key={s.label} style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                      <span style={{width:10,height:10,background:s.color,borderRadius:2,flexShrink:0}}/>
                      <span style={{flex:1,textTransform:'capitalize'}}>{s.label}</span>
                      <span style={{color:'var(--muted)',fontVariantNumeric:'tabular-nums'}}>{(s.value/total*100).toFixed(1)}%</span>
                    </div>
                  ))}
                </div>
              </>
            );
          })()}
        </div>
      </div>
      <div className="card" style={{padding:'16px 20px'}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:12}}>🏭 Allocation by Sector</div>
        <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          {(()=>{
            const bySector={};
            let unknownVal=0;
            visible.forEach(h=>{
              const sec=sectorCache[h.symbol]?.sector;
              if(sec) bySector[sec]=(bySector[sec]||0)+h.val;
              else unknownVal+=h.val;
            });
            const sectorPalette=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#f97316','#84cc16','#14b8a6','#a855f7','#0ea5e9'];
            const sortedSectors=Object.entries(bySector).sort((a,b)=>b[1]-a[1]);
            const slices=sortedSectors.map(([sector,value],i)=>({label:sector,value,color:sectorPalette[i%sectorPalette.length]}));
            if(unknownVal>0) slices.push({label:'Unknown / pending',value:unknownVal,color:'#64748b'});
            const total=slices.reduce((s,x)=>s+x.value,0);
            if(slices.length===0){
              return(
                <div style={{padding:'20px',color:'var(--dim)',fontSize:12,textAlign:'center',width:'100%'}}>
                  Sector data loading… (background fetch runs on first visit)
                </div>
              );
            }
            return(
              <>
                <DonutChart slices={slices} size={160} thickness={26}
                  centerLabel={sortedSectors.length+''}
                  centerSub={sortedSectors.length===1?'sector':'sectors'}/>
                <div style={{flex:1,minWidth:140,display:'flex',flexDirection:'column',gap:4,maxHeight:160,overflowY:'auto'}}>
                  {slices.map(s=>(
                    <div key={s.label} style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                      <span style={{width:10,height:10,background:s.color,borderRadius:2,flexShrink:0}}/>
                      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.label}</span>
                      <span style={{color:'var(--muted)',fontVariantNumeric:'tabular-nums'}}>{(s.value/total*100).toFixed(1)}%</span>
                    </div>
                  ))}
                </div>
              </>

          })()}
        </div>
      </div>
      <div className="card" style={{padding:'16px 20px'}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:12}}>💱 Currency Exposure</div>
        <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          {(()=>{
            const byCcy={};
            visible.forEach(h=>{
              const ccy=inferCurrency(h.symbol, sectorCache[h.symbol]);
              byCcy[ccy]=(byCcy[ccy]||0)+h.val;
            });
            const ccyFlags={USD:'🇺🇸',THB:'🇹🇭',EUR:'🇪🇺',GBP:'🇬🇧',JPY:'🇯🇵',HKD:'🇭🇰',SGD:'🇸🇬',CNY:'🇨🇳',KRW:'🇰🇷',TWD:'🇹🇼',CAD:'🇨🇦',AUD:'🇦🇺',NZD:'🇳🇿',INR:'🇮🇳',IDR:'🇮🇩',MYR:'🇲🇾',BRL:'🇧🇷',MXN:'🇲🇽',ZAR:'🇿🇦',PLN:'🇵🇱',TRY:'🇹🇷',SEK:'🇸🇪',NOK:'🇳🇴',DKK:'🇩🇰'};
            const ccyPalette={USD:'#3b82f6',THB:'#22c55e',EUR:'#8b5cf6',GBP:'#06b6d4',JPY:'#ef4444',HKD:'#f59e0b',SGD:'#ec4899',CNY:'#f97316',KRW:'#84cc16',TWD:'#14b8a6',CAD:'#a855f7',AUD:'#0ea5e9'};
            const palette=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#f97316','#84cc16','#14b8a6','#a855f7','#0ea5e9'];
            const sorted=Object.entries(byCcy).sort((a,b)=>b[1]-a[1]);
            const slices=sorted.map(([ccy,value],i)=>({label:`${ccyFlags[ccy]||''} ${ccy}`,value,color:ccyPalette[ccy]||palette[i%palette.length]}));
            const total=slices.reduce((s,x)=>s+x.value,0);
            if(slices.length===0){
              return(
                <div style={{padding:'20px',color:'var(--dim)',fontSize:12,textAlign:'center',width:'100%'}}>
                  No currency exposure to show.
                </div>
              );
            }
            return(
              <>
                <DonutChart slices={slices} size={160} thickness={26}
                  centerLabel={sorted.length+''}
                  centerSub={sorted.length===1?'currency':'currencies'}/>
                <div style={{flex:1,minWidth:140,display:'flex',flexDirection:'column',gap:4}}>
                  {slices.map(s=>(
                    <div key={s.label} style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                      <span style={{width:10,height:10,background:s.color,borderRadius:2,flexShrink:0}}/>
                      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.label}</span>
                      <span style={{color:'var(--muted)',fontVariantNumeric:'tabular-nums'}}>{(s.value/total*100).toFixed(1)}%</span>
                    </div>
                  ))}
                </div>
              </>
            );
          })()}
        </div>
        <div style={{fontSize:10,color:'var(--dim)',marginTop:8,fontStyle:'italic'}}>
          Inferred from ticker suffix (e.g. .BK = THB, .L = GBP). Defaults to USD if unknown.
        </div>
      </div>
    </div>
  );
}

/* ─── Holdings page ─── */
function HoldingsPage({portfolio,prices,loading,onAdd,onImportBulk,onAddTrade,onAddDividend,onDeleteTrade,onDeleteDividend,onDeleteHolding,onRefresh,onSetPhoto,onSetTags,onSetTarget,onUpdateHolding}){
  const[showAdd,setShowAdd]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const[showCsvImport,setShowCsvImport]=useState(false);
  const[tradeFor,setTradeFor]=useState(null);
  const[divFor,setDivFor]=useState(null);
  const[chartFor,setChartFor]=useState(null);
  const[expanded,setExpanded]=useState(null);
  const[sort,setSort]=useState('val-desc');
  const[search,setSearch]=useState('');
  const[typeFilter,setTypeFilter]=useState('all');
  const[tagFilter,setTagFilter]=useState('all');
  // Whether the rebalance columns (Target / Drift / Action) are shown
  const[showRebalance,setShowRebalance]=useState(false);

  const rows=useMemo(()=>portfolio.holdings.map((h,i)=>{
    const c=computeHolding(h,prices[h.symbol]);
    return{...h,...c,color:COLORS[i%COLORS.length],target:h.targetAllocation||0};
  }),[portfolio.holdings,prices]);
  const portfolioTotalVal=useMemo(()=>rows.reduce((s,r)=>s+(r.val||0),0)||1,[rows]);
  const totalTarget=useMemo(()=>rows.reduce((s,r)=>s+(r.target||0),0),[rows]);
  const targetsValid=Math.abs(totalTarget-100)<0.5;
  const noTargets=rows.every(r=>!r.target);

  // Rebalance helpers (formerly on the standalone Rebalance page)
  function matchCurrentTargets(){
    if(!portfolioTotalVal) return;
    rows.forEach(r=>{
      const pct=parseFloat(((r.val/portfolioTotalVal)*100).toFixed(2));
      onSetTarget?.(r.id, pct);
    });
  }
  function normalizeTargets(){
    if(noTargets){
      const each=parseFloat((100/rows.length).toFixed(2));
      rows.forEach(r=>onSetTarget?.(r.id, each));
      return;
    }
    if(totalTarget<=0) return;
    rows.forEach(r=>{
      const norm=parseFloat(((r.target/totalTarget)*100).toFixed(2));
      if(Math.abs(norm-r.target)>0.001) onSetTarget?.(r.id, norm);
    });
  }
  async function clearAllTargets(){
    if(!(await uiConfirm('Clear all target allocations?'))) return;
    rows.forEach(r=>onSetTarget?.(r.id, 0));
  }

  // All tags across the portfolio for the dropdown
  const allTags=useMemo(()=>{
    const s=new Set();
    portfolio.holdings.forEach(h=>(h.tags||[]).forEach(t=>s.add(t)));
    return [...s].sort();
  },[portfolio.holdings]);

  const filtered=useMemo(()=>{
    let list=rows;
    if(search.trim()){
      const q=search.trim().toLowerCase();
      list=list.filter(h=>(h.symbol||'').toLowerCase().includes(q)||(h.notes||'').toLowerCase().includes(q));
    }
    if(typeFilter!=='all') list=list.filter(h=>h.type===typeFilter);
    if(tagFilter!=='all') list=list.filter(h=>(h.tags||[]).includes(tagFilter));
    return list;
  },[rows,search,typeFilter,tagFilter]);

  const sorted=useMemo(()=>{
    const[field,dir]=sort.split('-');
    return[...filtered].sort((a,b)=>{
      let va=a[field],vb=b[field];
      if(va==null)va=dir==='desc'?-Infinity:Infinity;
      if(vb==null)vb=dir==='desc'?-Infinity:Infinity;
      if(typeof va==='string')return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
      return dir==='asc'?va-vb:vb-va;
    });
  },[filtered,sort]);

  return(
    <div>
      <div className="ph"><h1 className="pt">Holdings</h1><p className="ps">{portfolio.name} · {portfolio.holdings.length} positions{sorted.length!==rows.length?` · ${sorted.length} shown`:''}</p></div>
      <div className="toolbar">
        <div className="toolbar-l">
          <button className="btn btn-primary"onClick={()=>setShowAdd(true)}>+ Add Holding</button>
          <button className="btn btn-ghost"onClick={()=>setShowImport(true)}>📷 Photo Import</button>
          <button className="btn btn-ghost"onClick={()=>setShowCsvImport(true)}>📄 CSV Import</button>
          <button className={`btn ${showRebalance?'btn-primary':'btn-ghost'}`} onClick={()=>setShowRebalance(v=>!v)} title="Toggle rebalance columns (Target % / Drift / Action)">
            ⚖ {showRebalance?'Hide':'Show'} Rebalance
          </button>
        </div>
        <div className="toolbar-r">
          <div className="sort-bar"><label>Sort by</label><select value={sort}onChange={e=>setSort(e.target.value)}>{SORT_OPTS.map(o=><option key={o.v}value={o.v}>{o.l}</option>)}</select></div>
          {loading&&<span className="spin spin-sm"/>}
          <button className="btn btn-ghost"onClick={onRefresh}disabled={loading}>↻ Refresh</button>
        </div>
      </div>
      {showRebalance && portfolio.holdings.length>0 && (
        <div className="card" style={{padding:'10px 14px',marginBottom:10,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:11,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.05em',fontWeight:700}}>⚖ Rebalance helpers</span>
          <button className="btn btn-ghost btn-sm" onClick={matchCurrentTargets} title="Set each target equal to its current weight">Match current</button>
          <button className="btn btn-ghost btn-sm" onClick={normalizeTargets} title="Scale all targets so they sum to 100%">{noTargets?'Equal-weight all':'Normalize to 100%'}</button>
          <button className="btn btn-ghost btn-sm" onClick={clearAllTargets} style={{color:'var(--red)'}}>Clear all</button>
          <span style={{marginLeft:'auto',fontSize:12,color:targetsValid?'var(--green)':(totalTarget>0?'var(--amber)':'var(--dim)')}}>
            Targets sum: <strong>{totalTarget.toFixed(2)}%</strong>{totalTarget>0?(targetsValid?' ✓':' ⚠ should equal 100%'):''}
          </span>
        </div>
      )}
      {portfolio.holdings.length>0 && (
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10,alignItems:'center'}}>
          <input
            type="search"
            placeholder="🔍 Search by symbol or notes…"
            value={search}
            onChange={e=>setSearch(e.target.value)}
            style={{padding:'7px 10px',fontSize:13,minWidth:200,flex:'1 1 200px',maxWidth:320}}
          />
          <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{padding:'7px 10px',fontSize:13}}>
            <option value="all">All types</option>
            <option value="stock">Stock</option>
            <option value="crypto">Crypto</option>
            <option value="etf">ETF</option>
            <option value="other">Other</option>
          </select>
          {allTags.length>0 && (
            <select value={tagFilter} onChange={e=>setTagFilter(e.target.value)} style={{padding:'7px 10px',fontSize:13}}>
              <option value="all">All tags</option>
              {allTags.map(t=><option key={t} value={t}>🏷 {t}</option>)}
            </select>
          )}
          {(search||typeFilter!=='all'||tagFilter!=='all') && (
            <button className="btn btn-ghost btn-sm" onClick={()=>{setSearch('');setTypeFilter('all');setTagFilter('all');}}>
              ✕ Clear filters
            </button>
          )}
        </div>
      )}
      <div className="card">
        {portfolio.holdings.length===0?(
          <div className="empty"><div className="empty-i">💼</div><div className="empty-t">No holdings</div><div className="empty-s">Add a holding or import from a screenshot.</div><button className="btn btn-primary"onClick={()=>setShowAdd(true)}>+ Add Holding</button></div>
        ):(
          <div className="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>Asset</th><th>Shares</th><th>Avg Cost</th><th>Live Price</th>
                  <th>Market Value</th><th>Allocation</th>
                  {showRebalance && <><th>Target %</th><th>Drift</th><th>Action</th></>}
                  <th>Unrealized P&L</th><th>Unrealized %</th>
                  <th>Realized P&L</th><th>Dividends</th><th>Total Return</th>
                  <th>Today</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map(h=>(
                  <React.Fragment key={h.id}>
                    <tr className="data-row"onClick={()=>setExpanded(e=>e===h.id?null:h.id)}>
                      <td><div className="sym-cell"><div className="sym-badge"style={{background:h.color+'22',color:h.color}}>{h.symbol.replace('-USD','').slice(0,3)}</div><div><div className="sym-name">{h.symbol} {((h.alerts||[]).some(a=>a.enabled!==false && !a.triggered) || (h.emaTriggers&&Object.values(h.emaTriggers).some(Boolean))) && <span title="Alerts armed" style={{fontSize:10,marginLeft:4}}>🔔</span>}</div><span className={`tag tag-${h.type}`}>{h.type}</span></div><button title="Chart & alerts"onClick={e=>{e.stopPropagation();setChartFor(h);}}style={{marginLeft:'auto',background:'transparent',border:'1px solid var(--border)',borderRadius:6,padding:'4px 8px',color:'var(--muted)',cursor:'pointer',fontSize:14}}>📈</button></div></td>

/* ─── Calendar (earnings + ex-dividend dates) ─────────────────────────
   Cache structure: { sym: {fetchedAt, earnings:[unixSec...], exDividend:unixSec|null} }
   Fetched once per ticker per 24h via Yahoo's quoteSummary calendarEvents.  */
const CALENDAR_CACHE_KEY='ptv3-calendar-cache';
const CALENDAR_MAX_AGE_MS=24*60*60*1000;
function loadCalendarCache(){
  try{ return JSON.parse(localStorage.getItem(CALENDAR_CACHE_KEY)||'{}'); }catch{ return{}; }
}
function saveCalendarCache(c){
  try{ localStorage.setItem(CALENDAR_CACHE_KEY, JSON.stringify(c)); }catch{}
}

// Returns either a normal {earnings, exDividend, divDate} object or, if Yahoo
// blocks us with the crumb-cookie wall, {blocked:true}. As of mid-2026 the
// /v10/quoteSummary endpoint requires a crumb cookie — so this fetcher will
// effectively always return blocked unless Yahoo restores public access. The
// caller is responsible for honoring `blocked` and stopping further calls.
async function fetchCalendarForTicker(sym){
  const url=`https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(sym)}?modules=calendarEvents`;
  // We bypass fetchWithFallback here because it throws on non-200 responses.
  // Yahoo returns 401 with a JSON body explaining the auth wall — we need to
  // READ that body to set the blocked sentinel correctly.
  const proxied=proxyWrap(url);
  if(!proxied) return{earnings:[], exDividend:null, divDate:null, error:'no proxy (file:// origin)'};
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), 6000);
    const r=await fetch(proxied,{cache:'no-store',signal:ctrl.signal});
    clearTimeout(timer);
    // Treat 401/403 as the auth wall — peek at body for description if available.
    if(r.status===401 || r.status===403){
      let desc='Invalid Crumb';
      try{ const j=await r.json(); desc=j?.finance?.error?.description||j?.quoteSummary?.error?.description||desc; }catch{}
      return{blocked:true, error:`HTTP ${r.status}: ${desc}`};
    }
    if(!r.ok) return{earnings:[], exDividend:null, divDate:null, error:'HTTP '+r.status};
    const j=await r.json();
    // Also catch the body-level error (some Yahoo deployments return 200 with error in body).
    const errDesc=j?.quoteSummary?.error?.description || j?.finance?.error?.description;
    if(errDesc && /crumb|unauthorized/i.test(errDesc)){
      return{blocked:true, error:errDesc};
    }
    const ev=j?.quoteSummary?.result?.[0]?.calendarEvents;
    if(!ev) return{earnings:[], exDividend:null, divDate:null};
    const earnings=(ev.earnings?.earningsDate||[]).map(d=>d.raw).filter(Boolean);
    const exDiv=ev.exDividendDate?.raw||null;
    const divDate=ev.dividendDate?.raw||null;
    return{earnings, exDividend:exDiv, divDate};
  }catch(e){
    return{earnings:[], exDividend:null, divDate:null, error:e.message};
  }
}

// Sentinel key in the cache. When set, we skip ALL future calendar fetches —
// there's no point hammering an endpoint that demands authentication we can't
// provide. User can clear it via localStorage if Yahoo restores access.
const CALENDAR_BLOCKED_KEY='__yahooBlocked';

let _calRefreshInProgress=false;
async function refreshCalendarCache(symbols, force=false){
  if(!symbols.length || _calRefreshInProgress) return 0;
  const cache=loadCalendarCache();
  // Short-circuit if Yahoo previously rejected us.
  if(cache[CALENDAR_BLOCKED_KEY]){
    console.log('[Calendar] Yahoo endpoint blocked (Invalid Crumb) — skipping fetch.');
    return 0;
  }
  _calRefreshInProgress=true;
  const cutoff=Date.now()-CALENDAR_MAX_AGE_MS;
  let updated=0;
  try{
    for(const sym of symbols){
      const existing=cache[sym];
      if(!force && existing && existing.fetchedAt>cutoff) continue;
      const info=await fetchCalendarForTicker(sym);
      // First sign of Yahoo's auth wall → flip the sentinel and stop.
      if(info.blocked){
        cache[CALENDAR_BLOCKED_KEY]={at:Date.now(), error:info.error};
        saveCalendarCache(cache);
        console.warn('[Calendar] Yahoo blocked future requests:', info.error);
        window.dispatchEvent(new CustomEvent('calendar-cache-updated',{detail:{blocked:true}}));
        break;
      }
      cache[sym]={...info, fetchedAt:Date.now()};
      saveCalendarCache(cache);
      window.dispatchEvent(new CustomEvent('calendar-cache-updated',{detail:{sym}}));
      updated++;
      await new Promise(r=>setTimeout(r,250));
    }
  } finally {
    _calRefreshInProgress=false;
  }
  return updated;
}

/* Upcoming events strip — used inside NewsPage. Reads from the same shared
   calendar cache. Compact horizontal scroller; click a ticker to filter News
   to that symbol (via the onFilterSym callback). */
function UpcomingEvents({symbols, mutedSet, onFilterSym}){
  const[cache,setCache]=useState(loadCalendarCache());
  const[daysAhead,setDaysAhead]=useState(60);
  const[collapsed,setCollapsed]=useState(false);

  useEffect(()=>{
    const h=()=>setCache(loadCalendarCache());
    window.addEventListener('calendar-cache-updated', h);
    return()=>window.removeEventListener('calendar-cache-updated', h);
  },[]);

  // Drop muted tickers — if you've muted news for a ticker, hide its events too
  const activeSyms=useMemo(()=>symbols.filter(s=>!mutedSet?.has(s)),[symbols,mutedSet]);

  const events=useMemo(()=>{
    const out=[];
    const cutoffTs=Date.now()-1*24*60*60*1000;
    const ahead=Date.now()+daysAhead*24*60*60*1000;
    for(const sym of activeSyms){
      const entry=cache[sym];
      if(!entry) continue;
      for(const e of (entry.earnings||[])){
        const ts=e*1000;
        if(ts>=cutoffTs && ts<=ahead) out.push({sym, type:'earnings', ts});
      }
      if(entry.exDividend){
        const ts=entry.exDividend*1000;
        if(ts>=cutoffTs && ts<=ahead) out.push({sym, type:'ex-dividend', ts});
      }
      if(entry.divDate){
        const ts=entry.divDate*1000;
        if(ts>=cutoffTs && ts<=ahead) out.push({sym, type:'dividend-pay', ts});
      }
    }
    return out.sort((a,b)=>a.ts-b.ts);
  },[cache, activeSyms, daysAhead]);

  // Group by date for compact display
  const grouped=useMemo(()=>{
    const map={};
    for(const e of events){
      const d=new Date(e.ts).toISOString().split('T')[0];
      if(!map[d]) map[d]={date:d, items:[]};
      map[d].items.push(e);
    }
    return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
  },[events]);

  // Detect the "Yahoo blocked us with Invalid Crumb" sentinel for the banner.
  const yahooBlocked=cache[CALENDAR_BLOCKED_KEY];
  // Have we attempted a fetch yet? If the cache has ANY ticker entry, we have.
  const hasAttempted=Object.keys(cache).some(k=>k!==CALENDAR_BLOCKED_KEY);

  function badgeStyle(type){
    if(type==='earnings') return{background:'rgba(245,158,11,.18)', color:'#fcd34d', label:'📊 Earnings'};
    if(type==='ex-dividend') return{background:'rgba(34,197,94,.18)', color:'#86efac', label:'💰 Ex-Div'};
    return{background:'rgba(59,130,246,.18)', color:'#93c5fd', label:'💵 Div Pay'};
  }
  function daysFromNow(ts){
    const d=Math.round((ts-Date.now())/(1000*60*60*24));
    if(d===0) return 'today';
    if(d===1) return 'tomorrow';
    if(d===-1) return 'yesterday';
    if(d<0) return `${Math.abs(d)}d ago`;
    return `in ${d}d`;
  }

  // Build a status label for the header so the widget is always discoverable,
  // even before the first fetch completes or when Yahoo is blocking us.
  let statusLabel;
  if(yahooBlocked) statusLabel='unavailable';
  else if(!hasAttempted) statusLabel='loading…';
  else if(events.length===0) statusLabel=`0 in next ${daysAhead}d`;
  else statusLabel=`${events.length} in next ${daysAhead}d`;

  return(
    <div className="card" style={{marginBottom:14}}>
      <div style={{padding:'12px 16px',borderBottom:collapsed?'none':'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <button onClick={()=>setCollapsed(v=>!v)} className="btn-del" style={{fontSize:12,color:'var(--muted)'}} title={collapsed?'Expand':'Collapse'}>
          {collapsed?'▸':'▾'}
        </button>
        <span style={{fontWeight:600,fontSize:14}}>📅 Upcoming Events</span>
        <span style={{fontSize:12,color:yahooBlocked?'var(--amber)':'var(--muted)'}}>{statusLabel}</span>
        <select value={daysAhead} onChange={e=>setDaysAhead(parseInt(e.target.value))}
          style={{padding:'4px 8px',fontSize:11,marginLeft:'auto',width:'auto'}}>
          {[14,30,60,90,180].map(d=><option key={d} value={d}>{d} days</option>)}
        </select>
      </div>
      {!collapsed && yahooBlocked && (
        <div style={{padding:'12px 16px',fontSize:12,color:'var(--muted)',background:'rgba(245,158,11,.05)',borderLeft:'3px solid var(--amber)'}}>
          <strong style={{color:'var(--amber)'}}>Calendar data unavailable.</strong>{' '}
          Yahoo Finance now requires authentication (Invalid Crumb) for earnings and ex-dividend dates.
          The feature is currently disabled; clear <code style={{background:'rgba(0,0,0,.25)',padding:'1px 4px',borderRadius:3}}>ptv3-calendar-cache</code> in localStorage to retry.
        </div>
      )}
      {!collapsed && !yahooBlocked && events.length===0 && (
        <div style={{padding:'14px 16px',fontSize:12,color:'var(--dim)',textAlign:'center'}}>
          {hasAttempted
            ? `No earnings or dividend events in the next ${daysAhead} days. Try a wider range above.`
            : 'Fetching calendar data from Yahoo Finance… (runs once per day per ticker)'}
        </div>
      )}
      {!collapsed && events.length>0 && (
        <div style={{padding:'10px 16px',display:'grid',gap:8,maxHeight:280,overflowY:'auto'}}>
          {grouped.map(g=>{
            const dt=new Date(g.date+'T12:00:00');
            const weekday=dt.toLocaleDateString('en-US',{weekday:'short'});
            const monthDay=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
            return(
              <div key={g.date} style={{display:'flex',alignItems:'flex-start',gap:10,paddingBottom:6,borderBottom:'1px solid rgba(45,63,85,.4)'}}>
                <div style={{minWidth:74,fontSize:12}}>

/* ─── News page ──────────────────────────────────────────────────────────
   Aggregates news headlines for every holding in the active portfolio.
   - Fetches via Yahoo Finance's /v1/finance/search endpoint (through the
     local CORS-bypass proxy at /proxy?url=...).
   - Caches results in localStorage per ticker with a fetch-time stamp.
   - Auto-refreshes when the cache is stale (>24h old).
   - User can force a refresh anytime via the Refresh button.
   - Items shown chronologically (newest first), with the ticker label.
   ─────────────────────────────────────────────────────────────────────── */

const NEWS_CACHE_KEY='ptv3-news-cache';
const NEWS_MAX_AGE_MS=24*60*60*1000; // 24 hours — re-fetch interval
const NEWS_ITEM_MAX_AGE_MS=7*24*60*60*1000; // 7 days — items older than this are pruned
const NEWS_RECENT_MS=2*24*60*60*1000; // 2 days — default visible window on News page (older items only surface via search)

// Muted tickers: news for symbols in this set is hidden + not fetched.
const NEWS_MUTED_KEY='ptv3-news-muted';
function loadMutedNews(){
  try{ return new Set(JSON.parse(localStorage.getItem(NEWS_MUTED_KEY)||'[]')); }catch{ return new Set(); }
}
function saveMutedNews(set){
  try{ localStorage.setItem(NEWS_MUTED_KEY, JSON.stringify([...set])); }catch{}
}

function loadNewsCache(){
  let c;
  try{ c=JSON.parse(localStorage.getItem(NEWS_CACHE_KEY)||'{}'); }catch{ return{}; }
  // Prune items older than 7 days on every load
  const cutoff=Date.now()-NEWS_ITEM_MAX_AGE_MS;
  let mutated=false;
  for(const sym of Object.keys(c)){
    const entry=c[sym];
    if(!entry?.items) continue;
    const kept=entry.items.filter(n=>(n.time||0)>=cutoff);
    if(kept.length!==entry.items.length){
      c[sym]={...entry,items:kept};
      mutated=true;
    }
  }
  if(mutated){
    try{ localStorage.setItem(NEWS_CACHE_KEY, JSON.stringify(c)); }catch{}
  }
  return c;
}
function saveNewsCache(c){
  try{ localStorage.setItem(NEWS_CACHE_KEY, JSON.stringify(c)); }catch{}
}

// ─── Benchmark (SPY) history cache ─────────────────────────────────
//   Fetches up to 6mo of daily SPY closes via Yahoo chart endpoint.
//   Cached for 6h to avoid hammering the API.
const BENCHMARK_CACHE_KEY='ptv3-benchmark-cache';
const BENCHMARK_MAX_AGE_MS=6*60*60*1000;
async function fetchBenchmarkHistory(sym='SPY'){
  try{
    const cached=JSON.parse(localStorage.getItem(BENCHMARK_CACHE_KEY)||'{}');
    if(cached[sym]?.data && Date.now()-cached[sym].fetchedAt<BENCHMARK_MAX_AGE_MS){
      return cached[sym].data;
    }
  }catch{}
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=6mo`;
  const proxied=proxyWrap(url)||url;
  try{
    const r=await fetch(proxied,{cache:'no-store'});
    if(!r.ok) return null;
    const j=await r.json();
    const result=j?.chart?.result?.[0];
    if(!result) return null;
    const ts=result.timestamp||[];
    const closes=result.indicators?.quote?.[0]?.close||[];
    const data=ts.map((t,i)=>({
      date:new Date(t*1000).toISOString().slice(0,10),
      close:closes[i],
    })).filter(d=>d.close!=null);
    try{
      const cached=JSON.parse(localStorage.getItem(BENCHMARK_CACHE_KEY)||'{}');
      cached[sym]={data, fetchedAt:Date.now()};
      localStorage.setItem(BENCHMARK_CACHE_KEY, JSON.stringify(cached));
    }catch{}
    return data;
  }catch(e){
    console.warn('[Benchmark] Fetch failed for',sym,e.message);
    return null;
  }
}

// ─── Per-symbol historical price cache (for stock chart modal + EMA) ───
//   Cache keyed by `${symbol}|${range}` with 24h TTL (daily-close data
//   doesn't change intraday). Used by StockChartModal and the EMA
//   trigger evaluator.
const HIST_CACHE_KEY='ptv3-hist-cache';
const HIST_MAX_AGE_MS=24*60*60*1000;
function loadHistCache(){
  try{ return JSON.parse(localStorage.getItem(HIST_CACHE_KEY)||'{}'); }catch{ return{}; }
}
function saveHistCache(c){
  try{ localStorage.setItem(HIST_CACHE_KEY, JSON.stringify(c)); }catch{}
}
// Fetch daily closes for a symbol over a given range via the Yahoo chart
// endpoint (same source as fetchBenchmarkHistory). Range strings match Yahoo:
// 1mo / 3mo / 6mo / 1y / 5y. Returns {closes:[...], dates:[...]} or null on failure.
async function fetchHistoricalPrices(symbol, range='1y', opts={}){
  const force=opts.force===true;
  const key=`${symbol}|${range}`;
  const cache=loadHistCache();
  if(!force && cache[key]?.closes?.length && (Date.now()-cache[key].fetchedAt < HIST_MAX_AGE_MS)){
    return{closes:cache[key].closes, dates:cache[key].dates};
  }
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=${range}`;
  const proxied=proxyWrap(url)||url;
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(), 9000);
    const r=await fetch(proxied,{cache:'no-store',signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) return cache[key] ? {closes:cache[key].closes, dates:cache[key].dates} : null;
    const j=await r.json();
    const result=j?.chart?.result?.[0];
    if(!result) return null;
    const ts=result.timestamp||[];
    const rawCloses=result.indicators?.quote?.[0]?.close||[];
    const closes=[], dates=[];
    for(let i=0;i<ts.length;i++){
      if(rawCloses[i]==null) continue;
      closes.push(Number(rawCloses[i]));
      dates.push(new Date(ts[i]*1000).toISOString().slice(0,10));
    }
    if(!closes.length) return null;
    cache[key]={closes, dates, fetchedAt:Date.now()};
    saveHistCache(cache);
    return{closes, dates};
  }catch(e){
    console.warn('[Hist] Fetch failed for',symbol,range,e.message);
    return cache[key] ? {closes:cache[key].closes, dates:cache[key].dates} : null;
  }
}

// Standard EMA: seed with SMA of first `period` closes, then
//   EMA_t = close_t * k + EMA_{t-1} * (1-k),  k = 2/(period+1)
// Returns an array aligned with `closes` (null for the warm-up window).
function calculateEMA(closes, period){
  if(!Array.isArray(closes) || closes.length<period) return new Array(closes?.length||0).fill(null);
  const k=2/(period+1);
  const out=new Array(closes.length).fill(null);
  let sum=0;
  for(let i=0;i<period;i++) sum+=closes[i];
  let ema=sum/period;
  out[period-1]=ema;
  for(let i=period;i<closes.length;i++){
    ema=closes[i]*k + ema*(1-k);
    out[i]=ema;
  }
  return out;
}

// Detect whether series A crossed series B between `prev` and `curr` samples.
// Returns 'up' (A moved from <=B to >B), 'down' (A moved from >=B to <B), or null.
// Any null input short-circuits to null (warm-up window — no cross yet).
function detectCross(prevA, currA, prevB, currB){
  if(prevA==null||currA==null||prevB==null||currB==null) return null;
  if(prevA<=prevB && currA>currB) return 'up';
  if(prevA>=prevB && currA<currB) return 'down';
  return null;
}

// ─── Browser notifications ───────────────────────────────────────────
//   Central dispatcher. Always emits an in-app toast via the global toast
//   bridge (wired by App on mount). If Notification permission is granted,
//   ALSO fires a system notification. Per-tag dedupe prevents repeat fires
//   within NOTIFY_DEDUPE_MS for the same tag.
const NOTIFY_DEDUPE_MS=12*60*60*1000; // 12h
const _notifySeen={}; // tag -> last fire ms
let _toastBridge=null;
function _setToastBridge(fn){ _toastBridge=fn; }
function notify(title, body, tag){
  const now=Date.now();
  if(tag && _notifySeen[tag] && (now-_notifySeen[tag] < NOTIFY_DEDUPE_MS)) return false;
  if(tag) _notifySeen[tag]=now;
  // In-app toast (always)
  try{ _toastBridge?.(`${title}: ${body}`, 'info'); }catch{}
  // System notification (if granted)
  try{
    if(typeof Notification!=='undefined' && Notification.permission==='granted'){
      if('serviceWorker' in navigator && navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(reg=>{
          reg.showNotification(title, {body, tag, icon:'./manifest.json', renotify:false}).catch(()=>{
            try{ new Notification(title,{body, tag}); }catch{}
          });
        }).catch(()=>{
          try{ new Notification(title,{body, tag}); }catch{}
        });
      } else {
        new Notification(title,{body, tag});
      }
    }
  }catch{}
  return true;
}
function getNotificationPermission(){
  if(typeof Notification==='undefined') return 'unsupported';
  return Notification.permission; // 'granted' | 'denied' | 'default'
}
async function requestNotificationPermission(){
  if(typeof Notification==='undefined') return 'unsupported';
  if(Notification.permission==='granted'||Notification.permission==='denied') return Notification.permission;
  try{ return await Notification.requestPermission(); }
  catch{ return 'default'; }
}

// ─── EMA state cache (previous values for cross detection) ───
//   For each symbol: {ema50, ema200, lastPrice, lastCheckedAt, lastClose, lastCloseDate}
const EMA_STATE_KEY='ptv3-ema-state';
function loadEmaState(){
