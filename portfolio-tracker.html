  <script>
    // Register the service worker only when served via http(s) — file:// can't host one.
    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      // Capture whether a SW was already controlling this page at load time.
      // First install has no prior controller — activation is NOT an "update",
      // so we must NOT reload (that's what caused the Android stuck-on-open loop).
      const hadController = !!navigator.serviceWorker.controller;
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('service-worker.js').then(reg=>{
          console.log('[PWA] Service worker registered, scope:', reg.scope);
          // Force-check for a new SW version on every page load
          reg.update();
          // Only auto-reload if (a) there was already a SW controlling this page
          // AND (b) we haven't already reloaded once this session — belt-and-braces
          // against any future runaway loop.
          if(hadController && !sessionStorage.getItem('sw-reloaded')){
            let reloading=false;
            navigator.serviceWorker.addEventListener('controllerchange', ()=>{
              if(!reloading){
                reloading=true;
                sessionStorage.setItem('sw-reloaded','1');
                window.location.reload();
              }
            });
          }
        }).catch(err=>console.warn('[PWA] SW registration failed:', err.message));
      });
    }

  <style>

    }

// are either paid, dead, rate-limited, or block null origin as of late 2025 — so
// we run our own proxy in both dev and prod.
const PROXY_REMOTE='https://portfolio-proxy.ptv3proxy.workers.dev';
const PROXY_BASE=(()=>{
  if(typeof location==='undefined') return null;
  if(location.protocol==='file:') return null; // no proxy possible from file://
  const host=location.hostname;
  if(host==='localhost' || host==='127.0.0.1' || host==='') return location.origin;
  return PROXY_REMOTE;
})();
// Single helper: wraps a target URL in our proxy. Returns null if no proxy is
// reachable (file:// origin). Every fetch site below uses this — change the
// scheme once, here.
function proxyWrap(url){
  if(!PROXY_BASE) return null;
  return `${PROXY_BASE}/proxy?url=${encodeURIComponent(url)}`;
}
const PROXIES=[proxyWrap].filter(w=>w);

/* ── Price cache (daily close) ──────────────────────────────────────────
   We only need each ticker's most-recent CLOSE — there's no point hammering
   APIs every 30 seconds. Strategy:
     - Each entry: {price, change, pct, name, marketCap, asOf, fetchedAt}
       where asOf is the trading date Stooq returned (YYYY-MM-DD) and
       fetchedAt is the wall-clock time we successfully fetched it.
     - On any refresh, symbols with a fetchedAt newer than PRICE_FRESH_MS are
       skipped (cache-hit). Manual refresh button passes force:true to bypass.
     - Cache persists across sessions, so on app launch the UI shows last-known
       prices instantly while a background fetch updates anything stale. */
const PRICE_CACHE_KEY='ptv3-price-cache';
const PRICE_FRESH_MS=4*60*60*1000; // 4 hours — markets only close once per day, but allow a couple of intraday refreshes
function loadPriceCache(){
  try{ return JSON.parse(localStorage.getItem(PRICE_CACHE_KEY)||'{}'); }
  catch{ return{}; }
}
function savePriceCache(c){
  try{ localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(c)); }
  catch{}
}

// Stooq batch CSV endpoint. ONE request returns ALL symbols.
//   GET https://stooq.com/q/l/?s=aapl.us msft.us googl.us&f=sd2t2ohlcv&h&e=csv
// IMPORTANT separator rules (verified May 2026):
//   - SPACE separator (encoded as %20) → splits correctly into multiple rows ✓
//   - Raw '+' in the URL → also splits, but encodeURIComponent turns '+' into
//     %2B, and Stooq does NOT split on %2B (treats it as literal '+' in symbol
//     name). So if you want '+' you must avoid encoding it.
//   - COMMA → does NOT split; Stooq joins everything into one literal symbol
//     name and returns one N/D row.
// We use SPACE because it round-trips cleanly through encodeURIComponent.
// Response:
//   Symbol,Date,Time,Open,High,Low,Close,Volume
//   AAPL.US,2026-05-22,16:00:01,233.34,234.46,233.05,234.4,12345678
//   MSFT.US,2026-05-22,16:00:01,424.32,427.4,422.46,423.93,9876543
//   UNKNOWN.US,N/D,N/D,N/D,N/D,N/D,N/D,N/D
// Rows for unknown tickers contain N/D in every field — we just skip them.
// URL length limit is ~2KB, so we chunk at 40 symbols per request (~7 chars each).
async function getPricesViaStooq(symbols){
  if(!symbols.length) return{};
  const out={};
  const CHUNK=40;
  const TIMEOUT=8000; // 8s — fail fast, don't waste budget on hung requests
  const wrap=url=>proxyWrap(url)||url;
  // Fetch each chunk in parallel — usually just 1 chunk for portfolios <40 symbols.
  const chunks=[];
  for(let i=0;i<symbols.length;i+=CHUNK) chunks.push(symbols.slice(i,i+CHUNK));
  const results=await Promise.all(chunks.map(async chunk=>{
    // Space separator (NOT comma — see header comment). After encodeURIComponent
    // it becomes %20 which Stooq splits on correctly.
    const sStr=chunk.map(s=>s.toLowerCase()+'.us').join(' ');
    const url=`https://stooq.com/q/l/?s=${encodeURIComponent(sStr)}&f=sd2t2ohlcv&h&e=csv`;
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(), TIMEOUT);
      const r=await fetch(wrap(url),{cache:'no-store',signal:ctrl.signal});
      clearTimeout(timer);
      if(!r.ok) return [];
      const csv=(await r.text()).trim();
      const lines=csv.split('\n');
      const rows=[];
      for(let j=1;j<lines.length;j++){
        const cells=lines[j].split(',');
        if(cells.length<7) continue;
        const stooqSym=cells[0]; // e.g. AAPL.US
        const ourSym=stooqSym.replace(/\.US$/i,'').toUpperCase();
        if(cells.includes('N/D')) continue; // unknown ticker — skip
        const asOf=cells[1] && /^\d{4}-\d{2}-\d{2}$/.test(cells[1]) ? cells[1] : today();
        const open=parseFloat(cells[3]);
        const close=parseFloat(cells[6]);
        if(isNaN(close)||close<=0) continue;
        const change=close-(isNaN(open)?close:open);
        const pct=(open>0)?(change/open*100):0;
        rows.push([ourSym,{
          price:close, change, pct,
          name:ourSym, marketCap:null,
          asOf, fetchedAt:Date.now(),
        }]);
      }
      return rows;
    }catch{ return []; }
  }));
  results.flat().forEach(r=>{ if(r) out[r[0]]=r[1]; });
  return out;
}

async function fetchWithFallback(url,opts={},perProxyTimeoutMs=6000){
  let lastErr='No proxy responded';
  for(const wrap of PROXIES){
    const proxiedUrl=wrap(url);
    if(!proxiedUrl) continue; // no proxy reachable (e.g. file:// origin)
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),perProxyTimeoutMs);
    try{
      const r=await fetch(proxiedUrl,{cache:'no-store',signal:ctrl.signal,...opts});
      clearTimeout(timer);
      if(r.ok)return r;
      lastErr='HTTP '+r.status;
    }catch(e){
      clearTimeout(timer);
      lastErr=e.name==='AbortError'?`timeout after ${perProxyTimeoutMs}ms`:(e.message||'fetch failed');
    }
  }
  throw new Error(lastErr);
}

/* ── timeframe filter helper ─────────────────────────────────────────────
   Slice a daily-snapshot history array (each item has {date:'YYYY-MM-DD', ...})
   by a named timeframe. Returns the original array for 'all'. */
const TIMEFRAMES=[
  {id:'1M',  label:'1M',  days:30},
  {id:'3M',  label:'3M',  days:90},
  {id:'6M',  label:'6M',  days:180},
  {id:'YTD', label:'YTD', days:null}, // computed: from Jan 1 of current year
  {id:'1Y',  label:'1Y',  days:365},
  {id:'all', label:'All', days:null}, // no cutoff
];
function sliceByTimeframe(history, tfId){
  if(!Array.isArray(history) || history.length===0) return [];
  const tf=TIMEFRAMES.find(t=>t.id===tfId);
  if(!tf || tfId==='all') return history;
  let cutoff;
  if(tfId==='YTD'){
    cutoff=`${new Date().getFullYear()}-01-01`;
  } else {
    const d=new Date(); d.setDate(d.getDate()-tf.days);
    cutoff=d.toISOString().split('T')[0];
  }
  return history.filter(s=>s.date>=cutoff);
}

/* ── image compression ── */
function compressImage(file,maxPx=800,quality=0.72){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const ratio=Math.min(maxPx/img.width,maxPx/img.height,1);
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
const fmt=(n,d=2)=>(n==null||isNaN(n))?'—':n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
// Currency-aware money formatter. All values in the app are stored as USD; this
// helper converts and formats to the user's selected display currency (default USD).
// The CURRENCY object below is mutated by the Settings page and consulted on every
// render. NOT reactive on its own — components that change currency call a setter
// that triggers a re-render.
const CURRENCY={code:'USD',rate:1,symbol:'$'}; // mutable singleton
function setCurrency(code,rate){
  CURRENCY.code=code; CURRENCY.rate=rate||1;
  CURRENCY.symbol=code==='THB'?'฿':code==='EUR'?'€':code==='GBP'?'£':code==='JPY'?'¥':'$';
  window.dispatchEvent(new CustomEvent('currency-changed',{detail:{code,rate}}));
}
const fmtC=n=>{
  if(n==null||isNaN(n))return CURRENCY.symbol+'—';
  const v=Math.abs(n)*CURRENCY.rate;
  return CURRENCY.symbol+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const fmtP=n=>(n==null||isNaN(n))?'—':(n>=0?'+':'')+n.toFixed(2)+'%';
const fmtB=n=>{
  if(n==null||isNaN(n))return CURRENCY.symbol+'—';
  const v=Math.abs(n)*CURRENCY.rate,s=n<0?'-':'';
  if(v>=1e12)return s+CURRENCY.symbol+(v/1e12).toFixed(2)+'T';
  if(v>=1e9)return s+CURRENCY.symbol+(v/1e9).toFixed(2)+'B';
  if(v>=1e6)return s+CURRENCY.symbol+(v/1e6).toFixed(2)+'M';
  if(v>=1e3)return s+CURRENCY.symbol+(v/1e3).toFixed(1)+'K';
  return s+CURRENCY.symbol+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
// React hook: re-renders the calling component whenever the currency changes.
function useCurrency(){
  const[,force]=useState(0);
  useEffect(()=>{
    const h=()=>force(x=>x+1);
    window.addEventListener('currency-changed',h);
    return()=>window.removeEventListener('currency-changed',h);
  },[]);
  return CURRENCY;
}

// Fetch the latest exchange rate (USD → quoteCcy). Uses a free FX API via
// the local CORS-bypass proxy. Cached in localStorage for 6h to avoid hammering.
const FX_CACHE_KEY='ptv3-fx-rates';
const FX_MAX_AGE_MS=6*60*60*1000; // 6 hours
async function fetchFxRate(quoteCcy){
  if(quoteCcy==='USD') return 1;
  // Cache check
  try{
    const cache=JSON.parse(localStorage.getItem(FX_CACHE_KEY)||'{}');
    if(cache[quoteCcy] && (Date.now()-cache[quoteCcy].fetchedAt < FX_MAX_AGE_MS)){
      return cache[quoteCcy].rate;
    }
  }catch{}
  const baseUrl=`https://open.er-api.com/v6/latest/USD`;
  const proxied=proxyWrap(baseUrl)||baseUrl;
  try{
    const r=await fetch(proxied,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const rate=j?.rates?.[quoteCcy];
    if(!rate||rate<=0) throw new Error('No rate for '+quoteCcy);
    // Update cache (preserve other currencies)
    try{
      const cache=JSON.parse(localStorage.getItem(FX_CACHE_KEY)||'{}');
      cache[quoteCcy]={rate, fetchedAt:Date.now()};
      localStorage.setItem(FX_CACHE_KEY, JSON.stringify(cache));
    }catch{}
    return rate;
  }catch(e){
    console.warn('[FX] Rate fetch failed for',quoteCcy,e.message);
    return null;
  }
}

function maybeCreateBackup(data){
  if(!data) return;
  const list=loadBackups();
  const lastAt=list[0]?.savedAt || 0;
  if(Date.now()-lastAt < BACKUP_MIN_INTERVAL) return; // too soon
  const snap={savedAt:Date.now(), date:today(), data:JSON.stringify(data)};
  // Keep last 3 backups (was 7). Each snapshot is a full JSON of all portfolios
  // (~100-300KB on a real portfolio), so 7 risked Android's ~5MB localStorage quota.
  // 3 still gives a rollback window without endangering primary data writes.
  const next=[snap, ...list].slice(0,3);
  saveBackups(next);
  console.log(`[Backup] Saved snapshot at ${new Date(snap.savedAt).toLocaleString()} (${next.length} total)`);
}

/* ─── price API ────────────────────────────────────────────────────────
   Two-source fetch with localStorage cache. Tracks only the daily close.
     Source A: Stooq direct CSV   — US stocks/ETFs, has CORS, works from file://
     Source B: Yahoo /chart/{sym} — fallback for crypto + non-US tickers
   The /v7/quote endpoint Yahoo used to expose is now crumb-cookie gated and
   returns 401 — we no longer attempt it. */

// Yahoo chart-endpoint price fetch — works without crumb cookies.
async function getPricesViaChart(symbols){
  const out={};
  const BATCH=4; // lowered from 8 — slower & more reliable on the local proxy
  for(let i=0;i<symbols.length;i+=BATCH){
    const slice=symbols.slice(i,i+BATCH);
    const results=await Promise.all(slice.map(async sym=>{
      try{
        const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=2d`;
        const r=await fetchWithFallback(url, {}, 8000);
        const j=await r.json();
        const meta=j?.chart?.result?.[0]?.meta;
        if(meta?.regularMarketPrice==null)return null;
        const price=Number(meta.regularMarketPrice);
        const prev=Number(meta.previousClose??meta.chartPreviousClose??price);
        const change=price-prev;
        const pct=prev!==0?(change/prev*100):0;
        return[sym,{
          price,change,pct,
          name:sym, marketCap:null,
          asOf:today(), fetchedAt:Date.now(),
        }];
      }catch{return null;}
    }));
    results.forEach(r=>{if(r)out[r[0]]=r[1];});
  }
  return out;
}

// Main price fetcher. Caches in localStorage and skips symbols with fresh
// entries (within PRICE_FRESH_MS). Pass {force:true} to bypass the cache.
async function getPrices(symbols, opts={}){
  if(!symbols.length) return{};
  const force=opts.force===true;
  const cache=loadPriceCache();
  const now=Date.now();

  // 1) Serve fresh cache entries immediately.
  const out={};
  const stale=[];
  for(const s of symbols){
    const c=cache[s];
    if(!force && c && c.price!=null && (now-c.fetchedAt < PRICE_FRESH_MS)){
      out[s]=c;
    } else {
      stale.push(s);
    }
  }
  if(!stale.length){
    console.log(`[Prices] All ${symbols.length} symbols served from cache`);
    return out;
  }
  console.log(`[Prices] ${Object.keys(out).length} cached, fetching ${stale.length} stale`);

  // 2) Try Stooq for stale symbols.
  try{
    const stooq=await getPricesViaStooq(stale);
    Object.assign(out, stooq);
    if(Object.keys(stooq).length>0){
      console.log(`[Prices] Stooq returned ${Object.keys(stooq).length}/${stale.length}`);
    }
  }catch(e){
    console.warn('[Prices] Stooq batch failed:', e.message);
  }

  // 3) For anything Stooq missed (crypto, non-US tickers), try Yahoo /chart.
  const stillMissing=stale.filter(s=>!out[s]||out[s].price==null);
  if(stillMissing.length){
    const chart=await getPricesViaChart(stillMissing);
    Object.assign(out, chart);
    if(Object.keys(chart).length>0){
      console.log(`[Prices] Yahoo chart returned ${Object.keys(chart).length}/${stillMissing.length}`);
    }
  }

  // 4) Persist successful fetches back to the cache, preserving entries we didn't touch.
  const nextCache={...cache};
  for(const sym of stale){
    if(out[sym] && out[sym].price!=null){
      nextCache[sym]=out[sym];
    }
  }
  savePriceCache(nextCache);

  // 5) For symbols that failed THIS fetch but have a stale cache entry, surface
  //    the old price (better than showing nothing) — caller can detect via
  //    out[sym].fetchedAt being old if they care.
  for(const sym of stale){
    if((!out[sym] || out[sym].price==null) && cache[sym]?.price!=null){
      out[sym]=cache[sym];
    }
  }

  return out;
}

/* ─── single-symbol validation (used by Add Holding modal) ─── */
async function validateTicker(symbol,type){
  let sym=(symbol||'').trim().toUpperCase();
  if(!sym)return{ok:false,error:'Empty'};
  if(type==='crypto'&&!sym.includes('-'))sym+='-USD';
  try{
    const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=1d`;
    const r=await fetchWithFallback(url);
    const j=await r.json();
    const desc=j?.chart?.error?.description;
    if(desc)return{ok:false,error:desc,symbol:sym};
    const meta=j?.chart?.result?.[0]?.meta;
    const price=meta?.regularMarketPrice;
    if(price==null)return{ok:false,error:'No price in response',symbol:sym};
    return{ok:true,symbol:sym,price:Number(price),currency:meta?.currency||null,exchangeName:meta?.fullExchangeName||meta?.exchangeName||null,instrumentType:meta?.instrumentType||null};
  }catch(e){return{ok:false,error:e.message||'fetch failed',symbol:sym};}
}

/* ── realized P&L by tax year using FIFO lot matching ──
   For each holding, walk trades in date order. Each buy creates a "lot" with
   {date, sharesRemaining, costPerShare}. Each sell pops shares from the oldest
   lot(s) and records a realized event with the held-duration. Returns:
     [{year, shortTerm, longTerm, total, events:[{sym,saleDate,buyDate,shares,proceeds,cost,pl,days,longTerm}]}]
   Short-term = held < 365 days, Long-term = held >= 365 days. */
function computeRealizedByYear(holdings){
  const events=[];
  for(const h of (holdings||[])){
    const trades=[...(h.trades||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const lots=[]; // FIFO queue
    for(const t of trades){
      if(t.type==='buy'){
        lots.push({date:t.date, remaining:t.shares, costPerShare:t.price});
      } else if(t.type==='sell'){
        let sharesToSell=t.shares;
        while(sharesToSell>0.00001 && lots.length){
          const lot=lots[0];
          const take=Math.min(sharesToSell, lot.remaining);
          const proceeds=take*t.price;
          const cost=take*lot.costPerShare;
          const days=Math.floor((new Date(t.date)-new Date(lot.date))/(1000*60*60*24));
          events.push({
            sym:h.symbol,
            saleDate:t.date,
            buyDate:lot.date,
            shares:take,
            proceeds,
            cost,
            pl:proceeds-cost,
            days,
            longTerm: days>=365,
          });
          lot.remaining-=take;
          sharesToSell-=take;
          if(lot.remaining<0.00001) lots.shift();
        }
      }
    }
  }
  // Group by tax year
  const byYear={};
  for(const e of events){
    const yr=e.saleDate.slice(0,4);
    if(!byYear[yr]) byYear[yr]={year:yr, shortTerm:0, longTerm:0, total:0, events:[]};
    if(e.longTerm) byYear[yr].longTerm+=e.pl;
    else byYear[yr].shortTerm+=e.pl;
    byYear[yr].total+=e.pl;
    byYear[yr].events.push(e);
  }
  return Object.values(byYear).sort((a,b)=>b.year.localeCompare(a.year));
}

/* ─── compute holding ─── */
function computeHolding(h,price){
  const trades=[...(h.trades||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let shares=0,totalCost=0,avgCost=0,realizedPL=0;
  for(const t of trades){
    if(t.type==='buy'){totalCost+=t.shares*t.price;shares+=t.shares;avgCost=shares>0?totalCost/shares:0;}
    else if(t.type==='sell'){realizedPL+=t.shares*(t.price-avgCost);shares-=t.shares;if(shares<0.00001){shares=0;avgCost=0;totalCost=0;}else totalCost=shares*avgCost;}
  }
  const totalDividends=(h.dividends||[]).reduce((s,d)=>s+(d.totalPaid||0),0);
  const cur=price?.price??null;
  const currentValue=cur!=null?shares*cur:shares*avgCost;
  const costBasis=shares*avgCost;
  const pl=currentValue-costBasis;
  const plP=costBasis>0?(pl/costBasis)*100:0;
  const totalReturn=pl+realizedPL+totalDividends;
  return{shares,avgCost,cost:costBasis,val:currentValue,pl,plP,realizedPL,dividends:totalDividends,totalReturn,
    dayChange:cur!=null?shares*(price?.change??0):0,dayP:price?.pct??null,marketCap:price?.marketCap??null,
    symbol:h.symbol,hasPriceData:cur!=null};
}

/* ─── toast ─── */
function useToast(){
  const[toasts,set]=useState([]);
  const add=useCallback((msg,type='info')=>{const id=Date.now();set(p=>[...p,{id,msg,type}]);setTimeout(()=>set(p=>p.filter(t=>t.id!==id)),3200);},[]);
  return{toasts,add};

function Toasts({toasts}){

/* ─── Promise-based confirm / prompt / alert (replaces native blocking dialogs)
   Native confirm()/prompt()/alert() render poorly on iOS PWAs and don't match
   the app's dark theme. These wrappers resolve a Promise once the user clicks
   OK / Cancel / closes the modal. The DialogHost component (mounted once in
   App) renders the actual UI; the module-level setter is wired up on mount. */
let _setDialogState=null;
function uiAlert(message,opts={}){
  return new Promise(resolve=>{
    if(!_setDialogState){ alert(message); resolve(); return; }
    _setDialogState({kind:'alert', message, title:opts.title||'Notice', okLabel:opts.okLabel||'OK', resolve});
  });
}
function uiConfirm(message,opts={}){
  return new Promise(resolve=>{
    if(!_setDialogState){ resolve(confirm(message)); return; }
    _setDialogState({kind:'confirm', message,
      title:opts.title||'Confirm', okLabel:opts.okLabel||'OK',
      cancelLabel:opts.cancelLabel||'Cancel', danger:!!opts.danger, resolve});
  });
}
function uiPrompt(message,defaultValue='',opts={}){
  return new Promise(resolve=>{
    if(!_setDialogState){ resolve(prompt(message,defaultValue)); return; }
    _setDialogState({kind:'prompt', message, defaultValue,
      title:opts.title||'', okLabel:opts.okLabel||'OK',
      cancelLabel:opts.cancelLabel||'Cancel', placeholder:opts.placeholder||'', resolve});
  });
}
/* ─── iOS PWA install hint ──────────────────────────────────────────────
   iOS Safari does NOT show a "Install" prompt — users have to know to tap
   Share → Add to Home Screen. We render a small dismissible banner once,
   only when:
     - The device is iPhone / iPad (Safari only — Chrome on iOS can't install PWAs)
     - The app is NOT already running in standalone mode (i.e. not yet installed)
     - The user hasn't dismissed it before (localStorage flag)
   On Android Chrome we DON'T need this — Chrome shows its own install bar. */
const INSTALL_HINT_KEY='ptv3-install-hint-dismissed';
function InstallHint(){
  const[show,setShow]=useState(false);
  useEffect(()=>{
    if(typeof navigator==='undefined') return;
    const ua=navigator.userAgent||'';
    const isIos=/iPhone|iPad|iPod/i.test(ua);
    if(!isIos) return;
    // Chrome / Firefox on iOS still report Safari in the UA, but they can't
    // install PWAs — filter them out by their telltale tokens.
    if(/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua)) return;
    const standalone=window.navigator.standalone===true
      || window.matchMedia?.('(display-mode: standalone)').matches;
    if(standalone) return;
    if(localStorage.getItem(INSTALL_HINT_KEY)==='1') return;
    setShow(true);
  },[]);
  if(!show) return null;
  function dismiss(){
    try{ localStorage.setItem(INSTALL_HINT_KEY,'1'); }catch{}
    setShow(false);
  }
  return(
    <div style={{position:'fixed',left:12,right:12,bottom:'calc(72px + env(safe-area-inset-bottom, 0px))',zIndex:150,background:'var(--bg2)',border:'1px solid var(--blue)',borderRadius:12,padding:'12px 14px',boxShadow:'0 8px 24px rgba(0,0,0,.4)',display:'flex',alignItems:'center',gap:10,fontSize:13}}>
      <div style={{fontSize:22}}>📲</div>
      <div style={{flex:1,lineHeight:1.4}}>
        <div style={{fontWeight:700,marginBottom:2}}>Install Portfolio</div>
        <div style={{color:'var(--muted)',fontSize:11}}>
          Tap <span style={{display:'inline-block',padding:'0 4px',border:'1px solid var(--muted)',borderRadius:3}}>⬆</span> Share → <strong>Add to Home Screen</strong>
        </div>
      </div>
      <button onClick={dismiss}className="btn-del"style={{fontSize:18,padding:'4px 8px'}}>✕</button>
    </div>
  );
}

function DialogHost(){
  const[state,setState]=useState(null);
  const[input,setInput]=useState('');
  const inputRef=useRef(null);
  useEffect(()=>{
    _setDialogState=s=>{
      setInput(s?.defaultValue||'');
      setState(s);
      if(s?.kind==='prompt') setTimeout(()=>inputRef.current?.focus(),30);
    };
    return()=>{_setDialogState=null;};
  },[]);
  if(!state) return null;
  const close=result=>{
    const r=state.resolve;
    setState(null);
    r(result);
  };
  const dismiss=()=>close(state.kind==='confirm'?false:state.kind==='prompt'?null:undefined);
  const accept=()=>close(state.kind==='confirm'?true:state.kind==='prompt'?input:undefined);
  return(
    <Modal title={state.title||(state.kind==='confirm'?'Confirm':state.kind==='prompt'?'Enter':'Notice')}onClose={dismiss}>
      <div style={{fontSize:14,color:'var(--text)',whiteSpace:'pre-wrap',lineHeight:1.5,marginBottom:14}}>{state.message}</div>
      {state.kind==='prompt'&&(
        <div className="fg"style={{marginBottom:14}}>
          <input ref={inputRef}value={input}placeholder={state.placeholder}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();accept();}}}/>
        </div>
      )}
      <div className="form-actions">
        {state.kind!=='alert'&&(
          <button className="btn btn-ghost"onClick={dismiss}>{state.cancelLabel}</button>
        )}
        <button className="btn btn-primary"
          style={state.danger?{background:'var(--red)'}:undefined}
          onClick={accept}>{state.okLabel}</button>
      </div>
    </Modal>
  );
}

/* ─── CSV Import ──────────────────────────────────────────────────────
   Generic CSV transaction importer. Accepts any CSV with at least:
     symbol | date | type (buy/sell) | shares | price [ | notes ]
   Auto-detects common broker column names. User can manually map columns.
   Each row becomes one trade appended to the matching holding (creating the
   holding if necessary). Replaces photo OCR for users whose broker provides
   a CSV export. */
function parseCSV(text){
  // Minimal CSV parser supporting quoted fields and embedded commas. Returns
  // {headers:[], rows:[[]]}. Tolerates trailing newlines and CRLF.
  const lines=text.replace(/\r\n/g,'\n').split('\n').filter(l=>l.trim().length>0);
  if(!lines.length) return{headers:[], rows:[]};
  const splitLine=line=>{
    const out=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){
        if(inQ && line[i+1]==='"'){ cur+='"'; i++; continue; }
        inQ=!inQ;
      } else if(c===',' && !inQ){
        out.push(cur); cur='';
      } else { cur+=c; }
    }
    out.push(cur);
    return out.map(x=>x.trim());
  };
  const headers=splitLine(lines[0]);
  const rows=lines.slice(1).map(splitLine);
  return{headers, rows};
}

const CSV_HEADER_HINTS={
  symbol: ['symbol','ticker','stock','code','sym','asset'],
  date:   ['date','trade date','transaction date','executed at','time','timestamp'],
  type:   ['type','action','side','operation','transaction','direction'],
  shares: ['shares','quantity','qty','amount','units','volume'],
  price:  ['price','unit price','price per share','executed price','rate','cost'],
  notes:  ['notes','memo','comment','description','remark','reference'],
};
function autoMap(headers){
  const map={};
  const norm=h=>h.toLowerCase().trim();
  for(const field of Object.keys(CSV_HEADER_HINTS)){
    for(let i=0;i<headers.length;i++){
      const h=norm(headers[i]);
      if(CSV_HEADER_HINTS[field].some(hint=>h===hint || h.includes(hint))){
        map[field]=i;
        break;
      }
    }
  }
  return map;
}

function normTradeType(raw){
  const s=(raw||'').toLowerCase().trim();
  if(['buy','bought','b','purchase','+','long','deposit','add'].some(k=>s.includes(k))) return'buy';
  if(['sell','sold','s','sale','-','short','withdraw','remove'].some(k=>s.includes(k))) return'sell';
  return null;
}
function normDate(raw){
  if(!raw) return null;
  const s=raw.trim();
  // YYYY-MM-DD already
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // MM/DD/YYYY or DD/MM/YYYY — assume MM/DD/YYYY (US-style; most broker exports)
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){ return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  // DD-MM-YYYY
  m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
  if(m){ return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  // ISO with time
  m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(m){ return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`; }
  // Try Date.parse as last resort
  const dt=new Date(s);
  if(!isNaN(dt)) return dt.toISOString().slice(0,10);
  return null;
}
function normNumber(raw){
  if(!raw) return null;
  const cleaned=String(raw).replace(/[^0-9.\-]/g,'');
  const n=parseFloat(cleaned);
  return isNaN(n)?null:Math.abs(n);
}

function CsvImportModal({existingHoldings, onClose, onImport}){
  const fRef=useRef();
  const[csv,setCsv]=useState('');
  const[parsed,setParsed]=useState(null);
  const[map,setMap]=useState({});
  const[error,setError]=useState('');
  const[step,setStep]=useState(1); // 1: pick file, 2: map, 3: review

  function handleFile(file){
    const r=new FileReader();
    r.onload=e=>{
      const text=e.target.result;
      setCsv(text);
      const p=parseCSV(text);
      if(!p.headers.length){ setError('CSV is empty or unreadable.'); return; }
      setParsed(p);
      setMap(autoMap(p.headers));
      setError('');
      setStep(2);
    };
    r.readAsText(file);
  }
  function onDrop(e){
    e.preventDefault();
    const f=e.dataTransfer.files[0];
    if(f) handleFile(f);
  }

  // Compute preview trades from current mapping
  const preview=useMemo(()=>{
    if(!parsed) return{trades:[], errors:[]};
    const trades=[], errors=[];
    const need=['symbol','date','type','shares','price'];
    for(const f of need){
      if(map[f]==null){ errors.push(`Missing column for "${f}"`); }
    }
    if(errors.length) return{trades,errors};
    parsed.rows.forEach((row,i)=>{
      const sym=(row[map.symbol]||'').trim().toUpperCase();
      const date=normDate(row[map.date]);
      const type=normTradeType(row[map.type]);
      const shares=normNumber(row[map.shares]);
      const price=normNumber(row[map.price]);
      const notes=map.notes!=null?(row[map.notes]||''):'';
      const rowErrors=[];
      if(!sym) rowErrors.push('symbol');
      if(!date) rowErrors.push('date');
      if(!type) rowErrors.push('type');
      if(!shares || shares<=0) rowErrors.push('shares');
      if(!price || price<=0) rowErrors.push('price');
      if(rowErrors.length){ errors.push(`Row ${i+2}: invalid ${rowErrors.join(', ')}`); return; }
      trades.push({sym, date, type, shares, price, notes});
    });
    return{trades, errors};
  },[parsed, map]);

  function doImport(){
    if(!preview.trades.length){ uiAlert('Nothing to import.'); return; }
    // Group by symbol → array of trades
    const bySym={};
    for(const t of preview.trades){
      if(!bySym[t.sym]) bySym[t.sym]=[];
      bySym[t.sym].push({
        id:newId(), date:t.date, type:t.type, shares:t.shares, price:t.price, notes:t.notes||''
      });
    }
    // Build holdings array using same shape importHoldings expects
    const holdings=Object.entries(bySym).map(([sym,trades])=>{
      const existing=existingHoldings.find(h=>h.symbol===sym);
      return{
        id: existing?.id || newId(),
        symbol: sym,
        type: existing?.type || (sym.endsWith('-USD')?'crypto':'stock'),
        notes: existing?.notes || '',
        // For existing holdings, append; for new, start fresh
        trades: existing ? [...(existing.trades||[]), ...trades] : trades,
        dividends: existing?.dividends || [],
      };
    });
    onImport(holdings);
  }

  return(
    <Modal title="Import Trades from CSV" maxWidth={700} onClose={onClose}>
      {step===1 && (
        <div>
          <p style={{fontSize:13,color:'var(--muted)',marginBottom:14}}>
            Drop a CSV file with one row per trade. We'll auto-detect columns like
            <code style={{background:'rgba(0,0,0,.25)',padding:'1px 5px',borderRadius:3,margin:'0 3px'}}>symbol</code>
            <code style={{background:'rgba(0,0,0,.25)',padding:'1px 5px',borderRadius:3,margin:'0 3px'}}>date</code>
            <code style={{background:'rgba(0,0,0,.25)',padding:'1px 5px',borderRadius:3,margin:'0 3px'}}>type</code>
            <code style={{background:'rgba(0,0,0,.25)',padding:'1px 5px',borderRadius:3,margin:'0 3px'}}>shares</code>
            <code style={{background:'rgba(0,0,0,.25)',padding:'1px 5px',borderRadius:3,margin:'0 3px'}}>price</code>
            and let you confirm before importing.
          </p>
          <div className="drop-zone"
            onClick={()=>fRef.current?.click()}
            onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('over');}}
            onDragLeave={e=>e.currentTarget.classList.remove('over')}
            onDrop={onDrop}>
            <div style={{fontSize:32,marginBottom:8}}>📄</div>
            <div style={{fontWeight:600,marginBottom:4}}>Drop CSV file or click to pick</div>
            <div style={{fontSize:11,color:'var(--dim)'}}>e.g. broker export, exported trade history</div>
          </div>
          <input ref={fRef} type="file" accept=".csv,.txt" style={{display:'none'}}
            onChange={e=>e.target.files[0]&&handleFile(e.target.files[0])}/>
          {error && <div className="alert alert-err" style={{marginTop:10}}>{error}</div>}
          <details style={{marginTop:14,fontSize:12,color:'var(--muted)'}}>
            <summary style={{cursor:'pointer'}}>Or paste CSV text directly</summary>
            <textarea
              placeholder={'symbol,date,type,shares,price,notes\nAAPL,2024-01-15,buy,10,180.50,Initial buy'}
              value={csv} onChange={e=>setCsv(e.target.value)}

            Will import <strong>{preview.trades.length}</strong> trade{preview.trades.length!==1?'s':''} across <strong>{new Set(preview.trades.map(t=>t.sym)).size}</strong> ticker{new Set(preview.trades.map(t=>t.sym)).size!==1?'s':''}.
          </div>
          <div style={{maxHeight:280,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6}}>
            <table className="mini-t" style={{margin:0}}>
              <thead>
                <tr><th>Symbol</th><th>Date</th><th>Type</th><th>Shares</th><th>Price</th></tr>
              </thead>
              <tbody>
                {preview.trades.slice(0,200).map((t,i)=>(
                  <tr key={i}>
                    <td style={{fontWeight:600}}>{t.sym}</td>
                    <td>{t.date}</td>
                    <td className={t.type==='buy'?'buy-lbl':'sell-lbl'}>{t.type.toUpperCase()}</td>
                    <td>{fmt(t.shares,4)}</td>
                    <td>${fmt(t.price)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {preview.trades.length>200 && (
              <div style={{padding:'8px 10px',fontSize:11,color:'var(--dim)',textAlign:'center'}}>
                + {preview.trades.length-200} more rows…
              </div>
            )}
          </div>
          <div className="form-actions">
            <button className="btn btn-ghost" onClick={()=>setStep(2)}>← Back</button>
            <button className="btn btn-primary" onClick={doImport} disabled={!preview.trades.length}>
              ✓ Import {preview.trades.length} trade{preview.trades.length!==1?'s':''}
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ─── Photo Import — clean rewrite v3.0 (2026-05-21) ──────────────────── */
//
// Pipeline:
//   1) User picks/drops a screenshot.
//   2) Tesseract.js OCRs the image to plain text.
//   3) parsePhoto() detects the broker format (Webull / Dime! / generic) and
//      extracts {sym, holdingUSD, pendingCostBasis} per row, or for Webull
//      {sym, shares, cost} directly.
//   4) For rows that have holdingUSD but no shares, enrichWithLivePrices()
//      fetches current market prices and computes shares = holdingUSD / price
//      and (if cost basis is known) avg cost = costBasis / shares.
//   5) Review screen lets the user edit/correct anything before importing.
//
// Key design choices:
//   - One screenshot is enough — live prices supply what's missing.
//   - PnL detection requires |value| ≥ 10% of holding (rules out daily change).
//   - Fuzzy ticker correction only fires when ≥40% of primary lookups succeeded
//     (avoids producing wrong matches like ALMU → AMU when proxies are down).
//   - Manual price entry stays available per row as a graceful fallback.

// ── Constants ────────────────────────────────────────────────────────────

const TICKER_SKIP = new Set([
  // Currencies & generic financial terms
  'USD','THB','EUR','GBP','JPY','CNY','HKD','SGD','TWD','KRW','INR','BTC',
  'TOTAL','VALUE','PRICE','SHARES','QTY','HOLDING','POSITION','MARKET',
  'OPEN','CLOSE','HIGH','LOW','LAST','AVG','BUY','SELL','PNL','GAIN','LOSS',
  'DAY','YEAR','MONTH','YTD','NET','GROSS','PROFIT','REALIZED','UNREALIZED',
  'BALANCE','AMOUNT','DEPOSIT','WITHDRAW','TRANSFER','ACCOUNT','PORTFOLIO',
  // App nav / chrome
  'STOCK','CRYPTO','BOND','OPTION','FUTURE','INDEX','ETF','FUND','ASSETS',
  'NEWS','TRADE','ORDER','HISTORY','ALERT','WATCH','CHART','MENU','HOME',
  'CURRENT','SETTINGS','PROFILE','MORE','VIEW','BACK','NEXT','SORT','FILTER',
  'SEARCH','EQUIT','ANALYTICS','DOCUMENT','FUNDING','ACTIVITY','ORDERS',
  // Broker names / brand
  'WEBULL','DIME','IBKR','SCHWAB','FIDELITY','ROBINHOOD','TRADESTATION',
  // Webull Thailand UI words that look like tickers
  'DRIP','PORTS','THAILAND','WATCHLISTS','DOCUMENTS','PORTFOLIO',
  // Common COMPANY-NAME suffixes / parts (appear after the real ticker on adjacent lines)
  'INC','CORP','CORPORATION','LTD','LLC','PLC','SA','AG','NV','GMBH','CO','GROUP',
  'HOLDINGS','HOLDING','PHARMA','TECH','TECHNOLOGIES','INDUSTRIES','COMPANY','COMPANIES',
  'BANK','CAPITAL','PARTNERS','FUND','TRUST','RESOURCES','ENERGY','SYSTEMS',
  // Short English particles
  'AND','FOR','THE','BUT','NOT','ALL','ANY','MY','BY','OR','IF','SO',
  'OF','TO','IS','IT','BE','AT','IN','ON','AS','AN','UP','GO','DO','US',
]);

// Number regex: optional ± sign, then digits-with-thousands-commas or plain
// decimal, then optional trailing %, USD, US$, or THB unit.
const TOKEN_RE = /([+\-])?\s*(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+\.\d+|\d+)(?:\s*(%|USD|US\$|THB))?/gi;

// ── Pure helpers ─────────────────────────────────────────────────────────

function tokenizeNumbers(text){
  const out=[];
  let m;
  TOKEN_RE.lastIndex=0;
  while((m=TOKEN_RE.exec(text))!==null){
    const sign=m[1]||'';
    const val=parseFloat(m[2].replace(/,/g,''));
    if(isNaN(val)||val<=0) continue;
    const unit=(m[3]||'').toUpperCase().replace('US$','USD');
    out.push({val,sign,unit,idx:m.index});
  }
  return out;
}

function detectFormat(text){
  // Webull check comes FIRST — "Webull Thailand" can also contain THB references
  // in its UI banners (e.g. ฟรีค่าคอมมิชชั่น banner), so we'd otherwise mis-detect
  // it as Dime!. The "US$" prefix is Webull-specific and pretty definitive.
  if(/Webull|US\$\s*\d|My\s+Positions\s*\(\s*\d+\s*\)/i.test(text)) return 'Webull';
  if(/\bTHB\b|≈\s*[\d,]+\s*THB|Dime!?|Unrealized\s+P\s*\/?\s*L/i.test(text)) return 'Dime!';
  return 'Generic';
}

// Generate 1-edit-distance variants of a ticker (deletions + common OCR
// substitutions like O↔0, I↔1, S↔5). Used to recover from OCR mis-reads.
function fuzzyTickerVariants(sym){
  const out=new Set();
  if(sym.length>=3 && sym.length<=7){
    for(let i=0;i<sym.length;i++) out.add(sym.slice(0,i)+sym.slice(i+1));
    const swaps=[['0','O'],['O','0'],['1','I'],['I','1'],['5','S'],['S','5']];
    for(const[a,b] of swaps){
      if(sym.includes(a)) out.add(sym.split(a).join(b));
    }
  }
  out.delete(sym);
  return [...out];
}

// ── Format-specific parsers ──────────────────────────────────────────────

// Dime! parser. Layout per row (P/L view):
//   [icon] TICKER  HOLDING_USD  ↗/↘ GAIN%
//          ALLOC%  ≈ THB_AMT THB  (+/- PNL_USD USD)
// We also handle Current Price view rows by trying to find a price token
// after holding. Both extractions are independent — whichever data the
// screenshot contains gets pulled.
function parseDime(text){
  // 1) Detect WHICH Dime! view via header text.
  //    "Unrealized P/L" appears as a header on the P/L view screen.
  //    If we see it, treat parens-USD as total PnL (no magnitude threshold).
  //    Otherwise be conservative — assume Current Price view and skip PnL extraction.
  const isPlView=/Unrealized\s*P\s*\/?\s*L/i.test(text);
  console.log('[Import/Dime] View:', isPlView?'P/L':'Current Price (or unknown)');

  // 2) Find ticker candidates: capital-starting word 2-7 chars, must be
  //    followed by a USD-amount-looking number within 30 chars.
  const tickRe=/\b([A-Z][A-Za-z]{1,6})\b/g;
  const candidates=[];
  let m;
  while((m=tickRe.exec(text))!==null){
    const raw=m[1];
    const upper=raw.toUpperCase();
    if(TICKER_SKIP.has(upper)) continue;
    // Dictionary-word filter: long mostly-lowercase words are English, not tickers.
    const lowerCount=raw.replace(/[A-Z]/g,'').length;
    if(raw.length>=5 && lowerCount>=3 && !/[A-Z].*[A-Z]/.test(raw)) continue;
    // Structural: a USD-amount (digits.digits, no % suffix) must follow within 30 chars.
    const after=text.slice(m.index+raw.length, m.index+raw.length+35);
    if(!/^[\s\W]{0,5}\d{1,4}\.\d{2}(?!\s*%)/.test(after)) continue;
    candidates.push({sym:upper, raw, pos:m.index, end:m.index+raw.length});
  }
  console.log('[Import/Dime] Candidates:',candidates.map(c=>c.raw));

  // 3) Build per-ticker text blocks (dedupe symbols by first occurrence).
  const seen=new Set();
  const blocks=[];
  for(let i=0;i<candidates.length;i++){
    const c=candidates[i];
    if(seen.has(c.sym)) continue;
    seen.add(c.sym);
    const nextPos=i+1<candidates.length?candidates[i+1].pos:text.length;
    blocks.push({sym:c.sym, raw:c.raw, body:text.slice(c.end,nextPos).replace(/\n/g,' ')});
  }

  // 4) Per block: extract holding + (in P/L view) the PnL → cost basis.
  //    We DELIBERATELY do not extract a "current price" token from the screenshot —
  //    that was producing bogus prices like "$2" (from OCR mis-reading the ↗ icon)
  //    and bogus shares. Live prices supply this, more reliably.
  const rows=[];
  for(const{sym,raw,body} of blocks){
    const toks=tokenizeNumbers(body);
    if(!toks.length) continue;

    // Holding: first BARE decimal value ≥ $1. Requires a decimal IMMEDIATELY in the
    // token's own text (not in a later token within a lookahead window — that was a
    // bug that let bare "2" tokens pass because "180.14%" followed within 12 chars).
    const tokenHasOwnDecimal=t=>{
      // Pull the raw matched text starting at t.idx and verify the number itself has a decimal.
      const m=body.slice(t.idx,t.idx+20).match(/^[+\-]?\s*(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+\.\d+|\d+)/);
      return m && m[1].includes('.');
    };
    const holdingTok=toks.find(t=>!t.unit&&!t.sign&&t.val>=1&&tokenHasOwnDecimal(t));
    if(!holdingTok) continue;
    const holding=holdingTok.val;

    // Mixed-case rawSym sanity: avoid 2-letter mixed-case fragments like "Ir".
    if(raw!==raw.toUpperCase() && raw.length<3) continue;

    let pendingCostBasis=null;
    if(isPlView){
      // P/L view: signed-USD token IS the PnL, no magnitude threshold.
      // (The previous 10% threshold incorrectly rejected real PnL for small-gain
      // positions like ALMU at +7%, where $3.08 PnL was < 10% of $43.24 holding.)
      let pnlTok=toks.find(t=>t.unit==='USD' && (t.sign==='+'||t.sign==='-'));
      // Sanity: PnL magnitude can't exceed 10x holding (would imply negative cost basis)
      if(pnlTok && pnlTok.val > holding*10) pnlTok=null;
      if(pnlTok){
        const sign=pnlTok.sign||'+';
        const cb=sign==='-'?holding+pnlTok.val:holding-pnlTok.val;
        if(cb>0) pendingCostBasis=parseFloat(cb.toFixed(2));
      }
    }
    // For Current Price view we don't try to extract anything beyond holding.
    // The live-price fetch downstream will fill in shares.

    const row={sym, _rawSym:raw, _holdingUSD:holding};
    if(pendingCostBasis!=null) row._pendingCostBasis=pendingCostBasis;
    console.log(`[Import/Dime] ${sym}: holding=$${holding} basis=${pendingCostBasis??'?'} (raw=${raw})`);
    rows.push(row);
  }
  return rows;
}

// Webull parser. Layout typically has lines like:
//   AAPL  US$150.00  Qty 10
// We need shares (integer) + avg price ($X.XX after "US$").
function parseWebull(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows=[];
  const seen=new Set();
  for(let i=0;i<lines.length;i++){
    // Accept both all-caps tickers AND mixed-case ones (OCR sometimes
    // mangles "RZLV" → "Rzl", "ATYR" → "AtyR"). We normalize to uppercase
    // and validate via the structural USD-amount check below.
    const matches=[...lines[i].matchAll(/\b([A-Z][A-Za-z]{1,5})\b/g)];
    for(const sm of matches){
      const raw=sm[1];
      const sym=raw.toUpperCase();
      // Dictionary-word filter
      const lowerCount=raw.replace(/[A-Z]/g,'').length;
      if(raw.length>=5 && lowerCount>=3 && !/[A-Z].*[A-Z]/.test(raw)) continue;
      if(TICKER_SKIP.has(sym) || seen.has(sym)) continue;
      // Context: this line + next 3. Trim at next ticker line to avoid bleed.
      let endLine=Math.min(i+5, lines.length);
      for(let j=i+1;j<endLine;j++){
        const nm=lines[j].match(/\b([A-Z][A-Za-z]{1,5})\b/);
        if(nm && nm[1].toUpperCase()!==sym && !TICKER_SKIP.has(nm[1].toUpperCase())){
          if(/\d+\.\d+/.test(lines[j])){ endLine=j; break; }
        }
      }
      const ctx=lines.slice(i,endLine).join(' ');
      const avgM=ctx.match(/US\$\s*(\d+\.?\d*)/);
      if(!avgM) continue;
      const avg=parseFloat(avgM[1]);
      if(avg<=0) continue;

      const toks=tokenizeNumbers(ctx);
      const bareDecimals=toks.filter(t=>
        !t.sign && (!t.unit || t.unit==='USD') &&
        t.val>0 && !Number.isInteger(t.val) && Math.abs(t.val-avg)>0.001
      ).map(t=>t.val);
      const qtyCandidates=toks.filter(t=>
        !t.sign && !t.unit && Number.isInteger(t.val) &&
        t.val>=1 && t.val<1e6 && Math.abs(t.val-avg)>0.001
      ).map(t=>t.val);

      let bestQty=null;
      let source='none';

      // STRATEGY 1: For each PAIR of bare decimals (a > b), compute qty = round(a/b)
      // and score by how well qty satisfies (a − qty×avg) ≈ a known PnL token AND
      // by how plausible the implied PnL% is. This catches the case where qty isn't
      // in OCR (OCR mangled the integer) but mkt_value and last_price are.
      if(bareDecimals.length>=2){
        let bestScore=-Infinity;
        // Also consider the absolute values of signed tokens as potential PnL matches
        const pnlCandidates=toks.filter(t=>t.val>0 && !t.unit).map(t=>Math.abs(t.val));
        for(const a of bareDecimals){
          for(const b of bareDecimals){
            if(a<=b) continue;
            const ratio=a/b;
            const qty=Math.round(ratio);
            if(qty<1 || qty>=1e6) continue;
            const ratioErr=Math.abs(ratio-qty);
            if(ratioErr>0.5) continue;
            const costBasis=qty*avg;
            // Implausible cost basis vs market value (treats a as market value)
            if(costBasis<a*0.02 || costBasis>a*50) continue;
            const impliedPnL=Math.abs(a-costBasis);
            // Score: prefer pairs where computed PnL matches an OCR token
            const pnlMatch=pnlCandidates.some(p=>Math.abs(p-impliedPnL)/Math.max(impliedPnL,0.01)<0.05);
            // Score: prefer pairs where qty also appears as an OCR integer
            const qtyInOCR=qtyCandidates.includes(qty);
            const score=(pnlMatch?100:0) + (qtyInOCR?10:0) - ratioErr*10;
            if(score>bestScore){
              bestScore=score;
              bestQty=qty;
              source=pnlMatch?'ratio+PnL-match':'ratio';
            }
          }
        }
      }

      // STRATEGY 2: if no ratio-derived qty, use first OCR integer
      if(bestQty==null && qtyCandidates.length){
        bestQty=qtyCandidates[0];
        source='ocr-integer';
      }
      if(bestQty==null) continue;

      console.log(`[Import/Webull] ${raw}→${sym}: qty=${bestQty} (${source}), avg=$${avgM[1]}, decimals=[${bareDecimals.join(',')}], ints=[${qtyCandidates.join(',')}]`);
      rows.push({sym, _rawSym:raw, shares:String(bestQty), cost:avgM[1]});
      seen.add(sym);
      break;
    }
  }
  return rows;
}

// Generic fallback: TICKER followed by two number-ish tokens on one line.
function parseGeneric(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows=[];
  const seen=new Set();
  for(const line of lines){
    const cl=line.replace(/[^\w\s.,]/g,' ');
    const m=cl.match(/\b([A-Z]{2,6})\b.*?\b(\d[\d,.]*)\b.*?\b(\d[\d,.]*)\b/);
    if(!m) continue;
    const sym=m[1];
    if(TICKER_SKIP.has(sym) || seen.has(sym)) continue;
    rows.push({sym, shares:m[2].replace(/,/g,''), cost:m[3].replace(/,/g,'')});
    seen.add(sym);
  }
  return rows;
}

// Dispatcher
function parsePhoto(text){
  const format=detectFormat(text);
  let rows;
  if(format==='Dime!') rows=parseDime(text);
  else if(format==='Webull') rows=parseWebull(text);
  else rows=parseGeneric(text);
  return{rows, format};
}

// ── Live-price enrichment ────────────────────────────────────────────────

// CONSOLIDATED: fetch live prices ONCE for all tickers, then do BOTH:
//   1) Compute shares for rows that need them (holdingUSD/livePrice)
//   2) Mark rows with _validated:true|false based on whether the ticker resolved
// This replaces the old separate enrichWithLivePrices + validateAndCorrectTickers
// (which double-fetched and exploded with many photos / many tickers).
async function enrichWithLivePrices(rows){
  const usableRows=rows.filter(r=>r.sym);
  if(!usableRows.length) return{rows, attempted:0, resolved:0, status:'noop'};

  if(typeof navigator!=='undefined' && navigator.onLine===false){
    return{rows:rows.map(r=>({...r,_validated:undefined})), attempted:usableRows.length, resolved:0, status:'offline'};
  }

  // Dedupe symbols → one API call covers everything.
  const allSyms=[...new Set(usableRows.map(r=>r.sym.toUpperCase()))];
  // Track which rows still need shares computed (Dime!-style rows).
  const needsShares=usableRows.filter(r=>r._holdingUSD!=null && !r.shares);
  console.log(`[Import] Fetching prices for ${allSyms.length} unique tickers (${needsShares.length} need shares computed):`,allSyms);

  // Scale timeout with batch size — Stooq fetches are per-symbol, so 30 tickers
  // can take 10-15s through the local proxy. Cap at 90s for very large batches.
  const timeoutMs=Math.min(90000, 20000 + allSyms.length*1500);

  const withTimeout=(p,ms,label)=>Promise.race([
    p,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error(`${label} timed out after ${ms}ms`)),ms)),
  ]);

  let priceMap={};
  try{
    priceMap=await withTimeout(getPrices(allSyms),timeoutMs,'getPrices');
  }catch(e){ console.warn('[Import] Bulk price fetch failed:',e.message); }
  const primaryHits=Object.keys(priceMap).filter(k=>priceMap[k]?.price>0).length;
  console.log(`[Import] Resolved ${primaryHits}/${allSyms.length} via primary lookup`);

  // Fuzzy correction for unresolved tickers — strict criteria to keep big batches fast:
  //   - Only attempt fuzzy if BOTH:
  //     (a) primary success rate ≥40% (proxies healthy) OR this ticker shows
  //         clear OCR mis-read signal (mixed-case original)
  //     (b) total unresolved count ≤ 8 (avoid 200+ extra requests on huge batches)
  const stillMissing=usableRows.filter(r=>!(priceMap[r.sym.toUpperCase()]?.price>0));
  const successRate=usableRows.length>0?(usableRows.length-stillMissing.length)/usableRows.length:0;
  const corrections={};
  if(stillMissing.length && stillMissing.length<=8){
    // Choose which to try fuzzy on
    const targets=stillMissing.filter(r=>{
      if(successRate>=0.4) return true;
      return r._rawSym && r._rawSym!==r._rawSym.toUpperCase();
    }).slice(0,5); // hard cap at 5 fuzzy attempts to bound latency
    if(targets.length){
      console.log(`[Import] Trying fuzzy variants for ${targets.length} ticker(s):`,targets.map(r=>r._rawSym||r.sym));
      for(const r of targets){
        const orig=r.sym.toUpperCase();
        if(corrections[orig]) continue;
        const variants=fuzzyTickerVariants(orig);
        if(!variants.length) continue;
        try{
          const vMap=await withTimeout(getPrices(variants),10000,`variants(${orig})`);
          for(const v of variants){
            if(vMap[v]?.price>0){
              console.log(`[Import] Fuzzy: ${orig} → ${v} ($${vMap[v].price})`);
              priceMap[v]=vMap[v];
              corrections[orig]=v;
              break;
            }
          }
        }catch(e){ console.warn('[Import] Variant lookup failed for',orig,e.message); }
      }
    }
  } else if(stillMissing.length>8){
    console.warn(`[Import] Skipping fuzzy — ${stillMissing.length} unresolved would mean too many extra requests`);
  }

  // Apply to rows: set shares + validation flag in one pass
  let resolvedShares=0;
  let resolvedTickers=0;
  const out=rows.map(r=>{
    if(!r.sym) return r;
    const orig=r.sym.toUpperCase();
    const effective=corrections[orig]||orig;
    const p=priceMap[effective]?.price;
    let upd={...r};
    if(p>0){
      upd.sym=effective;
      upd._validated=true;
      upd._livePrice=p;
      if(corrections[orig]) upd._tickerCorrected={from:orig, to:effective};
      resolvedTickers++;
      // Compute shares if needed (Dime!-style row with holdingUSD but no shares yet)
      if(r._holdingUSD!=null && !r.shares){
        const sh=r._holdingUSD/p;
        if(sh>=0.0001 && sh<=10_000_000){
          upd.shares=String(parseFloat(sh.toFixed(4)));
          resolvedShares++;
          if(r._pendingCostBasis!=null){
            upd.cost=String(parseFloat((r._pendingCostBasis/sh).toFixed(4)));
            upd._autoFilledCost=true;
          }
        }
      }
    } else {
      upd._validated=false;
    }
    return upd;
  });

  // Status: use shares-resolution if any shares needed, else ticker-validation rate
  let status='noop';
  if(needsShares.length>0){
    status=resolvedShares===needsShares.length?'ok':resolvedShares===0?'failed':'partial';
  } else if(allSyms.length>0){
    status=resolvedTickers===allSyms.length?'ok':resolvedTickers===0?'failed':'partial';
  }
  const attempted=needsShares.length>0?needsShares.length:allSyms.length;
  const resolved=needsShares.length>0?resolvedShares:resolvedTickers;
  console.log(`[Import] Done: ${resolvedTickers}/${allSyms.length} verified, ${resolvedShares}/${needsShares.length} shares computed (${status})`);
  return{rows:out, attempted, resolved, status};
}

// ── Ticker validation against live API ─────────────────────────────────
// (validateAndCorrectTickers was consolidated into enrichWithLivePrices above
// to avoid double-fetching prices when many photos are imported at once.)

// ── Multi-screenshot merge (for incomplete first OCR) ───────────────────

function mergeImportRows(existing, incoming){
  const map=new Map();
  for(const r of existing){ if(r.sym) map.set(r.sym.toUpperCase(),{...r}); }
  for(const r of incoming){
    const k=(r.sym||'').toUpperCase();
    if(!k) continue;
    if(!map.has(k)){ map.set(k,{...r}); continue; }
    const cur=map.get(k);
    const merged={
      ...cur,
      shares: cur.shares || r.shares,
      cost: cur.cost || r.cost,
      _holdingUSD: cur._holdingUSD ?? r._holdingUSD,
      _pendingCostBasis: cur._pendingCostBasis ?? r._pendingCostBasis,
      _livePrice: cur._livePrice ?? r._livePrice,
    };
    // If we now have shares + cost basis but no avg cost, fill it.
    if(merged.shares && !merged.cost && merged._pendingCostBasis!=null){
      const sh=parseFloat(merged.shares);
      if(sh>0){
        merged.cost=String(parseFloat((merged._pendingCostBasis/sh).toFixed(4)));
        merged._autoFilledCost=true;
      }
    }
    map.set(k,merged);
  }
  return [...map.values()];
}

// ── The React component ─────────────────────────────────────────────────

function ImportModal({onClose, onImport, existingHoldings=[]}){
  // Map of existing symbols → existing holding (for "will replace" hints)
  const existingMap=useMemo(()=>{
    const m=new Map();
    for(const h of existingHoldings) m.set(h.symbol, h);
    return m;
  },[existingHoldings]);
  // Phase machine: idle → ocr → pricing → review (or fail)
  const[phase,setPhase]=useState('idle');
  const[ocrText,setOcrText]=useState('');
  const[format,setFormat]=useState(null);
  const[uploadCount,setUploadCount]=useState(0);
  const[rows,setRows]=useState([{sym:'',type:'stock',shares:'',cost:''}]);
  const[priceStatus,setPriceStatus]=useState(null);
  const[dragOver,setDragOver]=useState(false);
  const[multiProgress,setMultiProgress]=useState(null); // {current,total,name} or null
  const fileRef=useRef();

  function reset(){
    setPhase('idle');
    setOcrText('');
    setFormat(null);
    setUploadCount(0);
    setRows([{sym:'',type:'stock',shares:'',cost:''}]);
    setPriceStatus(null);
    setMultiProgress(null);
  }

  async function loadTesseract(){
    if(window.Tesseract) return;
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/2.1.5/tesseract.min.js';
      s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  // Preprocess image for OCR: if the source has a dark background (common in mobile
  // broker apps), invert pixels so it becomes black-on-white. Tesseract's training
  // data is overwhelmingly black-on-white text, so this drastically improves
  // accuracy on dark-theme screenshots (Webull Thailand, Dime!, etc.).
  async function preprocessForOcr(file){
    try{
      const img=await new Promise((res,rej)=>{
        const i=new Image();
        i.onload=()=>res(i);
        i.onerror=rej;
        i.src=URL.createObjectURL(file);
      });
      const canvas=document.createElement('canvas');
      // Upscale slightly to give OCR more pixels to work with (helps small text).
      const scale=img.naturalWidth<1200?2:1;
      canvas.width=img.naturalWidth*scale;
      canvas.height=img.naturalHeight*scale;
      const ctx=canvas.getContext('2d');
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(img.src);

      // Sample average brightness
      const data=ctx.getImageData(0,0,canvas.width,canvas.height);
      const px=data.data;
      let sum=0;
      const sampleStep=Math.max(4, Math.floor(px.length/40000)*4); // ~10k samples
      let count=0;
      for(let i=0;i<px.length;i+=sampleStep){
        sum+=(px[i]+px[i+1]+px[i+2])/3;
        count++;
      }
      const avgBrightness=sum/count;
      const isDark=avgBrightness<128;
      console.log(`[OCR preprocess] Avg brightness: ${avgBrightness.toFixed(0)} (${isDark?'DARK → inverting':'LIGHT'}), upscale ×${scale}`);

      if(isDark){
        // Invert RGB channels (alpha untouched)
        for(let i=0;i<px.length;i+=4){
          px[i]=255-px[i];
          px[i+1]=255-px[i+1];
          px[i+2]=255-px[i+2];
        }
        ctx.putImageData(data,0,0);
      }
      return canvas;
    }catch(e){
      console.warn('[OCR preprocess] Failed, falling back to raw image:',e);
      return file;
    }
  }

  // OCR a single image file with dual-pass strategy. Returns
  //   { text: combined OCR text, rows: parsed holdings, format: detected format }
  async function ocrSingleFile(file){
    const passes=[
      {label:'original', img:file},
      {label:'preprocessed', img:await preprocessForOcr(file)},
    ];
    const passResults=[];
    for(const p of passes){
      if(!p.img) continue;
      try{
        const{data:{text:passText}}=await window.Tesseract.recognize(p.img,'eng',{logger:()=>{}});
        const{rows:passRows, format:passFmt}=parsePhoto(passText);
        console.log(`[OCR pass=${p.label}] format=${passFmt}, rows=${passRows.length}`,passRows.map(r=>r.sym));
        passResults.push({text:passText, rows:passRows, format:passFmt});
      }catch(e){ console.warn(`[OCR pass=${p.label}] failed:`,e.message); }
    }
    if(!passResults.length) throw new Error('All OCR passes failed');
    // Merge passes by ticker — keep the row with the most filled fields.
    const mergedMap=new Map();
    for(const{rows:passRows} of passResults){
      for(const r of passRows){
        const k=r.sym;
        if(!k) continue;
        const cur=mergedMap.get(k);
        if(!cur){ mergedMap.set(k,r); continue; }
        const score=x=>(x.shares?2:0)+(x.cost?2:0)+(x._pendingCostBasis!=null?1:0)+(x._holdingUSD!=null?1:0);
        if(score(r)>score(cur)) mergedMap.set(k,r);
      }
    }
    const text=passResults.length>1
      ? passResults.map(p=>`──── ${p===passResults[0]?'original':'preprocessed'} ────\n${p.text}`).join('\n\n')
      : passResults[0].text;
    return{text, rows:[...mergedMap.values()], format:passResults[0].format};
  }

  // Process one or more image files, OCR each, merge results, enrich + validate
  // ALL at once at the end. Single API call for prices instead of per-file.
  async function handleFiles(fileList, isMerge=false){
    const files=[...(fileList||[])].filter(f=>f && f.type.startsWith('image/'));
    if(!files.length) return;
    setPhase('ocr');
    setMultiProgress({current:0,total:files.length});
    try{
      await loadTesseract();
      // Accumulator: start from existing rows if merging into prior import
      let accumRows = isMerge ? rows.filter(r=>r.sym||r.shares||r.cost) : [];
      let accumOcrText = isMerge ? ocrText+'\n\n' : '';
      let lastFmt = isMerge ? format : null;
      for(let i=0;i<files.length;i++){
        const file=files[i];
        setMultiProgress({current:i+1,total:files.length,name:file.name||`Photo ${i+1}`});
        console.log(`[Import] Processing file ${i+1}/${files.length}: ${file.name||'(unnamed)'}`);
        try{
          const {text:fileText, rows:fileRows, format:fileFmt} = await ocrSingleFile(file);
          accumRows = mergeImportRows(accumRows, fileRows);
          accumOcrText += `──── Photo ${i+1}${file.name?': '+file.name:''} ────\n${fileText}\n\n`;
          lastFmt = fileFmt || lastFmt;
        }catch(e){
          console.warn(`[Import] File ${i+1} failed:`,e.message);
          accumOcrText += `──── Photo ${i+1}: (OCR failed) ────\n\n`;
        }
      }
      console.log('[Import] All files processed. Merged rows:',accumRows.length,accumRows.map(r=>r.sym));
      setMultiProgress(null);

      // Single consolidated price-fetch: computes shares (for Dime!-style rows)
      // AND validates every ticker (red flag for OCR misreads). One API roundtrip
      // total — critical when importing many photos at once.
      setPhase('pricing');
      const result = accumRows.length
        ? await enrichWithLivePrices(accumRows)
        : {rows:accumRows, attempted:0, resolved:0, status:'noop'};
      const enriched = result.rows;
      const status = {attempted:result.attempted, resolved:result.resolved, status:result.status};
      const invalidCount=enriched.filter(r=>r._validated===false).length;
      const validCount=enriched.filter(r=>r._validated===true).length;
      console.log(`[Import] Final: ${validCount} valid, ${invalidCount} unverified`);

      // Build editable rows
      const built=enriched.map(r=>({
        sym: r.sym || '',
        type: r.type || 'stock',
        shares: r.shares || '',
        cost: r.cost || '',
        _holdingUSD: r._holdingUSD,
        _pendingCostBasis: r._pendingCostBasis,
        _livePrice: r._livePrice,
        _autoFilledCost: r._autoFilledCost,
        _tickerCorrected: r._tickerCorrected,
        _rawSym: r._rawSym,
        _validated: r._validated,
      }));

      setOcrText(accumOcrText.trim());
      setFormat(lastFmt);
      setRows(built.length?built:[{sym:'',type:'stock',shares:'',cost:''}]);
      setUploadCount(c=>c+files.length);
      setPriceStatus(status);
      setPhase('review');
    }catch(e){
      console.error('[Import] OCR pipeline failed:',e);
      setMultiProgress(null);
      setPhase('fail');
    }
  }

  async function retryPricing(){
    setPhase('pricing');
    // Strip shares from rows that only had them via live price so they get re-resolved
    const target=rows.map(r=>(r._livePrice && !r._autoFilledCost) ? r : r);
    const result=await enrichWithLivePrices(target);
    setRows(result.rows.map(r=>({...r, type:r.type||'stock'})));
    setPriceStatus({attempted:result.attempted, resolved:result.resolved, status:result.status});
    setPhase('review');
  }

  function updateRow(i, key, val){
    setRows(rs=>rs.map((r,idx)=>{
      if(idx!==i) return r;
      const upd={...r,[key]:val};
      if(key==='_manualPrice'){
        const price=parseFloat(val);
        if(price>0 && r._holdingUSD!=null){
          const sh=r._holdingUSD/price;
          if(sh>=0.0001 && sh<=10_000_000){
            upd.shares=String(parseFloat(sh.toFixed(4)));
            upd._livePrice=price;
            if(r._pendingCostBasis!=null){
              upd.cost=String(parseFloat((r._pendingCostBasis/sh).toFixed(4)));
              upd._autoFilledCost=true;
            }
          }
        } else if(!val && r._livePrice){
          upd.shares=''; upd.cost=''; upd._livePrice=null; upd._autoFilledCost=false;
        }
      } else if(key==='shares'){
        const sh=parseFloat(val);
        if(r._pendingCostBasis!=null && (!r.cost || r._autoFilledCost) && sh>0){
          upd.cost=String(parseFloat((r._pendingCostBasis/sh).toFixed(4)));
          upd._autoFilledCost=true;
        } else if(r._autoFilledCost && !(sh>0)){
          upd.cost='';
        }
      } else if(key==='cost'){
        upd._autoFilledCost=false;
      } else if(key==='sym'){
        // User manually edited the symbol — clear the "unverified" flag so the red
        // warning disappears. They've taken responsibility for the symbol's correctness.
        // We also clear _tickerCorrected since the user-typed sym overrides any prior fuzzy correction.
        if(r._validated===false) upd._validated=undefined;
        if(r._tickerCorrected) upd._tickerCorrected=undefined;
      }
      return upd;
    }));
  }

  // Validate a single row's symbol against the live API (used when user clicks
  // a "✓ Verify" button on an unvalidated row after editing the symbol).
  async function verifyRowSymbol(i){
    const r=rows[i];
    if(!r||!r.sym) return;
    setRows(rs=>rs.map((x,idx)=>idx===i?{...x,_validating:true}:x));
    try{
      const map=await getPrices([r.sym.toUpperCase()]);
      const p=map[r.sym.toUpperCase()]?.price;
      setRows(rs=>rs.map((x,idx)=>idx===i?{
        ...x,
        _validating:false,
        _validated: p>0 ? true : false,
        _livePrice: p>0 ? p : x._livePrice,
      }:x));
    }catch(e){
      console.warn('[Import] verify failed for',r.sym,e);
      setRows(rs=>rs.map((x,idx)=>idx===i?{...x,_validating:false}:x));
    }
  }

  function doImport(){
    // Exclude rows explicitly marked as unvalidated by the live-API check
    const valid=rows.filter(r=>r.sym && r.shares && r.cost && r._validated!==false).map(r=>({
      id:newId(),
      symbol: r.type==='crypto' && !r.sym.includes('-') ? r.sym.toUpperCase()+'-USD' : r.sym.toUpperCase(),
      type:r.type,
      notes:'',
      trades:[{
        id:newId(), date:today(), type:'buy',
        shares:parseFloat(r.shares), price:parseFloat(r.cost),
        notes:`Imported via OCR (${format||'photo'})`,
      }],
      dividends:[],
    }));
    if(valid.length) onImport(valid);
  }

  const validCount=rows.filter(r=>r.sym && r.shares && r.cost && r._validated!==false).length;
  const detectedCount=rows.filter(r=>r.sym).length;
  const unverifiedCount=rows.filter(r=>r._validated===false).length;

  return(
    <Modal title="📷 Import from Photos"onClose={onClose}maxWidth={680}>
      <input ref={fileRef}type="file"accept="image/*"multiple style={{display:'none'}}
        onChange={e=>{const fs=e.target.files; handleFiles(fs, phase==='review' && rows.some(r=>r.sym)); e.target.value='';}}/>

      {phase==='idle'&&(
        <>
          <div className={`drop-zone${dragOver?' over':''}`}
            onClick={()=>fileRef.current.click()}
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={e=>{e.preventDefault();setDragOver(false);handleFiles(e.dataTransfer.files);}}>
            <div style={{fontSize:36,marginBottom:10}}>📸</div>
            <div style={{color:'var(--muted)',fontSize:13,textAlign:'center'}}>
              <strong>Click or drag screenshots</strong> of your portfolio<br/>
              <small style={{color:'var(--dim)'}}>Select multiple files to import all at once · Works with Webull, Dime!, and most broker apps</small>
            </div>
          </div>
          <div className="sep"/>
          <div style={{background:'rgba(59,130,246,.08)',border:'1px solid rgba(59,130,246,.2)',borderRadius:8,padding:'10px 14px',fontSize:12,color:'var(--muted)',lineHeight:1.6}}>
            <strong style={{color:'var(--blue)'}}>📌 Tips:</strong><br/>
            • <strong>Multi-file:</strong> hold Ctrl while clicking files (or drag-select multiple at once) — all photos OCR'd, merged, and live-priced in one batch<br/>
            • <strong>Webull</strong>: Positions view → shares + avg cost auto-fill in one shot<br/>
            • <strong>Dime!</strong>: Unrealized P/L view — live market prices fill in the shares<br/>
            • Crop tightly around the holdings list for cleaner OCR output
          </div>
        </>
      )}

      {phase==='ocr'&&(
        <div style={{textAlign:'center',padding:'40px 0'}}>
          <div className="spin"style={{width:40,height:40,margin:'0 auto 14px'}}/>
          {multiProgress ? (
            <>
              <p style={{color:'var(--muted)',marginBottom:6}}>
                Reading photo <strong>{multiProgress.current}</strong> of <strong>{multiProgress.total}</strong>
                {multiProgress.name && <span style={{color:'var(--dim)'}}> · {multiProgress.name}</span>}
              </p>
              <div style={{width:280,height:6,margin:'0 auto',background:'rgba(255,255,255,.08)',borderRadius:3,overflow:'hidden'}}>
                <div style={{width:`${Math.round(multiProgress.current/multiProgress.total*100)}%`,height:'100%',background:'var(--blue)',transition:'width 0.3s'}}/>
              </div>
            </>
          ) : (
            <p style={{color:'var(--muted)'}}>Reading screenshot…</p>
          )}
        </div>
      )}

      {phase==='pricing'&&(
        <div style={{textAlign:'center',padding:'40px 0'}}>
          <div className="spin"style={{width:40,height:40,margin:'0 auto 14px'}}/>
          <p style={{color:'var(--muted)'}}>Fetching live prices…</p>
          {rows.filter(r=>r.sym).length>10&&(
            <p style={{color:'var(--dim)',fontSize:11,marginTop:6}}>
              {rows.filter(r=>r.sym).length} tickers — this may take 30-60 seconds.
            </p>
          )}
        </div>
      )}

      {phase==='fail'&&(
        <div className="alert alert-err">
          Couldn't read the image. Try a clearer screenshot, or fill the table manually.
          <button className="btn btn-ghost btn-sm"onClick={reset}style={{marginLeft:10}}>🔄 Try again</button>
        </div>
      )}

      {phase==='review'&&(
        <>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,flexWrap:'wrap',gap:6}}>
            <label style={{margin:0,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
              OCR Result
              {format&&<span style={{background:'rgba(59,130,246,.15)',color:'var(--blue)',padding:'1px 8px',borderRadius:4,fontSize:11,fontWeight:700}}>{format} detected</span>}
              {uploadCount>1&&<span style={{background:'rgba(34,197,94,.15)',color:'var(--green)',padding:'1px 8px',borderRadius:4,fontSize:11,fontWeight:700}}>{uploadCount} screenshots merged</span>}
            </label>
            <button className="btn btn-ghost btn-sm"onClick={reset}>🔄 Start over</button>
          </div>
          <div className="ocr-box">{ocrText}</div>

          {detectedCount>0?(
            <div className="alert alert-ok">
              ✓ Found {detectedCount} holding{detectedCount!==1?'s':''}{validCount<detectedCount?' — review missing fields below':''}
            </div>
          ):(
            <div className="alert alert-info">No holdings detected. Add manually below.</div>
          )}

          {unverifiedCount>0&&(
            <div style={{background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.25)',borderRadius:8,padding:'8px 12px',fontSize:12,color:'var(--red)',marginBottom:8}}>
              ⚠ <strong>{unverifiedCount} ticker{unverifiedCount!==1?'s':''} couldn't be verified</strong> via the live price API — likely OCR misreads. Each unverified row is flagged in red below. Fix the symbol or click ✕ to remove before importing.
            </div>
          )}

          {/* Pricing status banner */}
          {priceStatus&&priceStatus.attempted>0&&priceStatus.status==='ok'&&(
            <div style={{background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.3)',borderRadius:8,padding:'8px 12px',fontSize:12,color:'var(--green)',marginBottom:8}}>
              ✓ Live prices fetched for all <strong>{priceStatus.resolved}</strong> ticker(s).
            </div>
          )}
          {priceStatus&&priceStatus.status==='partial'&&(
            <div style={{background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.3)',borderRadius:8,padding:'8px 12px',fontSize:12,color:'var(--amber)',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <span>⚠ Live prices found for <strong>{priceStatus.resolved}/{priceStatus.attempted}</strong>. Enter remaining prices manually.</span>
              <button className="btn btn-sm"onClick={retryPricing}style={{padding:'4px 10px',fontSize:11}}>↻ Retry</button>
            </div>
          )}
          {priceStatus&&(priceStatus.status==='failed'||priceStatus.status==='offline')&&(
            <div style={{background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.3)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'var(--amber)',marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,gap:8,flexWrap:'wrap'}}>
                <span>⚠ Live price fetch unavailable — paste current prices in each row.</span>
                <button className="btn btn-sm"onClick={retryPricing}style={{padding:'4px 10px',fontSize:11}}>↻ Retry</button>
              </div>
              <div style={{fontSize:11,color:'var(--muted)'}}>
                {location.protocol==='file:' ? (
                  <>Best fix: launch via <code style={{background:'rgba(0,0,0,.3)',padding:'1px 4px',borderRadius:3}}>start-portfolio-tracker.bat</code> so the app runs at <code>http://localhost:8000</code> instead of <code>file://</code>.</>

                )}

          )}

          {/* Add-another-screenshot button (for incomplete first OCR) */}
          <button className="btn btn-ghost"onClick={()=>fileRef.current.click()}

          <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
            <label style={{margin:0}}>Holdings to Import</label>
            <button className="btn btn-ghost btn-sm"onClick={()=>setRows(r=>[...r,{sym:'',type:'stock',shares:'',cost:''}])}>+ Row</button>
          </div>

          {rows.map((r,i)=>(

                <select value={r.type}onChange={e=>updateRow(i,'type',e.target.value)}style={{padding:'8px 10px',fontSize:12}}>
